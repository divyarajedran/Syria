e, "mod": "SEC", "sec": ["MHPSS"], "corr": ["SEC-03"], "chg": "Restrict admin-list for CNS to own caseload; expose safe-contact and consent/assent on the counsellor case view.", "gap": "Guardian safe/unsafe assessment not available; CNS can list all facility MHPSS cases via admin-list rather than only own."}, "ROL-05": {"ref": "ROL-05", "src": 1, "status": "Not done", "pri": "High", "screen": "Safeguarding / GBV specialist", "text": "May view: The minimum necessary safeguarding, referral, and safeguarding workflow information.. May NOT routinely view: A restricted, protected role.", "section": "Detailed registration requirements", "out": true, "mod": "SEC", "sec": ["MHPSS"], "corr": ["SEC-01"], "chg": "Add a SAFEGUARDING role in role_master with minimum-necessary permissions and move safeguarding endpoints/menus to it.", "gap": "No restricted, protected role for safeguarding/GBV; work is spread over general roles."}, "ROL-06": {"ref": "ROL-06", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "M&E / MEAL at AYF", "text": "May view: Anonymized/aggregated indicators and data quality information.. May NOT routinely view: No access to identifiable sensitive narratives.", "section": "Detailed registration requirements", "out": true, "mod": "SEC", "sec": ["ADMUX"], "corr": ["SEC-01"], "chg": "Add an ME role restricted to report/mande endpoints.", "gap": "No M&E role limited to anonymised indicators."}, "ROL-07": {"ref": "ROL-07", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Finance / settlements", "text": "May view: Service/payment verification fields only.. May NOT routinely view: No access to any clinical, mental health, or GBV content.", "section": "Detailed registration requirements", "out": true, "mod": "SEC", "sec": ["BILL"], "corr": ["SEC-01"], "chg": "Verify CASH endpoint lists on clinical modules; add a finance settlements role with payment verification fields only.", "gap": "No distinct finance/settlements role; scope of CASH on patient search/billing views to clinical fields not verified."}, "ROL-08": {"ref": "ROL-08", "src": 1, "status": "Not done", "pri": "High", "screen": "Julia L1 support", "text": "May view: Account/technical metadata needed for support.. May NOT routinely view: No access to any clinical content.", "section": "Detailed registration requirements", "out": true, "mod": "SEC", "sec": [], "corr": ["SEC-01"], "chg": "Create a SUPPORT_L1 role with account/session/device metadata permissions only and no clinical endpoints.", "gap": "No support role with account/technical metadata only; ADM can read clinical content."}, "ROL-09": {"ref": "ROL-09", "src": 1, "status": "Not done", "pri": "High", "screen": "Mocero L2/L3 / technical", "text": "May view: Technical logs/settings; and exceptional diagnostic access only. May NOT routinely view: Default position: no access to clinical content.", "section": "Detailed registration requirements", "out": true, "mod": "SEC", "sec": [], "corr": ["SEC-01"], "chg": "Create a TECH role without clinical permissions and an audited, time-boxed break-glass elevation.", "gap": "Default no-clinical-access position is not implemented for technical staff; no exceptional-access approval flow."}, "ROL-10": {"ref": "ROL-10", "src": 1, "status": "Partly done", "pri": "High", "screen": "administrator", "text": "May view: with formal authorization and audit.. May NOT routinely view:", "section": "Detailed registration requirements", "out": true, "mod": "SEC", "sec": [], "corr": ["SEC-02"], "chg": "Remove clinical reads from ADM by default, add an authorization/break-glass reason prompt and extend access logging to MHPSS reads.", "gap": "Admin can view clinical content without formal authorization; audit exists for case sheet reads only."}, "ROL-11": {"ref": "ROL-11", "src": 1, "status": "Partly done", "pri": "High", "screen": "System / security administrator", "text": "May view: Identity/access management and security logs as needed.. May NOT routinely view: No routine access to the clinical narrative merely by virtue of being an administrative role.", "section": "Detailed registration requirements", "out": true, "mod": "SEC", "sec": ["AUTH"], "corr": ["SEC-02"], "chg": "Split SYSADM into security-admin permissions (IAM, logs) and remove clinical read permissions, or require break-glass.", "gap": "Security/identity admins are not separated from clinical-content permissions."}, "SCN-01-S01": {"ref": "SCN-01-S01", "src": 1, "status": "Done", "pri": "-", "screen": "Start registration", "text": "Expected application behavior: The user selects “Create new patient / register”. Point to confirm: The registration screen opens; no guardian fields appear yet.", "section": "Key end-to-end scenarios", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "SCN-01-S02": {"ref": "SCN-01-S02", "src": 1, "status": "Done", "pri": "-", "screen": "Enter date of birth", "text": "Expected application behavior: Enter a date of birth giving an age of 18 or over. Point to confirm: The system calculates the age and classifies the patient type as “adult”.", "section": "Key end-to-end scenarios", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None (see SCN-02-S02 for the blank-DOB loophole)", "gap": ""}, "SCN-01-S03": {"ref": "SCN-01-S03", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Enter minimum identity/contact and account data", "text": "Expected application behavior: Enter the name in the selected language, review the linked Arabic/English spelling where enabled, sex, phone number in +963 format, governorate/district, preferred language/contact method, and password and confirmation. Point to confirm: Mandatory fields are validated; the two passwords match; it is not poss", "section": "Key end-to-end scenarios", "out": true, "mod": "REG", "sec": [], "corr": ["REG-07"], "chg": "Add +963 phone format validation (client and server); make DOB mandatory; add sex, governorate/district and contact-method fields and send them (API already accepts governorateId/providerGenderPref); decide on linked Arabic/English name suggestion.", "gap": "Invalid phone numbers and a missing DOB do not block registration; sex, governorate/district, contact method and linked name-spelling review are not collected in the patient app."}, "SCN-01-S04": {"ref": "SCN-01-S04", "src": 1, "status": "Not done", "pri": "High", "screen": "Phone verification", "text": "Expected application behavior: Before sending the verification code, it is stated that a verification code will be sent to the number entered; the code is then sent and a valid code is entered. Point to confirm: The phone status becomes “verified”; failed/expired code behavior is controlled and logged.", "section": "Key end-to-end scenarios", "out": true, "mod": "AUTH", "sec": ["REG", "NOTIF"], "corr": ["AUTH-08"], "chg": "Add a phone_verified flag; call OTP issue after register and route to AuthOtp (purpose Registration); block activation or booking until verified; audit OTP issue/verify/fail; change the hint text until built.", "gap": "No SMS code at registration, no 'verified' phone status, so failed/expired code behaviour at sign-up is neither controlled nor logged. The on-screen statement is untrue."}, "SCN-01-S05": {"ref": "SCN-01-S05", "src": 1, "status": "Done", "pri": "Medium", "screen": "Privacy notice", "text": "Expected application behavior: The approved privacy notice is displayed in Arabic; the user accepts it. Point to confirm: The version, language, timestamp, and method are stored.", "section": "Key end-to-end scenarios", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-06"], "chg": "Remove the silent consent_version stamp at registration; publish and approve the Arabic notice (content).", "gap": ""}, "SCN-01-S06": {"ref": "SCN-01-S06", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Telehealth consent", "text": "Expected application behavior: Telehealth consent is documented separately. Point to confirm: Consent is stored separately from acceptance of the privacy notice.", "section": "Key end-to-end scenarios", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-06"], "chg": "Publish separate privacy and telehealth policy types (required, requires_reconsent) in Admin and test the gate; optionally show consent inside registration.", "gap": "Cannot confirm a separate telehealth policy is published; consent is not part of the registration steps."}, "SCN-01-S07": {"ref": "SCN-01-S07", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Safe communication", "text": "Expected application behavior: The patient selects SMS/app/call and optional privacy restrictions. Point to confirm: Preferences are saved and used for reminders.", "section": "Key end-to-end scenarios", "out": true, "mod": "REG", "sec": ["NOTIF"], "corr": ["REG-09"], "chg": "Make SP_Reminder_Tick / notification queue resolve the channel from patient_comm_pref and respect quiet hours.", "gap": "Saved channel and quiet hours do not drive reminders; only the generic-wording flag does."}, "SCN-01-S08": {"ref": "SCN-01-S08", "src": 1, "status": "Not done", "pri": "Medium", "screen": "Provider preference", "text": "Expected application behavior: The patient selects a female doctor, a language, or a specialty as they wish. Point to confirm: Search/booking takes the available preferences into account.", "section": "Key end-to-end scenarios", "out": true, "mod": "REG", "sec": ["SCHED"], "corr": ["REG-12"], "chg": "Add the preference to registration/profile; add gender and language filters (and default from the saved preference) to doctor and slot search.", "gap": "Female-doctor/language preference is neither captured in the app nor used in search or booking."}, "SCN-01-S09": {"ref": "SCN-01-S09", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Account activation, service classification, and booking", "text": "Expected application behavior: The system generates a unique patient ID; “beneficiary / insured / paid service” is selected as applicable; and the patient books a general consultation. Point to confirm: No guardian-specific journey appears; the approved service/payment category is stored and booking proceeds normally.", "section": "Key end-to-end scenarios", "out": true, "mod": "BILL", "sec": ["REG"], "corr": ["BILL-16"], "chg": "Add a beneficiary/insured/paid selector to registration and pass programCategory; link to billing category.", "gap": "Service/payment category is not selected or stored in practice."}, "SCN-01-S10": {"ref": "SCN-01-S10", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "First clinical intake", "text": "Expected application behavior: Allergies, medication, medical history, presenting complaint, and validated vital signs are documented. Point to confirm: Clinical data is stored so that only clinically authorized users can access it.", "section": "Key end-to-end scenarios", "out": true, "mod": "EMR", "sec": ["SEC"], "corr": ["EMR-07"], "chg": "Define a first-intake form (patient or nurse) and restrict ADM clinical read if policy requires.", "gap": "Clinical data is access-controlled by role, but a distinct first-intake step (allergies, medication, history, vitals) is not a defined flow; ADM can read case sheets."}, "SCN-01-S11": {"ref": "SCN-01-S11", "src": 1, "status": "Done", "pri": "-", "screen": "Completing the consultation", "text": "Expected application behavior: The doctor documents, signs, and finalizes the visit. Point to confirm: The completed clinical record is locked; any subsequent amendment is auditable.", "section": "Key end-to-end scenarios", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "SCN-01-S12": {"ref": "SCN-01-S12", "src": 1, "status": "Partly done", "pri": "High", "screen": "Audit review", "text": "Expected application behavior: The administrator/security officer reviews the audit trail. Point to confirm: Registration, verification code, consent, booking, record access, and completion events are traceable.", "section": "Key end-to-end scenarios", "out": true, "mod": "SEC", "sec": [], "corr": ["SEC-05"], "chg": "Add audit writes to sp_useraccount_selfregister, OTP issue/verify, sp_patientconsent_grant, guardian verify, assent, safeguarding set and gate denials.", "gap": "Registration, verification code and consent-grant events are not traceable; denied access is not logged."}, "SCN-02-S01": {"ref": "SCN-02-S01", "src": 1, "status": "Done", "pri": "-", "screen": "Start child registration", "text": "Expected application behavior: Enter a date of birth giving an age of 16. Point to confirm: The system switches automatically to the minor registration journey.", "section": "Key end-to-end scenarios", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "SCN-02-S02": {"ref": "SCN-02-S02", "src": 1, "status": "Partly done", "pri": "High", "screen": "Child data", "text": "Expected application behavior: Document the minimum child identity, language, and location. Point to confirm: An ordinary user cannot select the adult journey.", "section": "Key end-to-end scenarios", "out": true, "mod": "MIN", "sec": ["REG"], "corr": ["MIN-01"], "chg": "Make DOB mandatory; server-reject a Minor without a guardian; add governorate/district.", "gap": "An ordinary user can avoid the minor journey by omitting or falsifying DOB; server does not enforce guardian for a minor; child location not captured."}, "SCN-02-S03": {"ref": "SCN-02-S03", "src": 1, "status": "Done", "pri": "Low", "screen": "Guardian section", "text": "Expected application behavior: Add the mother/father/legal representative. Point to confirm: The relationship is selected from a defined list, and the guardian profile is separate.", "section": "Key end-to-end scenarios", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-03"], "chg": "Optionally require guardian name/phone.", "gap": ""}, "SCN-02-S04": {"ref": "SCN-02-S04", "src": 1, "status": "Partly done", "pri": "High", "screen": "Guardian verification", "text": "Expected application behavior: Record the approved verification method and the staff member/user who carried it out. Point to confirm: The guardian status becomes “verified” with the date, time, and name of the verifier.", "section": "Key end-to-end scenarios", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-04"], "chg": "Add a Verify guardian dialog in Pat360 (method, outcome, reason) and show verifier and timestamp; add a work queue of unverified guardians.", "gap": "No UI for staff to verify a guardian; verifier name/date-time not displayed; self-registered guardians stay unverified."}, "SCN-02-S05": {"ref": "SCN-02-S05", "src": 1, "status": "Partly done", "pri": "High", "screen": "Guardian consent", "text": "Expected application behavior: Document consent for the account, health data, telehealth, records, communications, and referral as applicable. Point to confirm: Each consent purpose/version is stored separately.", "section": "Key end-to-end scenarios", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-05"], "chg": "Add staff 'record guardian consent' UI using grant-behalf; define required purposes per policy.", "gap": "Guardian consent is not authenticated or witnessed; no staff UI to record it; purpose list for referral/communications not confirmed."}, "SCN-02-S06": {"ref": "SCN-02-S06", "src": 1, "status": "Partly done", "pri": "High", "screen": "Adolescent assent", "text": "Expected application behavior: The service is explained to the 16-year-old adolescent and their assent is recorded. Point to confirm: Assent is stored as yes/no/not possible + reason in accordance with the approved policy.", "section": "Key end-to-end scenarios", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-05"], "chg": "Wire assent UI to /assent with outcome and reason (staff or app), and read via assent-get.", "gap": "Assent outcome 'no / not possible + reason' cannot be captured; the structured assent table is unused."}, "SCN-02-S07": {"ref": "SCN-02-S07", "src": 1, "status": "Not done", "pri": "High", "screen": "Safe communication", "text": "Expected application behavior: Select whether reminders are sent to the guardian, the adolescent, both, or the clinic. Point to confirm: Notifications are delivered only through the approved channels.", "section": "Key end-to-end scenarios", "out": true, "mod": "MIN", "sec": ["NOTIF"], "corr": ["MIN-10"], "chg": "Add recipient selector and guardian contact routing to comm-pref and the reminder/recipient SPs, with safeguarding override.", "gap": "No ability to choose who receives reminders, so 'delivered only through approved channels' cannot be configured for minors."}, "SCN-02-S08": {"ref": "SCN-02-S08", "src": 1, "status": "Not done", "pri": "High", "screen": "Booking the consultation", "text": "Expected application behavior: Book an adolescent-appropriate/general consultation. Point to confirm: The doctor sees that the case is a “minor” with a “verified guardian” and the status of the required consents, without access to unnecessary guardian documents.", "section": "Key end-to-end scenarios", "out": true, "mod": "MIN", "sec": ["CONS"], "corr": ["MIN-08"], "chg": "Add a minor banner (minor, guardian verified, consent status) in the doctor consult/appointment view via a minimal-fields endpoint; optionally gate booking.", "gap": "Doctor cannot see minor status, guardian verification or consent readiness; booking is not gated on them."}, "SCN-02-S09": {"ref": "SCN-02-S09", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Clinical visit", "text": "Expected application behavior: The doctor completes the consultation and refers where needed. Point to confirm: The clinical record follows the consent/access rules applicable to minors.", "section": "Key end-to-end scenarios", "out": true, "mod": "MIN", "sec": ["EMR"], "corr": ["MIN-08"], "chg": "Define and implement minor access rules (e.g. consent check before consult/referral).", "gap": "No age-specific consent/access rules beyond the safeguarding gate."}, "SCN-02-S10": {"ref": "SCN-02-S10", "src": 1, "status": "Needs decision", "pri": "High", "screen": "Guardian data visibility test", "text": "Expected application behavior: Log in as a guardian/linked account if the feature exists. Point to confirm: The guardian sees only the information permitted by the approved policy.", "section": "Key end-to-end scenarios", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-13"], "chg": "Decide guardian visibility policy; if guardian accounts are wanted, build a caregiver account type with restricted views; otherwise accept shared login.", "gap": "The 'what a guardian may see' policy is undefined and a restricted guardian view does not exist."}, "SCN-02-S11": {"ref": "SCN-02-S11", "src": 1, "status": "Partly done", "pri": "High", "screen": "Role restriction test", "text": "Expected application behavior: Log in with a finance/L1 support account. Point to confirm: No clinical or sensitive content relating to the child is displayed.", "section": "Key end-to-end scenarios", "out": true, "mod": "SEC", "sec": [], "corr": ["SEC-01"], "chg": "Create an L1 support role without clinical scopes; tighten ADM clinical reads.", "gap": "Finance is limited, but L1 support has no defined restricted role and ADM can read clinical content."}, "SCN-02-S12": {"ref": "SCN-02-S12", "src": 1, "status": "Partly done", "pri": "High", "screen": "Audit review", "text": "Expected application behavior: Review the guardian verification, consent, assent, booking, and access logs. Point to confirm: Full traceability exists without exposing the sensitive narrative in the audit log.", "section": "Key end-to-end scenarios", "out": true, "mod": "SEC", "sec": ["MIN"], "corr": ["SEC-05"], "chg": "Add audit writes (ids and outcomes only) to guardian verify, consent grant, assent and comm-pref SPs.", "gap": "Guardian verification, consent and assent events are not in the audit trail."}, "SCN-03-S01": {"ref": "SCN-03-S01", "src": 1, "status": "Done", "pri": "-", "screen": "Minor status detection", "text": "Expected application behavior: Record a date of birth giving an age of 14. Point to confirm: The minor journey is triggered automatically.", "section": "Key end-to-end scenarios", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "SCN-03-S02": {"ref": "SCN-03-S02", "src": 1, "status": "Partly done", "pri": "High", "screen": "Guardian verification", "text": "Expected application behavior: Add and verify a safe guardian/legal representative. Point to confirm: The guardian status and consent readiness are visible to authorized roles.", "section": "Key end-to-end scenarios", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-04"], "chg": "Add verify dialog and a consent-readiness indicator for CNS/ADM/HW.", "gap": "Guardian verification cannot be performed in UI; consent readiness not visible to authorised roles."}, "SCN-03-S03": {"ref": "SCN-03-S03", "src": 1, "status": "Not done", "pri": "High", "screen": "Selecting a sensitive service", "text": "Expected application behavior: The patient selects “Talk to a counsellor / psychosocial support”. Point to confirm: The system triggers the “sensitive minor / psychosocial support” pathway.", "section": "Key end-to-end scenarios", "out": true, "mod": "MHPSS", "sec": ["MIN"], "corr": ["MHPSS-09"], "chg": "On MHPSS request, read patient_type; if Minor, apply the sensitive-minor workflow (consent/assent check, safe-contact check, flag for counsellor).", "gap": "Choosing counselling does not trigger any minor-specific pathway."}, "SCN-03-S04": {"ref": "SCN-03-S04", "src": 1, "status": "Not done", "pri": "High", "screen": "Psychosocial-support-specific consent", "text": "Expected application behavior: Document guardian consent for psychosocial support where the approved policy requires it. Point to confirm: General telehealth consent is not automatically treated as consent to psychosocial support.", "section": "Key end-to-end scenarios", "out": true, "mod": "MIN", "sec": ["MHPSS"], "corr": ["MIN-09"], "chg": "Define a 'psychosocial' consent purpose and enforce it (policy-dependent) before an MHPSS session for minors.", "gap": "No psychosocial-support consent requirement or check for minors."}, "SCN-03-S05": {"ref": "SCN-03-S05", "src": 1, "status": "Not done", "pri": "High", "screen": "Adolescent assent", "text": "Expected application behavior: Explain the counselling and privacy and record assent. Point to confirm: The assent status is recorded and made available to authorized psychosocial support staff.", "section": "Key end-to-end scenarios", "out": true, "mod": "MIN", "sec": ["MHPSS"], "corr": ["MIN-09"], "chg": "Capture assent at MHPSS start and display on the case file for CNS.", "gap": "Assent for counselling not recorded or shown to psychosocial staff."}, "SCN-03-S06": {"ref": "SCN-03-S06", "src": 1, "status": "Not done", "pri": "High", "screen": "Safe contact assessment", "text": "Expected application behavior: The authorized psychosocial support/safeguarding user determines that the guardian is safe to contact. Point to confirm: The safe contact status is stored separately from the ordinary relationship record.", "section": "Key end-to-end scenarios", "out": true, "mod": "MHPSS", "sec": [], "corr": ["MHPSS-05"], "chg": "Add SPs/endpoints/UI over safeguarding_status for CNS/safeguarding roles and use it in notification routing.", "gap": "Safe-contact status separate from the guardian relationship is not stored or settable."}, "SCN-03-S07": {"ref": "SCN-03-S07", "src": 1, "status": "Partly done", "pri": "High", "screen": "Privacy-preserving notification", "text": "Expected application behavior: Send an appointment reminder. Point to confirm: The notification uses approved generic wording and does not display “mental health/GBV” on the lock screen or in SMS unless this has been explicitly approved.", "section": "Key end-to-end scenarios", "out": true, "mod": "MHPSS", "sec": ["NOTIF"], "corr": ["MHPSS-12"], "chg": "Mark counselling appointment types as sensitive and force generic text; default generic_only on for minors.", "gap": "Generic wording applies to MHPSS event keys only, not to appointments booked with a counsellor; default for minors not forced."}, "SCN-03-S08": {"ref": "SCN-03-S08", "src": 1, "status": "Partly done", "pri": "High", "screen": "Starting the psychosocial support session / contact", "text": "Expected application behavior: The patient/survivor initiates protected contact. The counsellor’s standard “call back” option is disabled unless an approved safeguarding exception permits safe outbound contact. Point to confirm: The counsellor views only the protected case and the relevant information; registration, finance, and technical", "section": "Key end-to-end scenarios", "out": true, "mod": "MHPSS", "sec": [], "corr": ["MHPSS-08"], "chg": "Extend guard to all protected/minor sessions with an authorised exception record; redact name/concern in oversight views.", "gap": "Call-back block is limited to GBV flag; no exception workflow; admin/manager views expose case metadata."}, "SCN-03-S09": {"ref": "SCN-03-S09", "src": 1, "status": "Partly done", "pri": "High", "screen": "Risk assessment", "text": "Expected application behavior: The counsellor determines the risk level: low/medium/high/imminent. Point to confirm: The risk status drives the approved escalation behavior; high risk is not merely a color indicator.", "section": "Key end-to-end scenarios", "out": true, "mod": "MHPSS", "sec": [], "corr": ["MHPSS-01"], "chg": "Add 'CRISIS' (and imminent) to the escalation trigger; align risk scale to approved levels.", "gap": "Highest UI risk level does not trigger escalation; level names not aligned."}, "SCN-03-S10": {"ref": "SCN-03-S10", "src": 1, "status": "Partly done", "pri": "High", "screen": "Referral", "text": "Expected application behavior: Create an authorized mental health/safeguarding referral where needed. Point to confirm: Only the minimum necessary information is shared; acknowledgement of receipt and closure are followed up.", "section": "Key end-to-end scenarios", "out": true, "mod": "MHPSS", "sec": ["REF"], "corr": ["MHPSS-03"], "chg": "Add destination, due date and shared-fields policy to escalation; link to the referral module.", "gap": "No referral destination, deadline or minimum-necessary data control for MHPSS referral."}, "SCN-03-S11": {"ref": "SCN-03-S11", "src": 1, "status": "Partly done", "pri": "High", "screen": "Access check", "text": "Expected application behavior: The doctor, M&E, L1 support, and administration roles attempt to view the protected note. Point to confirm: Each role sees only the approved minimum; access denial is logged.", "section": "Key end-to-end scenarios", "out": true, "mod": "SEC", "sec": ["MHPSS"], "corr": ["SEC-03"], "chg": "Redact oversight views; log authorization failures to audit (SP_AuditLog_Write, outcome 'denied').", "gap": "Admin/manager see case metadata; denial is not logged."}, "SCN-03-S12": {"ref": "SCN-03-S12", "src": 1, "status": "Partly done", "pri": "High", "screen": "Audit and closure", "text": "Expected application behavior: Close the session/case in accordance with the workflow. Point to confirm: Consent, access, risk change, referral, and closure events are auditable.", "section": "Key end-to-end scenarios", "out": true, "mod": "SEC", "sec": ["MHPSS"], "corr": ["SEC-05"], "chg": "Add audit writes to setrisk, case close, escalation raise/close, assent and consent.", "gap": "Consent, access, risk change, referral and closure events are not in the audit trail."}, "SCN-04-S01": {"ref": "SCN-04-S01", "src": 1, "status": "Done", "pri": "-", "screen": "Minor registration", "text": "Expected application behavior: Enter a date of birth giving an age of 15; a guardian is initially registered. Point to confirm: The minor journey is triggered.", "section": "Key end-to-end scenarios", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "SCN-04-S02": {"ref": "SCN-04-S02", "src": 1, "status": "Not done", "pri": "High", "screen": "Accessing a sensitive service", "text": "Expected application behavior: The minor requests mental health/GBV/safeguarding support. Point to confirm: The enhanced safeguarding pathway is triggered before routine notifications.", "section": "Key end-to-end scenarios", "out": true, "mod": "MHPSS", "sec": [], "corr": ["MHPSS-09"], "chg": "On a sensitive request by a Minor, default to restricted contact and raise a review item before any routine notification.", "gap": "No automatic enhanced pathway when a minor asks for sensitive support."}, "SCN-04-S03": {"ref": "SCN-04-S03", "src": 1, "status": "Partly done", "pri": "High", "screen": "Guardian safety assessment", "text": "Expected application behavior: The authorized counsellor determines that the registered guardian is “unsafe / unknown”. Point to confirm: The system stores a restricted safeguarding status.", "section": "Key end-to-end scenarios", "out": true, "mod": "MHPSS", "sec": [], "corr": ["MHPSS-05"], "chg": "Implement guardian_contact safe/unsafe/unknown (use existing table) with restricted visibility; add to doctor app.", "gap": "Status exists but is a patient-level flag, not a restricted guardian-safety assessment; counsellors cannot set it in their app."}, "SCN-04-S04": {"ref": "SCN-04-S04", "src": 1, "status": "Partly done", "pri": "High", "screen": "Automatic contact suppression", "text": "Expected application behavior: Attempt to send a reminder to the guardian. Point to confirm: SMS, email, and push notifications directed to the guardian regarding the protected service are automatically suppressed.", "section": "Key end-to-end scenarios", "out": true, "mod": "MHPSS", "sec": ["NOTIF"], "corr": ["MHPSS-06"], "chg": "Scope suppression to guardian contacts and protected events; keep a safe channel to the child.", "gap": "Suppression is not scoped to the protected service and also blocks the child."}, "SCN-04-S05": {"ref": "SCN-04-S05", "src": 1, "status": "Partly done", "pri": "High", "screen": "Documenting safe communication", "text": "Expected application behavior: Record the approved safe channel: app only / clinic / authorized health worker / safe phone + safe time. Point to confirm: Future protected service communications follow the safe pathway only.", "section": "Key end-to-end scenarios", "out": true, "mod": "MHPSS", "sec": ["NOTIF"], "corr": ["MHPSS-08"], "chg": "Extend comm-pref (safe phone, health-worker option) and enforce in notification routing for protected services.", "gap": "Safe phone/safe time/health-worker pathway not modelled and not enforced."}, "SCN-04-S06": {"ref": "SCN-04-S06", "src": 1, "status": "Partly done", "pri": "High", "screen": "Override control", "text": "Expected application behavior: An ordinary registration/support user attempts to remove the suppression. Point to confirm: The action is refused; only an authorized safeguarding role may act, in accordance with the approved policy.", "section": "Key end-to-end scenarios", "out": true, "mod": "MHPSS", "sec": ["SEC"], "corr": ["MHPSS-04"], "chg": "Create a safeguarding role/permission for lifting protection; restrict set-to-None and audit it.", "gap": "Registration/support users can remove Protected status."}, "SCN-04-S07": {"ref": "SCN-04-S07", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Safeguarding review", "text": "Expected application behavior: The case is referred to the designated safeguarding/psychosocial officer. Point to confirm: The system displays a status such as “safeguarding review required” rather than creating legal consent authority.", "section": "Key end-to-end scenarios", "out": true, "mod": "MHPSS", "sec": [], "corr": ["MHPSS-02"], "chg": "Add review_state label and assignment to the escalation queue.", "gap": "Review-required label and a designated officer assignment are not explicit."}, "SCN-04-S08": {"ref": "SCN-04-S08", "src": 1, "status": "Partly done", "pri": "High", "screen": "Authorized alternative pathway", "text": "Expected application behavior: Apply the approved outcome: safe legal representative / child protection pathway / emergency exception / limited service pending authorization. Point to confirm: The decision, authorizing authority, reason, and responsible user are recorded.", "section": "Key end-to-end scenarios", "out": true, "mod": "MHPSS", "sec": [], "corr": ["MHPSS-03"], "chg": "Add a decision record (outcome type, authority, reason, responsible user) tied to the safeguarding escalation.", "gap": "Outcome, authority and reason not captured."}, "SCN-04-S09": {"ref": "SCN-04-S09", "src": 1, "status": "Partly done", "pri": "High", "screen": "Protected case separation", "text": "Expected application behavior: An unsafe guardian or an ordinary linked account attempts to view the protected appointment/case. Point to confirm: Sensitive appointments, messages, and case notes remain hidden as required by the policy.", "section": "Key end-to-end scenarios", "out": true, "mod": "MHPSS", "sec": [], "corr": ["MHPSS-07"], "chg": "Move to item-level protection (sensitive appointments/cases) and a child-safe access path; fail closed for Protected.", "gap": "All-or-nothing, fail-open gate; the child cannot reach support while Protected unless an alternate carer account exists."}, "SCN-04-S10": {"ref": "SCN-04-S10", "src": 1, "status": "Partly done", "pri": "High", "screen": "Referral / emergency escalation", "text": "Expected application behavior: If the risk is high/imminent, the approved safeguarding/emergency referral is carried out. Point to confirm: The responsible person, referral destination, acknowledgement of receipt, and follow-up deadline are recorded.", "section": "Key end-to-end scenarios", "out": true, "mod": "MHPSS", "sec": [], "corr": ["MHPSS-01", "MHPSS-03"], "chg": "Add Crisis to trigger; add destination and follow-up due date fields.", "gap": "Destination, deadline and Crisis trigger missing."}, "SCN-04-S11": {"ref": "SCN-04-S11", "src": 1, "status": "Partly done", "pri": "High", "screen": "Unauthorized access check", "text": "Expected application behavior: An unauthorized role attempts to access the protected case. Point to confirm: Access is denied and a security/safeguarding audit event is created.", "section": "Key end-to-end scenarios", "out": true, "mod": "SEC", "sec": ["MHPSS"], "corr": ["SEC-06"], "chg": "Write a denied-access audit/security event from the gate and role failures.", "gap": "Denied attempts are not logged."}, "SCN-04-S12": {"ref": "SCN-04-S12", "src": 1, "status": "Partly done", "pri": "High", "screen": "Audit review", "text": "Expected application behavior: Review the full sequence without unnecessarily exposing the narrative. Point to confirm: The guardian risk decision, contact suppression, authorized actions, and access attempts are fully traceable.", "section": "Key end-to-end scenarios", "out": true, "mod": "SEC", "sec": ["MHPSS"], "corr": ["SEC-05"], "chg": "Add audit writes for safeguarding set/clear, suppression, escalation actions and denials, without narrative text.", "gap": "The guardian risk decision, suppression and access attempts are not traceable in audit."}, "SCN-05-S01": {"ref": "SCN-05-S01", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Set up a sample patient", "text": "Expected application behavior: Create a case for a 17-year-old adolescent with a verified guardian and historical consents. Point to confirm: The minor journey and the guardian link are active.", "section": "Key end-to-end scenarios", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-04"], "chg": "As SCN-02-S04/S05.", "gap": "Guardian verification and consent steps are only partly operable."}, "SCN-05-S02": {"ref": "SCN-05-S02", "src": 1, "status": "Partly done", "pri": "High", "screen": "Advance the effective date / use the date of birth", "text": "Expected application behavior: The patient reaches their eighteenth birthday in the review environment. Point to confirm: The system automatically changes the patient type to “adult” with effect from the correct date.", "section": "Key end-to-end scenarios", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-11"], "chg": "Add a scheduled worker (daily) calling the sweep; record transition date and audit it.", "gap": "The sweep never runs automatically unless an external scheduler is configured; nothing is recorded as an effective date."}, "SCN-05-S03": {"ref": "SCN-05-S03", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Preservation of the historical record", "text": "Expected application behavior: Review the previous guardian, assent, and consent records. Point to confirm: Historical records remain intact, read-only, and auditable.", "section": "Key end-to-end scenarios", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-11"], "chg": "Add immutability (no update/delete) on assent/consent history and audit the transition.", "gap": "History is preserved by design but not enforced read-only or audited."}, "SCN-05-S04": {"ref": "SCN-05-S04", "src": 1, "status": "Partly done", "pri": "High", "screen": "Guardian access review", "text": "Expected application behavior: Attempt guardian access after the age transition. Point to confirm: Access is revoked or re-authorized in accordance with the approved policy for adult patients; there is no automatic unlimited guardian access.", "section": "Key end-to-end scenarios", "out": true, "mod": "MIN", "sec": ["AUTH"], "corr": ["MIN-12"], "chg": "Force credential reset/re-consent at transition, or build caregiver accounts; log it.", "gap": "Guardian access via the shared login is not revoked at 18."}, "SCN-05-S05": {"ref": "SCN-05-S05", "src": 1, "status": "Not done", "pri": "High", "screen": "Adult consent renewal", "text": "Expected application behavior: The patient logs in after turning 18. Point to confirm: The system requests direct confirmation from the adult of the privacy, telehealth, and relevant communication consents, according to configuration.", "section": "Key end-to-end scenarios", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-12"], "chg": "On transition mark minor-era consents as superseded (or require granted_by_role Self) so the gate re-prompts; add the config switch.", "gap": "No adult consent renewal on turning 18."}, "SCN-05-S06": {"ref": "SCN-05-S06", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Communication preferences", "text": "Expected application behavior: The patient reviews the phone number/contact and safe notification preferences. Point to confirm: The adult patient becomes the primary controller of communication preferences.", "section": "Key end-to-end scenarios", "out": true, "mod": "MIN", "sec": ["REG"], "corr": ["MIN-12"], "chg": "Show a post-18 review step and retire guardian contact routing.", "gap": "No transition prompt to review contact and safe-notification preferences."}, "SCN-05-S07": {"ref": "SCN-05-S07", "src": 1, "status": "Not done", "pri": "High", "screen": "Sensitive services", "text": "Expected application behavior: Where a previous psychosocial support record exists, access to it after the transition is checked. Point to confirm: Historical protected data remains protected; the adult patient’s rights and extent of visibility follow the approved policy.", "section": "Key end-to-end scenarios", "out": true, "mod": "MHPSS", "sec": ["MIN"], "corr": ["MHPSS-16"], "chg": "Decide the policy; add a safeguarding review task at transition and clear/keep Protected accordingly.", "gap": "Post-18 handling of protected/psychosocial data is undefined."}, "SCN-05-S08": {"ref": "SCN-05-S08", "src": 1, "status": "Not done", "pri": "High", "screen": "Audit", "text": "Expected application behavior: Review the transition event and the consent changes. Point to confirm: The age transition, permission changes, and new adult consent are traceable.", "section": "Key end-to-end scenarios", "out": true, "mod": "SEC", "sec": ["MIN"], "corr": ["SEC-05"], "chg": "Write audit rows in the sweep (patient id, from/to type, date) and in consent grant.", "gap": "Transition, permission and consent changes are not auditable."}, "PA-OS-01": {"ref": "PA-OS-01", "src": 1, "status": "Not done", "pri": "Medium", "screen": "Registration", "text": "The system allowed exactly the same name to be registered from two different phone numbers with no duplicate check performed. Duplicate-detection logic based on a combination of identifiers, rather than the name alone, should be introduced.", "section": "Patient App", "out": true, "mod": "REG", "sec": [], "corr": ["REG-11"], "chg": "Add a composite duplicate check (normalised name + DOB + national id/governorate) in sp_useraccount_selfregister that flags, not blocks, a probable duplicate. Surface flagged records to admins for review/merge. Decide which identifiers count and whether to block or warn.", "gap": "No duplicate detection on a combination of identifiers (name + DOB + governorate/national id) at registration or in an admin review queue."}, "PA-OS-02": {"ref": "PA-OS-02", "src": 1, "status": "Partly done", "pri": "High", "screen": "Login", "text": "After more than five incorrect password attempts, the user was still able to continue trying. A configurable temporary lockout or delay should be added, and repeated failed attempts should be recorded in the security log.", "section": "Patient App", "out": true, "mod": "AUTH", "sec": [], "corr": ["AUTH-04"], "chg": "Move threshold and lock duration to a policy/config table read by the SP. Write an audit/security-log row (rate-limited) for each failed attempt on a known account. Confirm AUTH.sql is deployed live.", "gap": "Lockout threshold/duration not configurable; each failed attempt not recorded in the security log (only the lockout)."}, "PA-OS-03": {"ref": "PA-OS-03", "src": 1, "status": "Partly done", "pri": "High", "screen": "Login", "text": "The same error message appears under both the username and the password fields. A clear and safe message should be shown without disclosing account information that could help enumerate valid users.", "section": "Patient App", "out": true, "mod": "AUTH", "sec": [], "corr": ["AUTH-03"], "chg": "Decide policy: either return the same generic message for both cases (and drop attempts-left/locked wording), or keep attempts-left as a deliberate usability trade-off. If generic, change the SP message branches.", "gap": "Messages differ between known and unknown accounts, which lets a prober confirm a registered number."}, "PA-OS-04": {"ref": "PA-OS-04", "src": 1, "status": "Cannot verify", "pri": "Medium", "screen": "Login", "text": "The fingerprint login option appears as soon as the application is opened, even though it has not been enabled or requested. The fingerprint icon also remains visible after login. Biometric login should appear only after the user has opted in and where the device supports it.", "section": "Patient App", "out": true, "mod": "AUTH", "sec": [], "corr": ["AUTH-11"], "chg": "Review the Flutter shell: show biometric option only after the user opts in and only if the device supports it; hide it after login. Add an opt-in setting in the patient profile if biometric is wanted.", "gap": "Native shell behaviour cannot be checked here; also no opt-in setting exists in the web code."}, "PA-OS-05": {"ref": "PA-OS-05", "src": 1, "status": "Done", "pri": "-", "screen": "Doctor Search", "text": "After selecting a doctor, opening the profile, and booking the appointment, the application returns the user to the governorate selection page and repeats the doctor selection process. The booking journey should preserve context and continue through to confirmation.", "section": "Patient App", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "PA-OS-06": {"ref": "PA-OS-06", "src": 1, "status": "Partly done", "pri": "Low", "screen": "Doctor Search", "text": "Only approved/active doctors eligible for booking should be displayed. Internal verification statuses such as “pending/rejected” must not be shown to patients. Information useful to the patient, such as availability and rating, should be shown instead.", "section": "Patient App", "out": true, "mod": "SCHED", "sec": ["MSTR"], "corr": ["SCHED-01", "SCHED-02"], "chg": "Add next-available-slot info to the search cards (e.g. from v_appointment_slot). Optionally filter status in the clinician list endpoint for PAT callers.", "gap": "Availability is not displayed in search results; server list still returns all statuses (filtering is client-side only)."}, "PA-OS-07": {"ref": "PA-OS-07", "src": 1, "status": "Partly done", "pri": "Low", "screen": "Doctor Search", "text": "Location/governorate selection should remain optional when searching for a remote doctor, unless the selected service specifically depends on location or on referral geography.", "section": "Patient App", "out": true, "mod": "SCHED", "sec": [], "corr": ["SCHED-04"], "chg": "Add a 'Any location / remote doctors' option on the governorate step that searches slots without governorateId. Decide which services truly depend on geography.", "gap": "Region step is still mandatory in the facility-first flow; 'optional location' not offered for remote services."}, "PA-OS-08": {"ref": "PA-OS-08", "src": 1, "status": "Done", "pri": "-", "screen": "Session Start", "text": "The application displays technical codes such as Status Code 401 to the patient. A simple, easily understood message should be shown instead, with the technical code retained in system/support logs only.", "section": "Patient App", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "PA-OS-09": {"ref": "PA-OS-09", "src": 1, "status": "Not done", "pri": "High", "screen": "Profile", "text": "When the patient requests that their personal data be restricted to the treating doctor, the application returns error 403. The privacy option should work according to the approved access rules, or clearly explain why the action is not permitted.", "section": "Patient App", "out": true, "mod": "REG", "sec": ["SEC"], "corr": ["REG-01"], "chg": "Decide the rule (what 'restricted to treating doctor' means and who can still see the record). Allow PAT on set-sensitive pinned to own patient claim (as set-status does) or hide the control and explain. Enforce the flag in record-read SPs.", "gap": "Patients are not authorised for the endpoint their own screen calls; the 'treating doctor only' rule is not defined."}, "PA-OS-10": {"ref": "PA-OS-10", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Profile", "text": "Patient profile information disappears after logging out and logging back in. Profile information should persist, and any synchronization issue should be visible to authorized support staff.", "section": "Patient App", "out": true, "mod": "REG", "sec": [], "corr": ["REG-15"], "chg": "Retest login/logout/login on a device. Add logging of save/load failures to a support-visible log if still reproducible.", "gap": "No admin/support visibility of profile-sync failures; fix unverified on device."}, "PA-OS-11": {"ref": "PA-OS-11", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Profile", "text": "An error occurs when selecting blood group. Field validation, the value list, and save/reload behavior must be corrected.", "section": "Patient App", "out": true, "mod": "REG", "sec": [], "corr": ["REG-04"], "chg": "Add a CHECK/validation in sp_patient_update for the 8 valid values (and empty). Retest save/reload on device.", "gap": "No server-side validation of the value list; actual cause of the reported error unconfirmed."}, "PA-OS-12": {"ref": "PA-OS-12", "src": 1, "status": "Done", "pri": "-", "screen": "Appointments", "text": "Appointment status options under patient control should be limited to actions such as cancellation or rescheduling. System/clinical statuses such as “in progress” and “completed” should be set automatically by the workflow or by authorized staff.", "section": "Patient App", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "PA-OS-13": {"ref": "PA-OS-13", "src": 1, "status": "Done", "pri": "-", "screen": "Talk to Someone", "text": "A button labeled “Private and Confidential” is displayed but does not work. It should either open an information panel on privacy with approved wording, or lose its interactive appearance if no action is intended.", "section": "Patient App", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "PA-OS-14": {"ref": "PA-OS-14", "src": 1, "status": "Partly done", "pri": "Low", "screen": "General", "text": "The three-dot action menu does not work in several places. Each instance should be reviewed and the intended actions implemented, or the non-functional controls removed.", "section": "Patient App", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-22"], "chg": "Audit every ⋯ in AfdPatient; apply hideActions or implement the actions (e.g. PatMyConsent non-Granted, sync queue/device readings). Test on device.", "gap": "Not every three-dot menu has been audited; at least PatMyConsent still shows an inert ⋯ on non-Granted rows."}, "PA-OS-15": {"ref": "PA-OS-15", "src": 1, "status": "Partly done", "pri": "Low", "screen": "General", "text": "The “Set Status” button does not work. The intended role, permitted statuses, and authorized users should be defined, and the control then implemented or removed.", "section": "Patient App", "out": true, "mod": "ADMUX", "sec": ["SEC"], "corr": ["ADMUX-22"], "chg": "Define the permitted status actions for patients. Strip staff-only actions (Start, Sign, Enable recording) from the patient ConsHistory sheet and confirm EmrMyConditions status permissions.", "gap": "Intended roles/permitted statuses per screen not formally defined; some patient screens still show staff-only actions."}, "PA-OS-16": {"ref": "PA-OS-16", "src": 1, "status": "Not done", "pri": "High", "screen": "General", "text": "The “Record Controls” buttons do not work. It should be clarified whether they refer to clinical record controls or to audio/video recording, and they should be implemented only after privacy, consent, and access rules have been approved.", "section": "Patient App", "out": true, "mod": "CONS", "sec": ["REG"], "corr": ["CONS-01", "CONS-03"], "chg": "Rename the profile heading (e.g. 'Account settings'). Decide whether call recording is allowed; if yes, gate on the recording consent (AuthConsent 'recording') and store access rules; if no, remove the Rec button and the Enable recording action.", "gap": "Meaning of 'Record controls' not clarified; call recording is available to patients without an approved consent/access rule."}, "PA-OS-17": {"ref": "PA-OS-17", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Home Screen Wording", "text": "“Consult Now” should be replaced with safer wording such as “Urgent / Immediate Consultation”, unless the service has been formally approved and resourced as an emergency service.", "section": "Patient App", "out": true, "mod": "L10N", "sec": ["SCHED"], "corr": ["L10N-03"], "chg": "Update SCHD-INSTANT title/hero strings in pat en/ar/ku to the approved 'Urgent / Immediate Consultation'. Add an emergency disclaimer unless emergency service is formally approved.", "gap": "Old 'Consult Now' wording persists on the instant-consult screen and its Arabic text; emergency-service status unresolved."}, "PA-OS-18": {"ref": "PA-OS-18", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Home Screen Wording", "text": "“Talk to Someone” should be replaced with a clearer service label such as “Talk to a Counsellor / MHPSS Support”. Technical or administrative assistance should be provided through a separate journey labeled “Help / Support” rather than being mixed with psychosocial counselling.", "section": "Patient App", "out": true, "mod": "L10N", "sec": ["MHPSS"], "corr": ["L10N-03"], "chg": "Rename MHPSS entry/menu/Arabic/Kurdish strings to 'Talk to a Counsellor / MHPSS Support'. Keep Help & Support for technical/admin help only and remove the counselling tile from it (or label it clearly).", "gap": "Wording is inconsistent across screens/languages; Help & Support page still hosts the counselling tile."}, "PA-NI-01": {"ref": "PA-NI-01", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Registration", "text": "Progressive registration should be adopted. At account creation, only the minimum identity/contact information required is collected (for example: full name, father’s & mother’s name, date of birth, phone, location/governorate, preferred language, and the required consent). At the first clinical consultation, clinically relevant data is c", "section": "Patient App", "out": true, "mod": "REG", "sec": [], "corr": ["REG-05"], "chg": "Add parents' names (optional) to registration/profile. Build a first-consultation clinical history step (allergies, chronic conditions, medications, surgeries, pregnancy/breastfeeding, accessibility, blood group) in the patient app or doctor case sheet, stored on the patient record. Prompt it before", "gap": "Registration is minimal (good) but the second stage is not built on the patient side: no structured first-consultation history capture, and father's/mother's names and some listed identity fields are not collected."}, "PA-NI-02": {"ref": "PA-NI-02", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Appointments", "text": "Add appointment reminders via the application and SMS, with configurable timing, language, and message text that preserves privacy.", "section": "Patient App", "out": true, "mod": "SCHED", "sec": ["NOTIF"], "corr": ["SCHED-06"], "chg": "Confirm active reminder rules (24h/2h) and templates in Arabic/Kurdish/English with generic wording on the live DB. Verify SMS provider deliverability end to end. Optionally let patients choose reminder timing.", "gap": "Timing/text are admin-configured per rule, not per patient; live SMS delivery to Syrian networks and which rules are seeded/active are unverified."}, "PA-NI-03": {"ref": "PA-NI-03", "src": 1, "status": "Done", "pri": "-", "screen": "Doctor Search", "text": "Allow patients to save favorite doctors for quick access, provided the doctor remains active/available.", "section": "Patient App", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "PA-NI-04": {"ref": "PA-NI-04", "src": 1, "status": "Partly done", "pri": "Low", "screen": "Consultation", "text": "Add an optional pre-consultation smart assistant that collects symptoms and basic information in a structured format for the doctor to review. Any AI-supported feature must be clearly defined, subject to clinical governance, auditable, and must not provide an independent diagnosis.", "section": "Patient App", "out": true, "mod": "TRIAGE", "sec": [], "corr": ["TRIAGE-06"], "chg": "Decide whether an AI assistant is wanted; if so define scope/governance, add audit logging and a no-diagnosis guard. Otherwise extend the structured intake with duration/severity/medication questions.", "gap": "Structured pre-consultation intake exists; an AI-supported assistant with governance and audit does not, and basic info (duration, severity, meds) is limited."}, "PA-NI-05": {"ref": "PA-NI-05", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Account / Family", "text": "Allow a single account to assist with appointments and consultations for authorized family members, while maintaining a separate patient record, consent status, privacy permissions, and independent audit trail for each individual.", "section": "Patient App", "out": true, "mod": "MIN", "sec": ["SEC"], "corr": ["MIN-14"], "chg": "Verify actions while acting-for are audited under the subject patient id. Show per-member consent status and add per-member privacy/permission settings. Add authorisation scope (appointments/consults only) to the link.", "gap": "Separate record per person exists; independent consent state, privacy permissions per member and per-person audit trail are not verified or surfaced."}, "PA-NI-06": {"ref": "PA-NI-06", "src": 1, "status": "Not done", "pri": "Low", "screen": "Content", "text": "Allow configurable health information banners or daily medical tips, ensuring the content is clinically approved, version-controlled, appropriate for the target group, and removable by administrators.", "section": "Patient App", "out": true, "mod": "L10N", "sec": [], "corr": ["L10N-13"], "chg": "Add health_content table (text per language, target group, status Draft/Approved/Retired, version, approver), an admin editor with approve/remove, and a patient Home card that shows approved items.", "gap": "No configurable health-tip or banner feature."}, "PA-NI-07": {"ref": "PA-NI-07", "src": 1, "status": "Partly done", "pri": "High", "screen": "Minor Registration", "text": "Calculate age automatically from date of birth. If the patient is under 18, the system switches automatically to the minor registration journey; ordinary users must not be able to bypass the age-based journey by manually selecting “adult”.", "section": "Patient App", "out": true, "mod": "MIN", "sec": ["REG"], "corr": ["MIN-01"], "chg": "Make DOB mandatory at registration (or force it at first login/consent before any service). Block booking/consult until DOB is present.", "gap": "Because DOB is optional, a minor can skip it and be treated as an adult; age is derived but not mandatory."}, "PA-NI-08": {"ref": "PA-NI-08", "src": 1, "status": "Partly done", "pri": "High", "screen": "Guardian / Legal Representative", "text": "For minors, add a separate guardian/legal representative page containing: full name, relationship, contact details, identity/verification method, verification status, date and time of verification, and the staff member who verified the relationship.", "section": "Patient App", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-04"], "chg": "Add a staff guardian page in Web (Pat360) to edit and verify (method, status, who/when). Show verified_by/at in the record.", "gap": "Data model and verify endpoint exist but staff have no screen to verify or view verifier/time; no dedicated guardian page; email contact field absent."}, "PA-NI-09": {"ref": "PA-NI-09", "src": 1, "status": "Partly done", "pri": "High", "screen": "Guardian Consent and Child Assent", "text": "Document guardian/legal representative consent separately from child/adolescent assent, recording the purpose, version, language, date, time, and method of consent, and the person who obtained it.", "section": "Patient App", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-05"], "chg": "Route app assent into assent_record with language and method; record obtaining staff user on assisted consents; show both in consent history.", "gap": "Assent via the app is logged as a granted_via value, not in assent_record; the person who obtained consent (staff) is only recorded for staff paths; method/language on assent are not explicit."}, "PA-NI-10": {"ref": "PA-NI-10", "src": 1, "status": "Done", "pri": "-", "screen": "Secure Communication Preferences", "text": "Add privacy-preserving communication preferences: in-app only, SMS, phone call, or contact via the clinic/health worker, no voicemail, no sensitive text on the lock screen, and a safe contact time window.", "section": "Patient App", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "PA-NI-11": {"ref": "PA-NI-11", "src": 1, "status": "Partly done", "pri": "High", "screen": "Guardian Safety Assessment", "text": "For MHPSS/GBV/safeguarding services involving a minor, an approved safe-contact assessment must be carried out: guardian safe to contact / unsafe / unknown. Where unsafe or unconfirmed, routine guardian notifications are automatically suppressed and the case is routed to the approved safeguarding pathway.", "section": "Patient App", "out": true, "mod": "MHPSS", "sec": ["MIN"], "corr": ["MHPSS-05"], "chg": "Add guardian_contact_safety (safe/unsafe/unknown, assessor, date) on guardian link, required for MHPSS/GBV minors. Suppress guardian notifications unless safe and auto-open safeguarding case. Define the approved pathway with clinical lead.", "gap": "No guardian safe-contact assessment, no suppression of guardian notifications when unsafe/unknown, no routing rule."}, "PA-NI-12": {"ref": "PA-NI-12", "src": 1, "status": "Partly done", "pri": "High", "screen": "Provider Preference", "text": "Allow patients to filter/request a female doctor or counsellor, in addition to specialty, sub- specialty, language, and availability. This is particularly important for women and adolescent girls.", "section": "Patient App", "out": true, "mod": "REG", "sec": ["SCHED"], "corr": ["REG-12"], "chg": "Apply provider_gender_pref in triage match and MHPSS counsellor assignment; add the preference to booking/MHPSS request screens and the sub-specialty filter.", "gap": "Female-provider preference only works in doctor search; MHPSS/counsellor and triage matching ignore it, and the saved preference is unused."}, "PA-NI-13": {"ref": "PA-NI-13", "src": 1, "status": "Partly done", "pri": "High", "screen": "Consent Management", "text": "Implement version-controlled consent records covering the privacy notice, telehealth, psychosocial support, referral, communications, and any optional recording. Consent should be withdrawable where applicable, with a full audit log.", "section": "Patient App", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-06"], "chg": "Confirm seeded policy rows for privacy, telehealth, MHPSS, referral, communications, recording. Add admin management of policy versions with re-consent on change.", "gap": "Consent text/version is partly hard-coded; no admin-managed policy versioning shown; referral and psychosocial consent types and audit view not confirmed."}, "PA-NI-14": {"ref": "PA-NI-14", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Clinical Data Validation", "text": "Use hard validation for physiologically impossible values, and configurable warnings/overrides for unusual but possible values. This applies to temperature, blood pressure, pulse, oxygen saturation, respiratory rate, height, weight, glucose, and all other structured clinical fields. -", "section": "Patient App", "out": true, "mod": "EMR", "sec": [], "corr": ["EMR-09"], "chg": "Expose observation_reference limits in admin; add override-with-reason for unusual values; extend validation to patient-entered readings and other numeric clinical fields.", "gap": "Hard/soft validation is limited to observations; other structured fields (glucose entry, case sheet, patient-entered vitals) and configurable override are not implemented."}, "PA-NI-15": {"ref": "PA-NI-15", "src": 1, "status": "Partly done", "pri": "High", "screen": "Medication Safety", "text": "Add configurable medication safety controls covering allergy checking, duplicate medication, dose/unit validation, pregnancy/breastfeeding flags where applicable, and drug interaction alerts where clinically feasible and approved.", "section": "Patient App", "out": true, "mod": "EMR", "sec": [], "corr": ["EMR-08"], "chg": "Add dose/unit validation against the medicine master, pregnancy/breastfeeding flags, and an interaction table with severity. Make rules configurable and clinically approved. Use structured allergies.", "gap": "Only allergy, duplicate and controlled checks; dose/unit validation, pregnancy flags and interaction alerts missing; rules not admin-configurable."}, "PA-NI-16": {"ref": "PA-NI-16", "src": 1, "status": "Partly done", "pri": "High", "screen": "Clinical Record Safety", "text": "Once a consultation is signed/finalized, the clinical note, diagnosis, and prescription must be locked against silent modification. Any subsequent amendment must preserve the original text, record the reason, user, and timestamp, and remain auditable.", "section": "Patient App", "out": true, "mod": "EMR", "sec": ["SEC"], "corr": ["EMR-02"], "chg": "Add a signed/amended-sheet guard to sp_diagnosis_add/remove/setstatus; block Prescription_Upsert/SetLines once status is Issued (require cancel+reissue or addendum with reason); verify audit rows are written for addenda.", "gap": "Diagnoses and prescriptions are not locked after signing; Diagnosis_Remove is a plain soft-delete; no evidence the prescription lines are frozen once Issued; audit of amendments relies on general audit coverage (not verified)."}, "PA-NI-17": {"ref": "PA-NI-17", "src": 1, "status": "Partly done", "pri": "High", "screen": "Emergency / Urgent Care", "text": "Add a clear notice to the patient that telehealth is not a substitute for hospital emergency care or an ambulance service. Configure local urgent referral instructions and the approved escalation pathways for Syria.", "section": "Patient App", "out": true, "mod": "L10N", "sec": [], "corr": ["L10N-05"], "chg": "Get approved Syria emergency numbers/pathways from the client; add a configurable (master-data/i18n) emergency notice component shown on home, booking, intake and consult screens; translate to Arabic/Kurdish.", "gap": "No configurable local urgent-referral instructions or approved escalation pathways (numbers, nearest facility); notice not on the home page or general booking flow."}, "PA-NI-18": {"ref": "PA-NI-18", "src": 1, "status": "Partly done", "pri": "High", "screen": "Feedback and Safeguarding Channels", "text": "Separate technical support, service feedback/complaints, and safeguarding/GBV concerns. Each channel should be routed to the responsible team without disclosing sensitive information to the technical support team.", "section": "Patient App", "out": true, "mod": "QUAL", "sec": ["MHPSS"], "corr": ["QUAL-03"], "chg": "Add separate Technical support entry; route Safeguarding category to a restricted safeguarding-focal-point queue/role and hide details from general admins; define channel owners.", "gap": "No technical-support channel; Safeguarding complaints go into the same admin complaint queue visible to ADM/MGR, with no restricted routing or redaction for the support team."}, "PA-NI-19": {"ref": "PA-NI-19", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Offline / Synchronization", "text": "Support approved functionality under weak or no connectivity, with a clear indication of synchronization status, secure local storage, controlled conflict resolution, retry behavior, duplicate prevention, and full auditability once reconnected.", "section": "Patient App", "out": true, "mod": "PLAT", "sec": [], "corr": ["PLAT-01"], "chg": "Define the approved offline functions; implement encrypted local queue + background retry using request_key idempotency; show sync state; audit on reconnect; test on devices.", "gap": "Offline capability is not demonstrably working end-to-end: no secure local storage, no automatic queue/retry on reconnect, approved offline functions undefined."}, "PA-NI-20": {"ref": "PA-NI-20", "src": 1, "status": "Partly done", "pri": "High", "screen": "Age Transition", "text": "When a minor reaches 18, they transition automatically to “adult” status with effect from the correct date; historical guardian consent is retained, and the newly adult patient is prompted to review/renew the relevant consents and communication preferences.", "section": "Patient App", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-11", "MIN-12"], "chg": "Schedule the sweep daily; on first login after transition show a review/renew consent and comm-preference flow; keep guardian consent history read-only.", "gap": "Nothing is shown to schedule the sweep; no prompt to the new adult to review consents/communication preferences; exact effective date handling (birthday) not verified."}, "PA-NI-21": {"ref": "PA-NI-21", "src": 1, "status": "Partly done", "pri": "High", "screen": "Safe Exit in MHPSS and GBV Services", "text": "For sensitive MHPSS or GBV use, a quick exit / immediate hide option should be provided where appropriate, and sensitive service names should be prevented from appearing in notifications or in the visible history wherever the approved safeguarding settings require it.", "section": "Patient App", "out": true, "mod": "MHPSS", "sec": [], "corr": ["MHPSS-12"], "chg": "Add a global quick-hide control to all MHPSS/GBV screens; hide/neutralise sensitive service names in history and menu when safeguarding setting is on; confirm D-02 deployed.", "gap": "No quick-exit on MhpssEntry/ModeChoice/Feedback or other GBV screens; session names may still show in appointment/consult history; D-02 SQL not confirmed applied to live DB."}, "PA-NI-22": {"ref": "PA-NI-22", "src": 1, "status": "Not done", "pri": "High", "screen": "Confidentiality Wording in Psychosocial Services", "text": "Use clear but non-absolute privacy wording: explain that the conversation is treated confidentially, with only limited information shared where approved safeguarding/safety procedures require it.", "section": "Patient App", "out": true, "mod": "MHPSS", "sec": ["L10N"], "corr": ["MHPSS-11"], "chg": "Replace text with approved wording (confidential, limited information shared only where safeguarding/safety procedures require); add AR/KU translations.", "gap": "Wording is absolute, not the requested non-absolute confidentiality statement."}, "PA-NI-23": {"ref": "PA-NI-23", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Phone Number Verification Message", "text": "On the “Enter mobile number” screen, it must state clearly: “A verification code will be sent to the phone number above.” The same message must also display correctly in Arabic when Arabic is selected.", "section": "Patient App", "out": true, "mod": "AUTH", "sec": ["REG"], "corr": ["AUTH-08"], "chg": "Change text to 'A verification code will be sent to the phone number above.'; add Arabic/Kurdish key values; confirm OTP is actually sent.", "gap": "Exact wording not applied; Arabic rendering not verified; the registration flow itself may not send an OTP."}, "PA-NI-24": {"ref": "PA-NI-24", "src": 1, "status": "Partly done", "pri": "Low", "screen": "Registration / Password Wording", "text": "Change “Your name and password” to “Enter your name and password”. Add a “Confirm password” field and validate that the two entries match. Before final account creation or any important irreversible action, a simple confirmation message is shown allowing the user to review or correct the data.", "section": "Patient App", "out": true, "mod": "AUTH", "sec": ["L10N"], "corr": ["AUTH-10"], "chg": "Retitle the step per the requested wording; move labels to i18n with AR/KU.", "gap": "Specific heading wording 'Enter your name and password' not used; labels are hardcoded English (not translated)."}, "PA-NI-25": {"ref": "PA-NI-25", "src": 1, "status": "Not done", "pri": "Low", "screen": "Name Entry in Arabic / English", "text": "Support linked name entry in Arabic and English. If English is selected, the user enters the name in English and the application may suggest the Arabic spelling; if Arabic is selected, the reverse applies. Any automatic transliteration must be shown to the user or authorized staff member for review and correction before saving.", "section": "Patient App", "out": true, "mod": "REG", "sec": ["L10N"], "corr": ["REG-06"], "chg": "Decide transliteration method (library or staff-reviewed); add suggestion with editable confirmation in patient app and staff registration.", "gap": "No linked entry or suggested transliteration with review/correction."}, "PA-NI-26": {"ref": "PA-NI-26", "src": 1, "status": "Partly done", "pri": "High", "screen": "Account Access and Phone Number Change", "text": "Provide “Forgot password”, “Change password”, and “Change registered phone number” options. Changing the phone number must go through an approved verification/recovery process that protects against account takeover and retains an audit log.", "section": "Patient App", "out": true, "mod": "AUTH", "sec": ["NOTIF"], "corr": ["AUTH-09"], "chg": "Build OTP-based reset and phone-change (verify old and new numbers, cooling-off, notify old number, audit log); depends on SMS provider go-live.", "gap": "Missing Forgot password (OTP reset), Change phone number with verification and audit."}, "PA-NI-27": {"ref": "PA-NI-27", "src": 1, "status": "Partly done", "pri": "Low", "screen": "Patient Home Page", "text": "Organize the patient home page into clear, simple groups so that core actions are easy to find. Avoid placing many unrelated options on a single screen, and use consistent labels and icons.", "section": "Patient App", "out": true, "mod": "L10N", "sec": ["ADMUX"], "corr": ["L10N-12"], "chg": "Run usability review with client; adjust groups and icon set; confirm Arabic labels.", "gap": "Grouping is in place but unvalidated; other groups (records, family, account) are reached via menu; consistent icons not audited."}, "PA-NI-28": {"ref": "PA-NI-28", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Patient Referral Pathway", "text": "Provide a complete patient referral pathway, from referral creation through to the receiving doctor/facility, including acknowledgement of receipt, appointment/status, follow-up, and final closure. The patient should see the appropriate referral status without visibility of sensitive internal notes.", "section": "Patient App", "out": true, "mod": "REF", "sec": [], "corr": ["REF-11"], "chg": "Verify/limit patient-facing referral fields to status, specialty, facility, dates; add notifications for acknowledge/close.", "gap": "Server-side redaction of internal notes for patients not verified; escalation and receiving-facility acknowledgement appear only as status; no patient notifications of status changes verified."}, "PA-NI-29": {"ref": "PA-NI-29", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Program Category / Payment", "text": "Add a configurable patient/service field indicating whether the case is a “beneficiary”, “insured”, or “paid service” (and other approved categories where needed). This should support billing and reporting rules without unnecessarily disclosing sensitive information.", "section": "Patient App", "out": true, "mod": "BILL", "sec": ["REG"], "corr": ["BILL-16"], "chg": "Create a configurable category master list; add field to registration/staff registration; wire into billing rules and reports with restricted visibility.", "gap": "No configurable category list, no capture in apps/staff screens, no billing/report rules."}, "PA-NI-30": {"ref": "PA-NI-30", "src": 1, "status": "Partly done", "pri": "High", "screen": "Contact / Call-Back in Psychosocial Services", "text": "For protected MHPSS/GBV services, the counsellor’s standard “call back” option should be disabled. The default should be that the patient/survivor initiates contact. Any counsellor- initiated contact must follow an approved safe-contact/safeguarding rule and use a privacy- preserving means of communication.", "section": "Patient App", "out": true, "mod": "MHPSS", "sec": [], "corr": ["MHPSS-08"], "chg": "Make patient-initiated contact the default for all protected MHPSS/GBV services; add safe-contact preferences (channel, time, safe to leave message) and approved counsellor-initiated rule; confirm C-10 is deployed.", "gap": "Protection applies only to GBV-flagged interrupted sessions; no patient safe-contact setting; standard call-back on other MHPSS services not disabled; flag set manually."}, "PA-CR-01": {"ref": "PA-CR-01", "src": 1, "status": "Needs decision", "pri": "Low", "screen": "Home Page", "text": "Clarify the intended difference between “Booking” and “Doctor Search”. If “Doctor Search” is a step within booking, navigation should be simplified and duplicate journeys avoided.", "section": "Patient App", "out": true, "mod": "SCHED", "sec": [], "corr": ["SCHED-05"], "chg": "If merge: remove the Find Doctor tile, add doctor choice inside the booking flow. If keep: relabel to make the difference clear.", "gap": "Client must confirm whether to keep two entry tiles or merge into one Book journey with a 'choose doctor' step."}, "PA-CR-02": {"ref": "PA-CR-02", "src": 1, "status": "Done", "pri": "-", "screen": "Profile", "text": "Clarify what “My Referrals” and “My Certificates” mean, who creates them, what information they display, and which patient/doctor/administrator roles may view or manage them.", "section": "Patient App", "out": true, "mod": "REF", "sec": ["EMR"], "corr": ["REF-12"], "chg": "Document the role matrix (doctor creates, patient reads own, admin/manager oversight) from router/menuRoutes role lists.", "gap": "Role matrix for who may view/manage has not been written up for the client."}, "PA-CR-03": {"ref": "PA-CR-03", "src": 1, "status": "Needs decision", "pri": "Medium", "screen": "Billing / Program Rules", "text": "Clarify whether program services in Syria are free, subsidized, voucher-funded, insured, or paid by the patient. Billing elements should be configurable by program/service and must not confuse grant-funded beneficiaries.", "section": "Patient App", "out": true, "mod": "BILL", "sec": [], "corr": ["BILL-15"], "chg": "Decide funding model per program. Then add a program/funding-source setting that hides or zero-rates bills and payment prompts for grant-funded beneficiaries, and a voucher/subsidy field on bills.", "gap": "No program/service funding model (free, subsidised, voucher, insured) exists; no per-program billing switch."}, "PA-CR-04": {"ref": "PA-CR-04", "src": 1, "status": "Partly done", "pri": "High", "screen": "Record / Recording Controls", "text": "Clarify the purpose of every control labeled “record” or “recording”. If audio/video recording exists, consent, permitted use, default state, storage, retention period, encryption, access, and download restrictions must be defined, together with the specific prohibition controls for MHPSS and GBV services.", "section": "Patient App", "out": true, "mod": "CONS", "sec": ["MIN"], "corr": ["CONS-01"], "chg": "Decide whether recording is allowed at all; if not, remove Rec buttons; if yes, require recorded consent from all parties, gate by server recording_enabled, store encrypted with retention, and block explicitly for MHPSS/GBV sessions.", "gap": "No consent, default-off policy, retention, access control or download restriction; a local download from a patient or doctor device is possible in normal consults; MHPSS/GBV prohibition not explicit (only absence of button in MHPSS room)."}, "PA-CR-05": {"ref": "PA-CR-05", "src": 1, "status": "Partly done", "pri": "High", "screen": "Minor Consent Policy", "text": "Obtain and document the approved clinical/legal/safeguarding rule in Syria regarding minors: consent of the guardian/legal representative, child/adolescent assent, emergency exceptions, and how to handle cases where the guardian cannot be contacted safely. The application should implement a configurable policy rather than assume a single ", "section": "Patient App", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-02"], "chg": "Obtain legal/clinical rule; add configurable policy (age thresholds, assent age, emergency access, guardian-unreachable path) instead of hard-coded 18.", "gap": "No configurable minor policy (age bands, emergency exception, guardian unreachable handling); the approved Syrian legal rule has not been supplied."}, "PA-CR-06": {"ref": "PA-CR-06", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Identity Verification", "text": "Clarify the approved registration journey for displaced/vulnerable patients who do not hold official identity documents. The absence of a national ID should not automatically prevent access to the service where an approved alternative verification method is available.", "section": "Patient App", "out":
