ry in AuthRegister (and the profile completion path). Add first name, father's name and surname inputs (or a validation hint) and store them, e.g. new columns or concatenated with validation of three parts.", "gap": "Stored as one free-text full name per language, not split into first / father / surname. Self-registration lets a patient create an account with no name at all, so the field is not mandatory there."}, "MF-02": {"ref": "MF-02", "src": 2, "status": "Done", "pri": "-", "screen": "Phone Number / رقم الهاتف", "text": "Data type: Text. Mandatory: Yes. Notes: Primary contact number", "section": "Mandatory data fields (Al-Yamama)", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "MF-03": {"ref": "MF-03", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Age / العمر", "text": "Data type: Number. Mandatory: Yes. Notes: In years", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REG", "sec": [], "corr": ["REG-06"], "chg": "Expose a computed age_years (view / SP output / grid column and profile display) and make DOB mandatory so age is always available; or accept year_of_birth where exact DOB unknown.", "gap": "Age in years is not stored or displayed or reported as a field; derivable from date of birth but there is no age output (grid, profile, export). DOB itself is optional, so age is often unavailable."}, "MF-04": {"ref": "MF-04", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Date of Birth / تاريخ الميلاد", "text": "Data type: Date. Mandatory: Yes. Notes: YYYY-MM-DD", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REG", "sec": [], "corr": ["REG-03"], "chg": "Require date of birth in AuthRegister.vue, AfdWeb PatRegister.vue and sp_patient_register (allow a documented estimated-DOB flag if unknown).", "gap": "Data type is correct, but the mandatory rule is not enforced in self-registration, the staff form or the DB/SP."}, "MF-05": {"ref": "MF-05", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Gender / الجنس", "text": "Data type: Dropdown. Mandatory: Yes. Notes: Female / Male", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REG", "sec": [], "corr": ["REG-04"], "chg": "Replace the staff free-text with a Female/Male dropdown; remove Other/Unknown (or confirm); add gender to self-registration; require it in forms and sp_patient_register; consider CHECK constraint.", "gap": "Client list is Female / Male only; code adds Other / Unknown. Staff form is free text (inconsistent values). Not mandatory at any entry point."}, "MF-06": {"ref": "MF-06", "src": 2, "status": "Not done", "pri": "High", "screen": "Residency Status / السكن", "text": "Data type: Dropdown. Mandatory: Yes. Notes: Resident / Internally Displaced / Refugee", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REG", "sec": [], "corr": ["REG-05"], "chg": "Add residency_status column (with CHECK on the 3 values), add it to sp_patient_register/update, DTO, AuthRegister, AfdWeb PatRegister, PatMyProfile; make mandatory.", "gap": "Residency status (Resident / Internally Displaced / Refugee) is not captured anywhere."}, "MF-07": {"ref": "MF-07", "src": 2, "status": "Done", "pri": "-", "screen": "Registration Date / تاريخ التسجيل", "text": "Data type: Date. Mandatory: Yes. Notes: Date of first registration", "section": "Mandatory data fields (Al-Yamama)", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": "Stored as timestamp rather than date (date is derivable); not shown on the patient-app profile."}, "MF-08": {"ref": "MF-08", "src": 2, "status": "Not done", "pri": "High", "screen": "Marital Status / الوضع العائلي", "text": "Data type: Dropdown. Mandatory: Yes. Notes: Single / Married / Divorced / Widowed", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REG", "sec": [], "corr": ["REG-05"], "chg": "Add marital_status column with the 4 allowed values, SP/DTO changes, and a mandatory dropdown in self-registration, staff registration and profile.", "gap": "Marital status (Single / Married / Divorced / Widowed) is not captured."}, "MF-09": {"ref": "MF-09", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Displaced / مهجّر", "text": "Data type: Dropdown. Mandatory: Yes. Notes: Yes / No", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REG", "sec": [], "corr": ["REG-05"], "chg": "Add is_displaced boolean (Yes/No dropdown, mandatory) and decide whether to derive it from residency status or keep separate with consistency validation.", "gap": "Yes/No displaced flag not captured. It overlaps with MF-06 (Internally Displaced) so the two could contradict."}, "MF-10": {"ref": "MF-10", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Number of Children / عدد الأطفال", "text": "Data type: Number. Mandatory: Conditional. Notes: If the beneficiary is a mother", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REG", "sec": [], "corr": ["REG-05"], "chg": "Add number_of_children INT (>=0); show and require when the patient is a mother (needs a 'is mother' indicator or rule, e.g. female and adult with marital status / child-bearing history); validate in UI and SP.", "gap": "Number of children not captured, and no conditional rule (mandatory if beneficiary is a mother)."}, "MF-11": {"ref": "MF-11", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Employment Status / هل لديها عمل؟", "text": "Data type: Dropdown. Mandatory: Yes. Notes: Employed / Unemployed", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REG", "sec": [], "corr": ["REG-05"], "chg": "Add employment_status column (Employed / Unemployed), SP/DTO, mandatory dropdown in all registration forms and profile.", "gap": "Employment status (Employed / Unemployed) not captured."}, "MF-12": {"ref": "MF-12", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Is Breadwinner / هل هي معيلة؟", "text": "Data type: Dropdown. Mandatory: Yes. Notes: Yes / No", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REG", "sec": [], "corr": ["REG-05"], "chg": "Add is_breadwinner boolean, Yes/No mandatory dropdown in registration and profile, SP/DTO support.", "gap": "Breadwinner (Yes/No) not captured."}, "MF-13": {"ref": "MF-13", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Education Level / درجة التعلم", "text": "Data type: Dropdown. Mandatory: Yes. Notes: Illiterate / Can read and write / Primary / Preparatory / Secondary / University", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REG", "sec": [], "corr": ["REG-05"], "chg": "Add education_level column with the 6 allowed values (or a master list with Arabic/English/Kurdish labels), SP/DTO, mandatory dropdown in forms and profile.", "gap": "Education level (6 values: Illiterate, Can read and write, Primary, Preparatory, Secondary, University) not captured."}, "MF-14": {"ref": "MF-14", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Has Special Needs / ذوي الاحتياجات الخاصة", "text": "Data type: Dropdown. Mandatory: Yes. Notes: Yes / No", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REG", "sec": [], "corr": ["REG-05"], "chg": "Add has_special_needs boolean (Yes/No, mandatory) on patient (or wire clinical_profile with SPs/API) and add to forms and profile.", "gap": "Special needs Yes/No not captured; the only related column is an unused table."}, "MF-15": {"ref": "MF-15", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Type of Disability / نوع الإعاقة", "text": "Data type: Text. Mandatory: Conditional. Notes: If the answer is Yes", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REG", "sec": [], "corr": ["REG-05"], "chg": "Add the text field, shown and mandatory only when MF-14 = Yes (enforce in form and SP); wire to patient or clinical_profile.", "gap": "Type of disability is not captured nor required when special needs = Yes."}, "MF-16": {"ref": "MF-16", "src": 2, "status": "Partly done", "pri": "High", "screen": "Pregnant / حامل", "text": "Data type: Dropdown. Mandatory: Conditional. Notes: Yes / No (females only)", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "EMR", "sec": ["REG"], "corr": ["EMR-05"], "chg": "Add pregnant Yes/No on patient (or wire clinical_profile) shown/required only when gender = Female (and of child-bearing age); store pregnant and breastfeeding as separate fields.", "gap": "No usable Pregnant field; the schema column mixes pregnant/breastfeeding in one value (cannot be both) and is not wired; conditional rule 'females only' not enforced."}, "MF-17": {"ref": "MF-17", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Pregnancy Age (weeks) / عمر الحمل", "text": "Data type: Number. Mandatory: Conditional. Notes: In weeks", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "EMR", "sec": ["REG"], "corr": ["EMR-05"], "chg": "Add pregnancy_weeks INT (range e.g. 1-42), required when pregnant = Yes, cleared otherwise; enforce in form and SP.", "gap": "Pregnancy age in weeks not captured; conditional (required when Pregnant = Yes) not enforced."}, "MF-18": {"ref": "MF-18", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Breastfeeding / مرضع", "text": "Data type: Dropdown. Mandatory: Conditional. Notes: Yes / No", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "EMR", "sec": ["REG"], "corr": ["EMR-05"], "chg": "Add is_breastfeeding boolean (Yes/No), shown/required for females (rule to be confirmed), with UI and SP validation.", "gap": "Breastfeeding Yes/No not captured; no conditional rule (client lists it as conditional, presumably female / mother)."}, "MF-19": {"ref": "MF-19", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Visit Date / تاريخ الزيارة", "text": "Data type: DateTime. Mandatory: Yes. Notes: YYYY-MM-DD HH:MM", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "EMR", "sec": ["SCHED"], "corr": ["EMR-15"], "chg": "Define Visit Date = consultation.started_at (fallback scheduled_start); make it non-null at consultation start; expose it in the report/export in the client format.", "gap": "No explicit Visit Date field; not guaranteed on every record (scheduled/instant/anonymous paths); display format YYYY-MM-DD HH:MM not enforced in exports."}, "MF-20": {"ref": "MF-20", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Visit Type / نوع الزيارة", "text": "Data type: Dropdown. Mandatory: Yes. Notes: First visit / Follow-up / Emergency", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "EMR", "sec": ["SCHED"], "corr": ["EMR-15"], "chg": "Add visit_type (First visit/Follow-up/Emergency) to appointment or consultation with a required dropdown in booking and doctor flows; or map/derive it (follow-up if prior consultation exists; emergency from the emergency queue).", "gap": "Value set does not match First visit / Follow-up / Emergency: no 'First visit' value and no user-facing dropdown; Booked/Instant describe the channel, not the clinical visit type. First vs follow-up is not derived."}, "MF-21": {"ref": "MF-21", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Weight (kg) / الوزن", "text": "Data type: Decimal. Mandatory: Conditional. Notes: For clinical visits", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "EMR", "sec": [], "corr": ["EMR-16"], "chg": "Decide which visit types are clinical; require weight (and BP/temp) before the case sheet can be signed or consultation ended, with an explicit 'not measurable' reason for tele-visits.", "gap": "Type and range fine (decimal kg). The conditional rule 'required for clinical visits' is not enforced: Vitals are optional: AfdDoctor EmrVitals.saveAll accepts any subset and nothing ties them to the visit type or blocks case-sheet sign / consultation end when absent."}, "MF-22": {"ref": "MF-22", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Blood Pressure / الضغط", "text": "Data type: Text. Mandatory: Conditional. Notes: For clinical visits", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "EMR", "sec": [], "corr": ["EMR-16"], "chg": "Add a derived 'sys/dia' text in the report/export view; enforce the conditional rule once the clinical-visit definition is agreed; consider validating sys > dia.", "gap": "Client expects one Text value (e.g. 120/80); the system has two numeric readings and no combined 'BP' field in exports. Conditional rule not enforced: Vitals are optional: AfdDoctor EmrVitals.saveAll accepts any subset and nothing ties them to the visit type or blocks case-sheet sign / consultation "}, "MF-23": {"ref": "MF-23", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Temperature / درجة الحرارة", "text": "Data type: Decimal (°C). Mandatory: Conditional. Notes: For clinical visits", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "EMR", "sec": [], "corr": ["EMR-16"], "chg": "Enforce for clinical visits once defined; otherwise none.", "gap": "Type matches (decimal Celsius). Conditional 'required for clinical visits' not enforced: Vitals are optional: AfdDoctor EmrVitals.saveAll accepts any subset and nothing ties them to the visit type or blocks case-sheet sign / consultation end when absent."}, "MF-24": {"ref": "MF-24", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Clinical Notes / ملاحظات سريرية", "text": "Data type: Long Text. Mandatory: Conditional. Notes: For clinical visits", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "EMR", "sec": [], "corr": ["EMR-16"], "chg": "Require at least assessment or chief complaint (or consultation.clinical_summary) before Sign / consultation end for clinical visits.", "gap": "No single 'Clinical Notes' field; none of the note fields is required, so a signed case sheet can be empty. SP_CaseSheet_Sign has no content check."}, "MF-25": {"ref": "MF-25", "src": 2, "status": "Partly done", "pri": "High", "screen": "Service Code / كود الخدمة", "text": "Data type: Dropdown. Mandatory: Yes. Notes: From the service codes table", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "EMR", "sec": ["MSTR"], "corr": ["EMR-17"], "chg": "Replace JSON entry by a service-code dropdown; require service_item_id on the delivered service; load the partner's official service-code list into service_item.", "gap": "Service code table exists, but no dropdown picker on billing lines (raw JSON), and the service is not mandatory on an appointment/consultation record (service_item_id nullable). Codes are not aligned with the partner's code list."}, "MF-26": {"ref": "MF-26", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Service Provided / الخدمة المقدمة", "text": "Data type: Text. Mandatory: Yes. Notes: Detailed description of the service", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "EMR", "sec": [], "corr": ["EMR-17"], "chg": "Add a required service_description (text) to the service delivery record (or bill line); default from catalogue name and let the provider edit.", "gap": "No mandatory 'service provided' detailed description captured per delivery."}, "MF-27": {"ref": "MF-27", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Activity Category / فئة النشاط", "text": "Data type: Dropdown. Mandatory: Yes. Notes: From the classification table", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "MSTR", "sec": ["EMR"], "corr": ["MSTR-17"], "chg": "Obtain the partner's classification list; create master table activity_category, link from service_item (required) and expose in forms/reports.", "gap": "No activity-category classification table or dropdown; service_type is a different, fixed list. Client's classification list not provided."}, "MF-28": {"ref": "MF-28", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Service Delivery Date / تاريخ تقديم الخدمة", "text": "Data type: Date. Mandatory: Yes. Notes: (none)", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "EMR", "sec": [], "corr": ["EMR-17"], "chg": "Define delivery date = consultation.started_at date (or add service_delivery_date on the delivered-service record) and make it required.", "gap": "No dedicated service delivery date; bill_date is the billing date and may differ from delivery; free consultations without a bill have no delivery date record."}, "MF-29": {"ref": "MF-29", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Medication Provided / الدواء المقدم", "text": "Data type: Text. Mandatory: Conditional. Notes: If the program supports medication provision", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "EMR", "sec": [], "corr": ["EMR-18"], "chg": "Decide whether the programme dispenses medicines; if yes add a dispensed-medication record and require it when a medicine is prescribed under the programme.", "gap": "No dispensing / 'medication provided' record; whether the programme supplies medicines is undecided so the conditional trigger is not defined. Prescription is not required to complete a consultation."}, "MF-30": {"ref": "MF-30", "src": 2, "status": "Done", "pri": "-", "screen": "Dosage / الجرعة", "text": "Data type: Text. Mandatory: Conditional. Notes: If the program supports medication provision", "section": "Mandatory data fields (Al-Yamama)", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": "Conditional trigger (programme provides medication) is not modelled, but dose is mandatory whenever a medicine line exists."}, "MF-31": {"ref": "MF-31", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Quantity / عدد الوحدات", "text": "Data type: Number. Mandatory: Conditional. Notes: If the program supports medication provision", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "EMR", "sec": [], "corr": ["EMR-18"], "chg": "Require quantity (positive number) for each medicine line when medication provision applies; decide whole numbers only.", "gap": "Type is decimal (client: Number; acceptable). Not mandatory when a medicine is provided; no integer-only check."}, "MF-32": {"ref": "MF-32", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Follow-up Date / التاريخ المقرر للعودة", "text": "Data type: Date. Mandatory: Conditional. Notes: If the program supports medication provision", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "EMR", "sec": [], "corr": ["EMR-18"], "chg": "Require follow-up date when a medicine is provided; validate not before the visit date; use one source of truth.", "gap": "Optional only; two separate fields (prescription and case sheet); no tie to the medication-provision condition and no check that the date is in the future."}, "MF-33": {"ref": "MF-33", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Referred From / الإحالة من", "text": "Data type: Text. Mandatory: Yes. Notes: Name of the referring center / entity", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REF", "sec": [], "corr": ["REF-06"], "chg": "Expose facility name as 'Referred From' on Ref360/RefList/export; add referred_from_entity text for referrals originating outside the platform; make it mandatory when type is External.", "gap": "Referring centre is implied by facility_id (a coded facility), not a captured text/entity name; not shown as a labelled field on the doctor create form or exportable as 'Referred From'. External (non-platform) referring bodies cannot be recorded."}, "MF-34": {"ref": "MF-34", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Referred To / الإحالة إلى", "text": "Data type: Text. Mandatory: Yes. Notes: Name of the receiving center / entity", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REF", "sec": [], "corr": ["REF-06"], "chg": "Add a required destination facility / entity field to RefCreate.vue and validate in sp_referral_create; add to_entity_name text for external receivers.", "gap": "Destination centre is not mandatory (only speciality is) and cannot be an external organisation not registered as a facility."}, "MF-35": {"ref": "MF-35", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Referral Type / نوع الإحالة", "text": "Data type: Dropdown. Mandatory: Yes. Notes: Internal / External", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REF", "sec": [], "corr": ["REF-06"], "chg": "Add a separate referral scope dropdown Internal/External (mandatory) or remap values; validate in the SP; keep GBV as a confidentiality flag.", "gap": "Allowed values differ from client list (Internal/External); the GBV and Emergency values mix type with urgency/confidentiality."}, "MF-36": {"ref": "MF-36", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Referral Reason / سبب الإحالة", "text": "Data type: Text. Mandatory: Yes. Notes: Brief description of the reason", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REF", "sec": [], "corr": ["REF-06"], "chg": "Mark Reason required in RefCreate.vue with a validation message; add 'reason is required' guard to sp_referral_create.", "gap": "Mandatory rule enforced only at DB level (NOT NULL); no UI validation or SP guard message for reason."}, "MF-37": {"ref": "MF-37", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Intervention Summary / ملخص طلب التدخل", "text": "Data type: Long Text. Mandatory: Yes. Notes: Details of the problem", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REF", "sec": [], "corr": ["REF-06"], "chg": "Make clinical summary required in RefCreate.vue and sp_referral_create (relabel 'Intervention request summary').", "gap": "Field exists as long text but is optional, whereas client requires it for every referral."}, "MF-38": {"ref": "MF-38", "src": 2, "status": "Done", "pri": "-", "screen": "Referral Date / تاريخ الإحالة", "text": "Data type: Date. Mandatory: Yes. Notes: YYYY-MM-DD", "section": "Mandatory data fields (Al-Yamama)", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": "Stored as timestamp rather than a date-only value; user cannot back-date."}, "MF-39": {"ref": "MF-39", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Referral Status / حالة الإحالة", "text": "Data type: Dropdown. Mandatory: Yes. Notes: Pending / Completed / Under follow-up", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REF", "sec": [], "corr": ["REF-09"], "chg": "Agree mapping with client and relabel statuses in UI/exports and reports, or add a separate client-facing status; keep internal states for workflow.", "gap": "Status set differs from client's three (Pending / Completed / Under follow-up). Needs a mapping decision (e.g. Sent=Pending, Accepted=Under follow-up) or a display relabel."}, "MF-40": {"ref": "MF-40", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Referral Received Date / تاريخ استقبال الإحالة", "text": "Data type: Date. Mandatory: Conditional. Notes: By the receiving entity", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REF", "sec": [], "corr": ["REF-07"], "chg": "Relabel/map accepted_at as Received date or add received_at; require it on Accept; allow entry for external referrals.", "gap": "No distinct received date; conditional rule (required once receiving entity acts) not enforced; external receivers cannot enter it."}, "MF-41": {"ref": "MF-41", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Intervention Type / نوع التدخل الحاصل", "text": "Data type: Text. Mandatory: Conditional. Notes: Description of the intervention provided", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REF", "sec": [], "corr": ["REF-10"], "chg": "Add intervention_type column and field on the close/complete step; require it when status becomes Completed or Under follow-up.", "gap": "Type/description of the intervention provided is not captured."}, "MF-42": {"ref": "MF-42", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Intervention Outcomes / نتائج التدخل", "text": "Data type: Long Text. Mandatory: Conditional. Notes: Outcomes and improvements", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REF", "sec": [], "corr": ["REF-10"], "chg": "Relabel to Intervention outcomes; confirm which statuses require it.", "gap": "Conditional rule is enforced for Completed only (not Under follow-up); the note is not specifically 'outcomes and improvements'."}, "MF-43": {"ref": "MF-43", "src": 2, "status": "Not done", "pri": "Low", "screen": "Results Notification Date / تاريخ إبلاغ النتائج", "text": "Data type: Date. Mandatory: Conditional. Notes: (none)", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REF", "sec": [], "corr": ["REF-10"], "chg": "Add results_notified_at column and set it when the outcome is communicated (conditional on Completed); expose on Ref360.", "gap": "Date results were communicated back is not captured."}, "MF-44": {"ref": "MF-44", "src": 2, "status": "Not done", "pri": "High", "screen": "Program / البرنامج", "text": "Data type: Dropdown. Mandatory: Yes. Notes: 3-digit and 3-letter code", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "MSTR", "sec": ["REG"], "corr": ["MSTR-17"], "chg": "Create program master with code (3-digit + 3-letter) and add program_id to patient/referral; mandatory dropdown on registration.", "gap": "No Program dropdown with client codes; value is a payer category, not the client's programme."}, "MF-45": {"ref": "MF-45", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Scheme / المخطط", "text": "Data type: (not stated). Mandatory: Yes. Notes: 3-digit code", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "MSTR", "sec": ["REG"], "corr": ["MSTR-17"], "chg": "Clarify the definition with the client; add scheme master and mandatory field.", "gap": "Scheme code not captured; the client must define what it is and its values."}, "MF-46": {"ref": "MF-46", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Beneficiary ID / رقم ملف المستفيد", "text": "Data type: Text. Mandatory: Yes. Notes: Unique beneficiary identifier", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REG", "sec": [], "corr": ["REG-14"], "chg": "Confirm whether MRN can serve as Beneficiary ID; make it globally unique or add the client's ID format; label as Beneficiary ID.", "gap": "Unique only per facility, not globally; format is not the client's beneficiary file number scheme."}, "MF-47": {"ref": "MF-47", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Service Center / مركز تقديم الخدمة", "text": "Data type: Dropdown. Mandatory: Yes. Notes: Name of the center / clinic", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REG", "sec": ["MSTR"], "corr": ["REG-14"], "chg": "Show facility name as Service Center in patient/referral grids and exports.", "gap": "Service centre is captured by token, not chosen on the form; not shown as a labelled 'Service Center' column in patient/referral lists or exports."}, "MF-48": {"ref": "MF-48", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Registered By / المستخدم المسجل", "text": "Data type: Text. Mandatory: Yes. Notes: Name of the registering staff member", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REG", "sec": ["REF"], "corr": ["REG-14"], "chg": "Join created_by to user/clinician name in patient and referral views and exports.", "gap": "Stored as an id, not a name; no visible Registered By on patient record."}, "MF-49": {"ref": "MF-49", "src": 2, "status": "Done", "pri": "-", "screen": "Last Modified Date / تاريخ آخر تعديل", "text": "Data type: DateTime. Mandatory: Yes. Notes: Date of last update", "section": "Mandatory data fields (Al-Yamama)", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": "Not every patient edit path was verified to touch updated_at; not always shown in the UI."}, "MF-50": {"ref": "MF-50", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Record Status / حالة السجل", "text": "Data type: Dropdown. Mandatory: Yes. Notes: Active / Closed / On Hold", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REG", "sec": [], "corr": ["REG-14"], "chg": "Map Suspended to On Hold and add Closed for the patient/case record, or relabel in UI and exports.", "gap": "Record status values differ (Suspended vs On Hold; no Closed for patient); needs mapping."}, "MF-51": {"ref": "MF-51", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Administrative Notes / ملاحظات إدارية", "text": "Data type: Long Text. Mandatory: Optional. Notes: Internal notes", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REG", "sec": ["REF"], "corr": ["REG-14"], "chg": "Add admin_notes TEXT (optional) on patient and referral with staff-only visibility.", "gap": "Remarks is short (280) and used for workflow reasons, so it is not an internal-notes field."}, "GR-01": {"ref": "GR-01", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Dashboard", "text": "Enhance the interactivity of indicators and enable access to their related details.", "section": "General recommendations", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-13"], "chg": "Make each tile link to its list screen pre-filtered (appointments, consultations, calls, clinicians, patients, ratings); make metric cards open the related report.", "gap": "Headline indicators do not drill through to their underlying lists."}, "GR-02": {"ref": "GR-02", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Dashboard", "text": "Add the ability to select the time period for displaying data.", "section": "General recommendations", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-11"], "chg": "Add a period selector to the dashboard and pass the range to tile queries / count endpoints; reuse for hub-spoke dashboard.", "gap": "No period selector (today/7d/30d/custom) on the dashboard."}, "GR-03": {"ref": "GR-03", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Dashboard", "text": "Provide a clear section for actions and alerts that require follow-up.", "section": "General recommendations", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-13"], "chg": "Add an Action required panel (open complaints, pending verifications, safeguarding queue, security alerts, overdue referrals) with counts linking to queues; enable it independent of the flag.", "gap": "No consolidated 'needs action / alerts' section in the default dashboard."}, "GR-04": {"ref": "GR-04", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Search, Filters, and Sorting", "text": "Review search, filter, and sort functions across all interfaces and ensure they are consistent and working correctly.", "section": "General recommendations", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-03"], "chg": "Move search/sort/paging to server side for large lists; audit each screen's filters against its columns; standardise the dashboard and report screens on the same controls.", "gap": "Consistent look but filtering/sorting is client-side on first 100 rows; server-side search only where a parent handles @search; no cross-screen audit of each filter was done."}, "GR-05": {"ref": "GR-05", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Search, Filters, and Sorting", "text": "Align filtering options with the type of data displayed.", "section": "General recommendations", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-02"], "chg": "Drive filter control from column format: select for badge/status, date range for date, number range for money/number, lookup for facility/governorate.", "gap": "Filter control does not follow the data type (status, date, amount, facility)."}, "GR-06": {"ref": "GR-06", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Search, Filters, and Sorting", "text": "Improve date and time selection by using appropriate pickers instead of free-text input where needed.", "section": "General recommendations", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-02"], "chg": "Add a date-range filter to AfdGrid for date/datetime columns; replace remaining free-text date/time fields with a shared picker.", "gap": "Date columns cannot be filtered by picker; pickers are browser-native and inconsistent."}, "GR-07": {"ref": "GR-07", "src": 2, "status": "Partly done", "pri": "High", "screen": "Reports and Export", "text": "Review report export functions and ensure the accuracy and completeness of the resulting data.", "section": "General recommendations", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-08"], "chg": "Define export content per report, add totals and the filter period in the file, add UAT reconciliation against the on-screen figures.", "gap": "Export content accuracy not validated; grids have no export; M&E CSV exports only what is on screen."}, "GR-08": {"ref": "GR-08", "src": 2, "status": "Not done", "pri": "High", "screen": "Reports and Export", "text": "Ensure that export to PDF and Excel works as required.", "section": "General recommendations", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-07"], "chg": "Add PDF and XLSX output to report export (server-side render in AfdGovernance or client library) and an export-to-Excel button on AfdGrid lists.", "gap": "No PDF or Excel export anywhere in the console."}, "GR-09": {"ref": "GR-09", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Call Quality", "text": "Complete the call quality report with indicators that help assess call quality.", "section": "General recommendations", "out": true, "mod": "CONS", "sec": ["ADMUX"], "corr": ["CONS-08", "CONS-09"], "chg": " const EFFORT_DAYS = {S:0.5, M:2, L:6, XL:12};

const tabsEl = $('#tabs'), main = $('#main');
tabsEl.innerHTML = TABS.map(t => t.id==='sep' ? '<span class="sep"></span>' :
  `<button role="tab" id="tab-${t.id}" aria-selected="false" data-id="${t.id}" title="${esc(t.title||t.label)}">${esc(t.label)}${t.n!=null?`<span class="n">${t.n}</span>`:''}</button>`).join('');

TABS.filter(t=>t.id!=='sep').forEach(t=>{ const d=document.createElement('section'); d.className='panel hide'; d.id='panel-'+t.id; d.setAttribute('role','tabpanel'); d.setAttribute('aria-labelledby','tab-'+t.id); main.appendChild(d); panels[t.id]=d; });
const rendered = {};
function show(id, then){
  if(!panels[id]) id='overview';
  Object.entries(panels).forEach(([k,p])=>p.classList.toggle('hide',k!==id));
  tabsEl.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected', b.dataset.id===id));
  if(!rendered[id]){ rendered[id]=true; RENDER[id](panels[id]); }
  history.replaceState(null,'','#'+id);
  const sel = tabsEl.querySelector(`button[data-id="${id}"]`); if(sel) sel.scrollIntoView({inline:'center',block:'nearest'});
  window.scrollTo({top:0}); if(then) then();
}
tabsEl.addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) show(b.dataset.id); });
tabsEl.addEventListener('keydown', e=>{
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft') return;

function gotoCorr(id){

function fileIndex(corrs){
  const idx={}; // layer -> path -> [{c,kind,app,change}]
  LAYERS.forEach(([k])=>idx[k]={});
  corrs.forEach(c=>LAYERS.forEach(([k])=>(c.files[k]||[]).forEach(f=>{ const p=f.path||'(unspecified)'; (idx[k][p]=idx[k][p]||[]).push({c:c.id,mod:c.module,kind:f.kind,app:f.app,change:f.change}); })));
  return idx;
}
function fileTable(idx, withMod=false, q=''){
  q=q.toLowerCase();

    const paths=Object.keys(idx[k]).sort().filter(p=>!q||p.toLowerCase().includes(q)||idx[k][p].some(e=>(e.change||'').toLowerCase().includes(q)));
    if(!paths.length) return '';
    return `<h3><span class="pill" style="background:var(--${cls}-bg);color:var(--${cls})">${label}</span> ${paths.length} file${paths.length===1?'':'s'}</h3>`+

      paths.map(p=>{ const es=idx[k][p]; const kinds=[...new Set(es.map(e=>e.kind))];
        return `<tr><td><div class="path">${esc(p)}</div>${kinds.map(x=>`<span class="kind ${esc(x)}">${esc(x)}</span>`).join('')}${es[0].app?`<span class="app">${esc([...new Set(es.map(e=>e.app).filter(Boolean))].join(', '))}</span>`:''}</td>`+

     const L=(n,cs,t)=>`<div class="wave"><b>${n}: ${t}</b> <span class="mut">${cs.length} corrections, ≈ ${fmtDays(cs.reduce((a,c)=>a+days(c),0))} days</span><details class="fold"><summary>Show the corrections</summary>${cs.map(c=>`<div class="small"><a class="chip" data-corr="${esc(c.id)}" href="#${esc(c.id)}">${esc(c.id)}</a> ${esc(c.title)} ${pill(c.priority)} ${effPill(c.effort)}</div>`).join('')}</details></div>`;
     return L('Wave 1',w1,'fix what is broken and unsafe')+L('Wave 2',w2,'decisions, then the larger changes')+L('Wave 3',w3,'polish'); })()+
   `<h3>How to read this plan</h3><div class="legend"><span><span class="chip e1">Excel 1</span> client application review (doctor and patient apps, detailed tables)</span><span><span class="chip e2">Excel 2</span> admin module review and mandatory data fields</span><span>${pill('High')} patient safety, privacy, security, data loss, broken core function, donor reporting</span><span>Effort: S under a day, M 1 to 3, L 3 to 10, XL over 10 working days (indicative)</span></div>`+
   `<p class="small mut"><b>Migration numbers:</b> several modules name a new SQL migration "next free number" or 037 to 044. These are placeholders; numbers are assigned in the order the work is done (036 is already taken by the payments draft). <b>Paths:</b> front-end apps and API services are under atlas/generator/preview, hand-written SQL, Applications/shared and Api/deploy are at the repository root; every path in this plan is repository-relative and every file marked modify exists today.</p><p class="small mut">A file is planned in one module only (for example the shared grid in the admin-console module, role lists and audit procedures in security, translation files in localization); other modules point to it as a dependency. The "All files" tab shows every file across the modules in one place.</p>`;
  el.querySelectorAll('tr[data-mod]').forEach(r=>r.addEventListener('keydown',e=>{ if(e.key==='Enter') show(r.dataset.mod); }));
};
MODS.forEach(m=>{
  RENDER[m.key] = el => {
    const cs=m.corrections; let view='corr', pri='', q='';
    const c1=m.rows.filter(r=>ROWS[r]&&ROWS[r].src===1).length, c2=m.rows.length-c1;
    const see = Object.values(ROWS).filter(r=>(r.sec||[]).includes(m.key) && r.mod!==m.key);
    el.innerHTML = `<h2>${esc(m.name)}</h2><p class="sub">${esc(m.summary)}</p>`+
      `<div class="legend"><span><b>${m.rows.length}</b> points (<span class="chip e1">Excel 1 × ${c1}</span><span class="chip e2">Excel 2 × ${c2}</span>)</span><span><b>${cs.length}</b> corrections</span><span><b>${new Set(cs.flatMap(c=>LAYERS.flatMap(([k])=>(c.files[k]||[]).map(f=>f.path)))).size}</b> files</span><span>≈ <b>${fmtDays(cs.reduce((a,c)=>a+days(c),0))}</b> working days (indicative)</span></div>`+
      `<div class="bar"><div class="seg" role="group" aria-label="View"><button data-v="corr" aria-pressed="true">By correction</button><button data-v="file" aria-pressed="false">By file</button></div>`+
      `<select aria-label="Priority"><option value="">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select><input type="search" placeholder="Search this module" aria-label="Search"><span class="mut small" id="cnt-${m.key}"></span></div>`+
      `<div class="v-corr"></div><div class="v-file hide"></div>`+
      (see.length?`<details class="fold"><summary>Related points owned by other modules (${see.length})</summary><div class="small">${see.map(r=>`<div class="pt">${refChip(r.ref)}${stPill(r.status)}<div><b>${esc(r.screen)}</b>: ${esc(r.text)} <span class="mut">→ ${esc(r.mod)}: ${corrChips(r.corr)}</span></div></div>`).join('')}</div></details>`:'');
    const vc=$('.v-corr',el), vf=$('.v-file',el), cnt=$('#cnt-'+m.key);
    const redraw=()=>{
      const f=cs.filter(c=>(!pri||c.priority===pri)&&(!q||JSON.stringify(c).toLowerCase().includes(q)));
      vc.innerHTML=f.map(cardHtml).join('')||'<p class="mut">No corrections match.</p>';
      vf.innerHTML=fileTable(fileIndex(f),false,'');
      cnt.textContent=`${f.length} of ${cs.length} corrections`;
    };
    el.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{ view=b.dataset.v; el.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b)); vc.classList.toggle('hide',view!=='corr'); vf.classList.toggle('hide',view!=='file'); }));
    $('select',el).addEventListener('change',e=>{ pri=e.target.value; redraw(); });
    $('input',el).addEventListener('input',e=>{ q=e.target.value.toLowerCase(); redraw(); });
    redraw();
  };
});
RENDER.files = el => {
  el.innerHTML=`<h2>All files, across every module</h2><p class="sub">Every file the plan touches, grouped by layer. Each row lists the corrections that change it and what changes.</p><div class="bar"><input type="search" placeholder="Filter by file name or change" aria-label="Filter"></div><div class="body"></div>`;
  const idx=fileIndex(allCorr), body=$('.body',el);
  const draw=q=>body.innerHTML=fileTable(idx,true,q); draw('');
  $('input',el).addEventListener('input',e=>draw(e.target.value));
};
RENDER.decisions = el => {
  const cs=allCorr.filter(hasDecision);
  const groups={}; cs.forEach(c=>(groups[c.module]=groups[c.module]||[]).push(c));
  el.innerHTML=`<h2>Decisions needed from the client</h2><p class="sub">${cs.length} corrections wait on a decision. Until it is taken, the correction cannot be finished (the Not code section of each correction says what to build for each answer).</p>`+
   MODS.filter(m=>groups[m.key]).map(m=>`<h3>${esc(m.name)}</h3><table><thead><tr><th style="width:9%">Correction</th><th style="width:30%">Title</th><th>Decision needed</th><th style="width:8%">Priority</th><th style="width:8%">Points</th></tr></thead><tbody>`+
     groups[m.key].map(c=>`<tr><td><a class="chip" data-corr="${esc(c.id)}" href="#${esc(c.id)}">${esc(c.id)}</a></td><td>${esc(c.title)}</td><td>${esc(c.decision_needed)}</td><td>${pill(c.priority)}</td><td>${c.refs.length}</td></tr>`).join('')+`</tbody></table>`).join('')||'<p class="mut">None.</p>';
};
RENDER.coverage = el => {
  const st=DATA.stats; const all=Object.values(ROWS); const out=all.filter(r=>r.out), done=all.filter(r=>!r.out);
  el.innerHTML=`<h2>Coverage: every outstanding point</h2>`+
   `<div class="banner ${st.uncovered.length?'bad':'ok'}">${st.uncovered.length?`${st.uncovered.length} outstanding points are NOT covered: ${esc(st.uncovered.join(', '))}`:`All ${st.outstanding} outstanding points (Excel 1: ${st.e1}, Excel 2: ${st.e2}) are covered by at least one correction.`}</div>`+
   `<p class="sub">The table lists every point that still needs a change or a decision, with its module and the corrections that resolve it. ${done.length} further points were reviewed and need no change; they are listed at the end.</p>`+
   `<div class="bar"><input type="search" placeholder="Search ref, screen or wording" aria-label="Search"><select id="f-src"><option value="">Both Excels</option><option value="1">Excel 1</option><option value="2">Excel 2</option></select>`+
   `<select id="f-mod"><option value="">All modules</option>${MODS.map(m=>`<option value="${m.key}">${esc(m.name)}</option>`).join('')}</select>`+
   `<select id="f-st"><option value="">All statuses</option>${['Not done','Partly done','Needs decision','Operational','Cannot verify','Done'].map(s=>`<option>${s}</option>`).join('')}</select><span class="mut small" id="cv-cnt"></span></div>`+
   `<div id="cv-t"></div><details class="fold"><summary>Reviewed and needing no change (${done.length})</summary><table><thead><tr><th>Ref</th><th>Excel</th><th>Screen</th><th>Client wording</th></tr></thead><tbody>${done.map(r=>`<tr><td>${refChip(r.ref)}</td><td>${r.src}</td><td>${esc(r.screen)}</td><td>${esc(r.text)}</td></tr>`).join('')}</tbody></table></details>`;
  const draw=()=>{
    const q=$('input',el).value.toLowerCase(), s=$('#f-src',el).value, m=$('#f-mod',el).value, t=$('#f-st',el).value;
    const f=out.filter(r=>(!s||String(r.src)===s)&&(!m||r.mod===m)&&(!t||r.status===t)&&(!q||(r.ref+' '+r.screen+' '+r.text).toLowerCase().includes(q))).sort((a,b)=>a.src-b.src||a.ref.localeCompare(b.ref));
    $('#cv-cnt',el).textContent=`${f.length} shown`;
    $('#cv-t',el).innerHTML=`<table><thead><tr><th>Ref</th><th>Excel</th><th>Status</th><th>Priority</th><th>Screen</th><th>Client wording</th><th>Module</th><th>Corrections</th></tr></thead><tbody>`+
      f.map(r=>`<tr><td>${refChip(r.ref)}</td><td>${r.src}</td><td>${stPill(r.status)}</td><td>${pill(r.pri&&r.pri!=='-'?r.pri:'')}</td><td>${esc(r.screen)}</td><td class="small">${esc(r.text)}</td><td>${esc(r.mod)}${(r.sec||[]).length?`<div class="mut small">also ${esc(r.sec.join(', '))}</div>`:''}</td><td>${corrChips(r.corr)}</td></tr>`).join('')+`</tbody></table>`;
  };
  el.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',draw)); draw();
};
show((location.hash||'#overview').slice(1));
</script>
</body>
</html>
