Medium", "screen": "Performance and Export", "text": "Database performance should be reviewed and optimised, as data retrieval and data updates are taking a long time.", "section": "General Notes Applying to the Entire Admin Dashboard", "out": true, "mod": "PLAT", "sec": [], "corr": ["PLAT-04"], "chg": "Run a DB performance review (slow-query log, missing indexes, SP plans) on the hosted database and tune.", "gap": "Needs query plans and live data volumes."}, "AM-017": {"ref": "AM-017", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Performance and Export", "text": "Provide a Bulk Upload facility for beneficiary details, in addition to the existing requirement for bulk updating the medicine list.", "section": "General Notes Applying to the Entire Admin Dashboard", "out": true, "mod": "ADMUX", "sec": ["REG", "MSTR"], "corr": ["ADMUX-17"], "chg": "Add Patient and Medicine entity types to bulk import with validation of mandatory beneficiary fields, template download and error report.", "gap": "No bulk upload for beneficiaries or medicines; parser has no quoted-comma handling."}, "AM-018": {"ref": "AM-018", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Performance and Export", "text": "Provide a separate “Reports” item under the main menu, with reports that can be generated dynamically based on the selected criteria.", "section": "General Notes Applying to the Entire Admin Dashboard", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-16"], "chg": "Expose a Reports menu (catalogue, run with parameters, history) and add parameter inputs per report definition.", "gap": "No top-level Reports menu with dynamic criteria."}, "AM-019": {"ref": "AM-019", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Performance and Export", "text": "Define which information, data and menu functions require Print / Save As options and support appropriate output formats such as Word, PDF, Excel and Text.", "section": "General Notes Applying to the Entire Admin Dashboard", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-08"], "chg": "Decide which screens need Print/Save As and formats; then implement print stylesheet and export formats (PDF, Excel, Word, Text) via shared export helper.", "gap": "No defined list of print/export screens and no output formats beyond CSV."}, "AM-020": {"ref": "AM-020", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Dashboard [Dashboard & Reports → Dashboard]", "text": "On first login, the Appointments page opens instead of the dashboard information page.", "section": "Dashboard & Reports Section", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-01"], "chg": "Change the LANDING map so ADM, MGR and SYSADM redirect to '/dashboard'.", "gap": "Admin and Manager do not land on the dashboard in the repository either (the hosted build landed on Appointments, an older mapping)."}, "AM-021": {"ref": "AM-021", "src": 2, "status": "Done", "pri": "-", "screen": "Dashboard [Dashboard & Reports → Dashboard]", "text": "Appointments are shown as the default page on login, but the title does not specify which appointments are meant: today's, this week's, or all appointments booked on the platform?", "section": "Dashboard & Reports Section", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": "Tile labels do say 'today' now, but the admin landing page itself is not the dashboard (see AM-020)."}, "AM-022": {"ref": "AM-022", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Dashboard [Dashboard & Reports → Dashboard]", "text": "The dashboard is not interactive and does not contain sufficient indicators and statistics.", "section": "Dashboard & Reports Section", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-11"], "chg": "Define the required KPI list with the client; make tiles link to the filtered list; add date-range filter and trend charts; move counts to a server endpoint.", "gap": "Not interactive; few indicators; no trends, no drill-through, counts are computed client-side from first 500 rows."}, "AM-023": {"ref": "AM-023", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Dashboard [Dashboard & Reports → Dashboard]", "text": "The consultation-type filter shows the same generic filter operators, while this column has only three values: video call, voice call, chat messages. The filter should be a list of these values.", "section": "Dashboard & Reports Section", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-02"], "chg": "Where consultation lists/filters are needed add a select filter bound to the mode values (Video, Voice, Chat) instead of free text.", "gap": "No consultation-type dropdown with the three values on any dashboard list."}, "AM-024": {"ref": "AM-024", "src": 2, "status": "Not done", "pri": "Low", "screen": "Dashboard [Dashboard & Reports → Dashboard]", "text": "The Arabic title «ياواكش» (\"My complaints\") is a mistranslation; the correct term is «ىواكش لا» (\"Complaints\"). In addition, the way complaints are displayed on the dashboard is unclear.", "section": "Dashboard & Reports Section", "out": true, "mod": "L10N", "sec": ["QUAL"], "corr": ["L10N-06"], "chg": "Change the Arabic (and align English) title per the client's wording, or replace the card with a complaints count tile (open/overdue) linking to the list.", "gap": "Arabic title unchanged; the card is an assignee worklist, not an overall complaints indicator, and the English label key (My Complaints) differs from the on-screen default text."}, "AM-025": {"ref": "AM-025", "src": 2, "status": "Done", "pri": "-", "screen": "Dashboard [Dashboard & Reports → Dashboard]", "text": "Clarify the meaning of “Active Calls Now” — specifically whether it represents consultations that are currently live and in progress.", "section": "Dashboard & Reports Section", "out": true, "mod": "ADMUX", "sec": ["CONS"], "corr": ["ADMUX-12"], "chg": "None (optionally add a staleness window so abandoned sessions drop out).", "gap": "A session that was never marked Left (browser closed) keeps counting as active; it is 'session open', not strictly 'media currently flowing'."}, "AM-026": {"ref": "AM-026", "src": 2, "status": "Needs decision", "pri": "Low", "screen": "Dashboard [Dashboard & Reports → Dashboard]", "text": "Clarify the meaning of “Active Clinicians” — specifically whether it represents the number of doctors currently available online.", "section": "Dashboard & Reports Section", "out": true, "mod": "ADMUX", "sec": ["MSTR"], "corr": ["ADMUX-12"], "chg": "Decide the meaning. If 'online now' is wanted, count clinicians with an active availability/instant-consult presence and rename; otherwise rename to 'Registered active clinicians'.", "gap": "The tile counts registered, active doctor accounts, not doctors currently online."}, "AM-027": {"ref": "AM-027", "src": 2, "status": "Needs decision", "pri": "Low", "screen": "Dashboard [Dashboard & Reports → Dashboard]", "text": "Remove “Average Clinician Rating” from the Dashboard if this indicator is not required for operational monitoring.", "section": "Dashboard & Reports Section", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-12"], "chg": "Confirm removal; then delete the avgRating tile entry (and its i18n key).", "gap": "Client conditional: remove if not needed for operations."}, "AM-028": {"ref": "AM-028", "src": 2, "status": "Needs decision", "pri": "Low", "screen": "Dashboard [Dashboard & Reports → Dashboard]", "text": "Remove “My Complaints” from the Dashboard if complaints are not intended to be displayed as a dashboard indicator.", "section": "Dashboard & Reports Section", "out": true, "mod": "ADMUX", "sec": ["QUAL"], "corr": ["ADMUX-12"], "chg": "Decide keep (rename, e.g. 'Complaints assigned to me') or remove the section and rely on the Complaints menu and bell.", "gap": "Client questions whether complaints belong on the dashboard."}, "AM-029": {"ref": "AM-029", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Hub & Spoke Overview [Dashboard & Reports → Hub & Spoke Overview]", "text": "Filters on the branches and centers overview page do not work.", "section": "Dashboard & Reports Section", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-14"], "chg": "Add a governorate selector and a from/to date filter that filter the list; keep Compute as a separate, clearly labelled action.", "gap": "The date box does not filter the table, and there are no real filters, which is why filtering appears not to work."}, "AM-030": {"ref": "AM-030", "src": 2, "status": "Done", "pri": "-", "screen": "Hub & Spoke Overview [Dashboard & Reports → Hub & Spoke Overview]", "text": "What is meant by \"Indicator Date\"?", "section": "Dashboard & Reports Section", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "AM-031": {"ref": "AM-031", "src": 2, "status": "Done", "pri": "-", "screen": "Hub & Spoke Overview [Dashboard & Reports → Hub & Spoke Overview]", "text": "What is the function of the button at the top of the page between the date box and the search box?", "section": "Dashboard & Reports Section", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-14"], "chg": "None (optionally rename to 'Recalculate for this date' with a tooltip).", "gap": "Button is labelled only 'Compute' with no explanation."}, "AM-032": {"ref": "AM-032", "src": 2, "status": "Operational", "pri": "Low", "screen": "Hub & Spoke Overview [Dashboard & Reports → Hub & Spoke Overview]", "text": "What is meant by \"First Facility\" (ق فرملا لولأا)? Is it a hospital, a medical center, Al-Yamama, or the governorate? \"First Facility\" also appears as a selector in the dashboard's top bar.", "section": "Dashboard & Reports Section", "out": true, "mod": "MSTR", "sec": ["ADMUX"], "corr": ["MSTR-15"], "chg": "Rename the seed facility to the real hospital/centre name in Master Data > Facilities; clarify in the report title that rows are governorates.", "gap": "A test/seed facility named 'First Facility' is in the hosted data, and the hub-spoke report groups by governorate, not facility."}, "AM-033": {"ref": "AM-033", "src": 2, "status": "Not done", "pri": "Low", "screen": "Hub & Spoke Overview [Dashboard & Reports → Hub & Spoke Overview]", "text": "On Hub & Spoke Overview, rename “Metric Date” to “Date”, “Appointments” to “Total Appointments”, “Consultations” to “Total Consultations”, and “Consults Done” to “Consultations Completed”.", "section": "Dashboard & Reports Section", "out": true, "mod": "ADMUX", "sec": ["L10N"], "corr": ["ADMUX-14"], "chg": "Rename to Date, Total Appointments, Total Consultations, Consultations Completed; move all headers to i18n keys with Arabic and Kurdish.", "gap": "Requested labels not applied; headers are also not translated for Arabic."}, "AM-034": {"ref": "AM-034", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Hub & Spoke Overview [Dashboard & Reports → Hub & Spoke Overview]", "text": "Clarify the significance and calculation of “Avg. Consult (Min)”, as the displayed value appears inconsistent when compared with the appointment and consultation figures.", "section": "Dashboard & Reports Section", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-14"], "chg": "Add a tooltip/definition, show sample size, and review the duration fallback.", "gap": "No on-screen definition; sample size per average is stored but not shown; the span fallback can overstate duration when participants rejoin."}, "AM-035": {"ref": "AM-035", "src": 2, "status": "Cannot verify", "pri": "Low", "screen": "Call Quality [Dashboard & Reports → Call Quality]", "text": "When selecting a filter, the dropdown disappears immediately before the filter criterion can be set.", "section": "Dashboard & Reports Section", "out": true, "mod": "ADMUX", "sec": ["CONS"], "corr": ["ADMUX-21"], "chg": "Redeploy the current web build and retest; none if the dropdown is gone.", "gap": "Cannot reproduce from code; hosted build probably predates the grid change."}, "AM-036": {"ref": "AM-036", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Call Quality [Dashboard & Reports → Call Quality]", "text": "Is the Call Quality page meant to assess the quality of the call (i.e., whether it was good without signal interruptions)? The current content of the page does not match that.", "section": "Dashboard & Reports Section", "out": true, "mod": "CONS", "sec": ["ADMUX"], "corr": ["CONS-09"], "chg": "Add quality columns from media_quality_sample (average bitrate/loss, drops, mode downgrade) and a Good/Fair/Poor rating; or rename the page 'Call Log'.", "gap": "The page reports call attendance/duration, not call quality (bitrate, loss, drops)."}, "AM-037": {"ref": "AM-037", "src": 2, "status": "Done", "pri": "-", "screen": "Call Quality [Dashboard & Reports → Call Quality]", "text": "Clarify the meaning and intended use of the “Facility” field on the Call Quality page.", "section": "Dashboard & Reports Section", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": "Header literal 'Facility' only; no explanation."}, "AM-038": {"ref": "AM-038", "src": 2, "status": "Not done", "pri": "High", "screen": "Complaints [Dashboard → Complaints list (full view and actions)]", "text": "In the complaints list actions: an error appears when updating the status, and an error appears when executing the \"Resolve\" action.", "section": "Dashboard & Reports Section", "out": true, "mod": "QUAL", "sec": [], "corr": ["QUAL-01"], "chg": "Add status picker (+remarks) to Update Status; hide or disable Resolve until assigned, or allow Open->Resolved; show friendly messages; confirm the hotfix is applied.", "gap": "Update Status has no status picker; Resolve fails on unassigned complaints with a raw error."}, "AM-039": {"ref": "AM-039", "src": 2, "status": "Needs decision", "pri": "Low", "screen": "Complaints [Dashboard → Complaints list (full view and actions)]", "text": "The purpose of the \"Escalate\" action is unclear, and it does not work.", "section": "Dashboard & Reports Section", "out": true, "mod": "QUAL", "sec": [], "corr": ["QUAL-05"], "chg": "Decide the escalation rule (e.g. overdue complaints go to a senior admin); then implement an Escalate action with target and reason, or keep it status-only.", "gap": "Escalation policy (to whom, when, SLA) is undefined; the hosted Escalate item is not in the repository UI."}, "AM-040": {"ref": "AM-040", "src": 2, "status": "Done", "pri": "-", "screen": "Complaints [Dashboard → Complaints list (full view and actions)]", "text": "The complaints list first shows a single complaint with its details, and all complaints appear only after clicking Back. The correct flow should be: show the full list first, then a complaint's details when selected.", "section": "Dashboard & Reports Section", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None; verify after redeploy.", "gap": "Observed order (single complaint first) not reproducible from code; may be the older hosted build or a stale 'pane1' query string."}, "AM-041": {"ref": "AM-041", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Complaints [Dashboard → Complaints list (full view and actions)]", "text": "The Back button on the complaints page has an inappropriate size and position.", "section": "Dashboard & Reports Section", "out": true, "mod": "QUAL", "sec": ["ADMUX"], "corr": ["QUAL-02"], "chg": "Place the Back button in the page header actions with standard size and styling.", "gap": "Size/position unstyled and detached from the title row; visual quality cannot be confirmed here."}, "AM-042": {"ref": "AM-042", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Complaints [Dashboard → Complaints list (full view and actions)]", "text": "The complaint full view contains unclear details. A complaint should clearly show: complaint number, doctor's name, reason, complaint details, and complaint date.", "section": "Dashboard & Reports Section", "out": true, "mod": "QUAL", "sec": [], "corr": ["QUAL-02"], "chg": "Show a simple header block: Complaint no, Doctor, Reason (category/subject), Details, Date; move the other cards to a collapsed 'More'.", "gap": "No explicit 'Doctor' or 'Reason' fields (doctor is inside the visit line, shown only if a consultation is linked); extra cards add noise; dates not grouped with the number."}, "AM-043": {"ref": "AM-043", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Complaints [Dashboard → Complaints list (full view and actions)]", "text": "Suggestion: the complaints page could be managed by a single Admin who follows up on complaints and changes their status from \"Open\" to \"Closed\" (Resolved / Appropriate action taken), recording the resolution date and details, with a per-complaint report that can be downloaded as a file.", "section": "Dashboard & Reports Section", "out": true, "mod": "QUAL", "sec": [], "corr": ["QUAL-06"], "chg": "Decide the owner model; add 'Download report' (PDF/CSV) on the complaint detail; optionally simplify the status flow to Open -> Closed with resolution date.", "gap": "No single-owner policy, no explicit Open/Closed simplification, no per-complaint file export."}, "AM-044": {"ref": "AM-044", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Clinical [Clinical Operations → Clinical]", "text": "The sidebar for the Clinical Operations section should contain a submenu of operation types: Consultations – Case Records – Prescriptions – MHPSS.", "section": "Clinical Operations Section", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-19"], "chg": "Decide whether to expose the four types as sidebar children (or as workspace tabs with the workflow UI flag on); if yes, add child routes to menuRoutes/AppShell for the Clinical entry.", "gap": "The four operation types are in-page sections, not a sidebar submenu/dropdown as requested."}, "AM-045": {"ref": "AM-045", "src": 2, "status": "Not done", "pri": "Low", "screen": "Clinical [Clinical Operations → Clinical]", "text": "Deactivate the device reading (Diagnostic Devices) function on the consultation page for the time being.", "section": "Clinical Operations Section", "out": true, "mod": "MSTR", "sec": ["EMR"], "corr": ["MSTR-14"], "chg": "Remove or feature-flag the 'device-reading' tab in Cons360.vue (and the doctor-app entry if it must be hidden there too).", "gap": "The Device Readings tab is still shown on the consultation page."}, "AM-046": {"ref": "AM-046", "src": 2, "status": "Needs decision", "pri": "Medium", "screen": "Triage [Clinical Operations → Triage]", "text": "Who is responsible for setting triage rules: the doctor or the Admin?", "section": "Clinical Operations Section", "out": true, "mod": "TRIAGE", "sec": [], "corr": ["TRIAGE-02"], "chg": "Client to confirm: admin authors, named doctor owns/approves (current design) or doctors author. Then align upsert/set-status roles and hide edit actions for roles that cannot save.", "gap": "Intended governance is not fixed: code lets only Admin author rules while a doctor/manager owns and approves them. Manager sees authoring screens but cannot save (403)."}, "AM-047": {"ref": "AM-047", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Triage [Clinical Operations → Triage]", "text": "When entering a new rule, the \"Clinical Owner\" (a doctor) must be selected, and the doctor's name appears duplicated in the list; it should appear only once.", "section": "Clinical Operations Section", "out": true, "mod": "TRIAGE", "sec": [], "corr": ["TRIAGE-03"], "chg": "De-duplicate the option list by clinician id/name in the editor and clean duplicate clinician rows; mark Clinical owner as required (or explain it is needed at activation).", "gap": "Duplicate names come from duplicate clinician records (seed/test data) and are not filtered in the UI; the requirement (owner needed) is only enforced at activation, not clearly on create."}, "AM-048": {"ref": "AM-048", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Triage [Clinical Operations → Triage]", "text": "The \"Matching Review\" tab shows an error immediately when opened.", "section": "Clinical Operations Section", "out": true, "mod": "TRIAGE", "sec": [], "corr": ["TRIAGE-01"], "chg": "Add MGR (and HW if used) to the match-suggestion get roles, or hide the Match Review tab for roles not allowed; rebuild AfdClinical.", "gap": "Manager gets 403 and the screen shows 'load failed' as soon as the tab opens."}, "AM-049": {"ref": "AM-049", "src": 2, "status": "Done", "pri": "Low", "screen": "Triage [Clinical Operations → Triage]", "text": "It is unclear how the \"Generate\" button works.", "section": "Clinical Operations Section", "out": true, "mod": "TRIAGE", "sec": [], "corr": ["TRIAGE-05"], "chg": "Optional: replace ID boxes with a patient picker and add help text.", "gap": "The dialog uses raw patient/intake ID inputs with no explanation, which is why it is unclear."}, "AM-050": {"ref": "AM-050", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Triage [Clinical Operations → Triage]", "text": "In \"Rule Approvals\" there is an \"Open 360\" button whose purpose is unclear; clicking it opens the rule edit window.", "section": "Clinical Operations Section", "out": true, "mod": "TRIAGE", "sec": [], "corr": ["TRIAGE-04"], "chg": "Rename to 'Open rule' / 'Edit rule' (or build a read-only rule detail).", "gap": "The label promises a 360 view but opens the edit form; purpose unexplained."}, "AM-051": {"ref": "AM-051", "src": 2, "status": "Not done", "pri": "Low", "screen": "Triage [Clinical Operations → Triage]", "text": "The display of \"Rule Approvals\" is unsuitable, as it appears inside a long column containing the active rules.", "section": "Clinical Operations Section", "out": true, "mod": "TRIAGE", "sec": [], "corr": ["TRIAGE-04"], "chg": "Show only Draft/pending rules (or put them first, collapse/scroll Active column) in the Approvals tab.", "gap": "No separate/pending-first view; approvals are not isolated from the long active column."}, "AM-052": {"ref": "AM-052", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Quality & Feedback [Quality & Feedback]", "text": "The doctor rating display is unclear. A table is needed listing the patients who rated the doctor, with a field for the comments each patient provided.", "section": "Quality & Feedback Section", "out": true, "mod": "QUAL", "sec": [], "corr": ["QUAL-04"], "chg": "Add a table view (patient, rating, comment, date, consultation) per doctor; show comments without the expand step.", "gap": "Presented as per-doctor cards with a collapsible comment list, not a flat table of rating patients with a comments column; comments from seed data are hidden."}, "AM-053": {"ref": "AM-053", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Section Organization", "text": "Suggestion: add a dropdown menu in this section containing: Referrals – Patients – Patient Registration.", "section": "Patients & Referrals Section", "out": true, "mod": "ADMUX", "sec": ["REG", "REF"], "corr": ["ADMUX-19"], "chg": "Decide whether to add a collapsible group with a Register Patient entry (contradicts the no-actions-in-sidebar rule) or keep the in-screen Add button.", "gap": "No dropdown containing Referrals, Patients, Patient Registration; registration is only reachable from inside Patients."}, "AM-054": {"ref": "AM-054", "src": 2, "status": "Not done", "pri": "High", "screen": "Referrals [Patients & Referrals → Referrals]", "text": "When adding a new referral and entering the information, the Confirm button does not respond.", "section": "Patients & Referrals Section", "out": true, "mod": "REF", "sec": [], "corr": ["REF-01"], "chg": "Add consultation (or make consultation_id optional in SP), auto-fill facility/referrer from the session, use patient picker; hide Add for MGR.", "gap": "Confirm fails for every user: missing consultation, and Manager lacks permission. Dialog also uses raw ID boxes (facilityId, patientId, referredById)."}, "AM-055": {"ref": "AM-055", "src": 2, "status": "Done", "pri": "-", "screen": "Referrals [Patients & Referrals → Referrals]", "text": "Referral response rules: how are they entered? Are they fixed and entered once, or does each doctor enter their own rules? And who is responsible for defining them?", "section": "Patients & Referrals Section", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "AM-056": {"ref": "AM-056", "src": 2, "status": "Done", "pri": "Low", "screen": "Referrals [Patients & Referrals → Referrals]", "text": "The referrals table has three tabs at the top (All – Inbox – Answered). What do they mean?", "section": "Patients & Referrals Section", "out": true, "mod": "REF", "sec": [], "corr": ["REF-05"], "chg": "Add tooltips/help; optionally add an Answered filter.", "gap": "The tabs are not explained on screen and 'Answered' (client wording) does not exist."}, "AM-057": {"ref": "AM-057", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Referrals [Patients & Referrals → Referrals]", "text": "Suggestion: display referrals in a single table including: patient name, referred-to doctor, referral reason, date, and severity.", "section": "Patients & Referrals Section", "out": true, "mod": "REF", "sec": [], "corr": ["REF-05"], "chg": "Add 'Referred to' (clinician/speciality/facility) and 'Date' columns (data exists in referral list SP).", "gap": "Missing referred-to doctor/speciality and referral date columns requested; urgency is present as severity."}, "AM-058": {"ref": "AM-058", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Referrals [Patients & Referrals → Referrals]", "text": "Clarify whether “Facility ID” on the Add Referral screen is system-generated or entered manually.", "section": "Patients & Referrals Section", "out": true, "mod": "REF", "sec": [], "corr": ["REF-01"], "chg": "Pre-fill from auth.facilityId and hide it; for the receiving facility use a facility picker.", "gap": "It is entered manually (and unlabelled for users); should come from the session."}, "AM-059": {"ref": "AM-059", "src": 2, "status": "Not done", "pri": "High", "screen": "Referrals [Patients & Referrals → Referrals]", "text": "Adding a new referral is currently unsuccessful; the Add Referral function should save the referral correctly after confirmation.", "section": "Patients & Referrals Section", "out": true, "mod": "REF", "sec": [], "corr": ["REF-01"], "chg": "Make consultation optional or select it; auto-fill facility/referrer; surface a clear error.", "gap": "Referral cannot be saved from the web console form."}, "AM-060": {"ref": "AM-060", "src": 2, "status": "Done", "pri": "Low", "screen": "Referrals [Patients & Referrals → Referrals]", "text": "Clarify what should happen when a referral status is changed to “Sent”.", "section": "Patients & Referrals Section", "out": true, "mod": "REF", "sec": ["NOTIF"], "corr": ["REF-07"], "chg": "Optionally add a notification to the receiving facility/doctor on Send.", "gap": "Sending does not itself notify the recipient; the referral just appears in the receiver's Inbox."}, "AM-061": {"ref": "AM-061", "src": 2, "status": "Not done", "pri": "High", "screen": "Referrals [Patients & Referrals → Referrals]", "text": "The “Respond” action on a referral does not produce any response; the action should work as intended.", "section": "Patients & Referrals Section", "out": true, "mod": "REF", "sec": [], "corr": ["REF-02"], "chg": "Build a Respond dialog (Accepted/Declined + remarks) calling svc.respond with status and remarks; hide for MGR.", "gap": "No UI to accept/decline with remarks, so nothing happens."}, "AM-062": {"ref": "AM-062", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Referrals [Patients & Referrals → Referrals]", "text": "The “Link Appointment” action on a referral does not produce any response; the action should work as intended.", "section": "Patients & Referrals Section", "out": true, "mod": "REF", "sec": [], "corr": ["REF-02"], "chg": "Build a Link Appointment dialog (select patient's appointment) calling svc.linkAppointment.", "gap": "No appointment picker/form."}, "AM-063": {"ref": "AM-063", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Referrals [Patients & Referrals → Referrals]", "text": "The “Escalate” action on a referral returns a permission error; the intended permission and workflow should be clarified and the action should function accordingly.", "section": "Patients & Referrals Section", "out": true, "mod": "REF", "sec": [], "corr": ["REF-04"], "chg": "Remove Escalate from the row menu (escalation is automatic), or decide on manual escalation and open the endpoint to ADM/MGR.", "gap": "Action is shown to people who can never perform it; manual escalation workflow undefined."}, "AM-064": {"ref": "AM-064", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Referrals [Patients & Referrals → Referrals]", "text": "The “Close” action cannot be completed because an “Outcome note” is required; clarify whether this is mandatory and ensure the close workflow is usable.", "section": "Patients & Referrals Section", "out": true, "mod": "REF", "sec": [], "corr": ["REF-03"], "chg": "Add an Outcome note textbox to the Close dialog and send outcomeNote; keep it required.", "gap": "The outcome note is mandatory by design but the UI never asks for it."}, "AM-065": {"ref": "AM-065", "src": 2, "status": "Cannot verify", "pri": "Medium", "screen": "Patient Search [Patients & Referrals → Patient Search]", "text": "The Patients & Referrals / Patient Search menu does not work in the Cashier account.", "section": "Patients & Referrals Section", "out": true, "mod": "REG", "sec": ["SEC"], "corr": ["REG-02"], "chg": "Retest with a Cashier login on the current build; if it still fails, capture the failing request (status code) and check the cashier's facility claim and permission rows.", "gap": "Could be the hosted build being older, or the live role-permission data / facility claim for the cashier account; not visible from the repository."}, "AM-066": {"ref": "AM-066", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Patient Search [Patients & Referrals → Patient Search]", "text": "For Patient Search, the “Change Status” action should be disabled when the patient status is “Deceased”.", "section": "Patients & Referrals Section", "out": true, "mod": "REG", "sec": [], "corr": ["REG-02"], "chg": "Add show: row status !== 'Deceased' (and not Anonymized) to the SetStatus action in PatSearch.vue.", "gap": "Action still appears and opens a dialog for Deceased patients."}, "AM-067": {"ref": "AM-067", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Patient Search [Patients & Referrals → Patient Search]", "text": "For Patient Search / Patient Edit, standardise the fields so Gender, Nationality, Blood Group and Preferred Language use appropriate dropdown/selection controls and agreed values.", "section": "Patients & Referrals Section", "out": true, "mod": "REG", "sec": ["MSTR"], "corr": ["REG-04"], "chg": "Agree value lists (gender, ABO/Rh, ar/en, nationality); switch these to select controls in the edit dialog; add nationality column/field if required; validate server-side.", "gap": "Free text for Gender, Blood group, Preferred language; no Nationality field; no agreed value lists."}, "AM-068": {"ref": "AM-068", "src": 2, "status": "Done", "pri": "-", "screen": "Patient Search [Patients & Referrals → Patient Search]", "text": "Clarify the intended meaning and workflow of “Set Safeguarding” on the patient record.", "section": "Patients & Referrals Section", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "AM-069": {"ref": "AM-069", "src": 2, "status": "Needs decision", "pri": "Low", "screen": "Patient Search [Patients & Referrals → Patient Search]", "text": "Remove the “Merge Duplicate Patients” option if duplicate-patient merging is not permitted by the agreed system rules.", "section": "Patients & Referrals Section", "out": true, "mod": "REG", "sec": [], "corr": ["REG-02"], "chg": "Decide: if not allowed remove the Merge action and PatMerge route/pane; if allowed hide it for non-ADM roles.", "gap": "Policy on whether merging duplicates is allowed has not been given."}, "AM-070": {"ref": "AM-070", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Patient Search [Patients & Referrals → Patient Search]", "text": "In Patient 360 / prescription details, rename “Frequency” to “Dosage” and provide the agreed dosage-entry structure: separate Morning, Afternoon and Night fields, each accepting 0 or 1 where this is the required prescription model.", "section": "Patients & Referrals Section", "out": true, "mod": "EMR", "sec": [], "corr": ["EMR-11"], "chg": "Decide the prescription dosage model; if confirmed, add morning/afternoon/night columns to prescription_line and SetLines, update web, doctor app and patient app displays, rename label to Dosage.", "gap": "No renaming and no 0/1 morning-afternoon-night model; prescription line structure (JSON lines via SP_Prescription_SetLines) has no such fields."}, "AM-071": {"ref": "AM-071", "src": 2, "status": "Needs decision", "pri": "Low", "screen": "Patient Search [Patients & Referrals → Patient Search]", "text": "In Patient 360 / prescription details, review whether “Valid Until” is required and ensure the Actions field provides only the agreed options: View, Edit and Delete.", "section": "Patients & Referrals Section", "out": true, "mod": "EMR", "sec": [], "corr": ["EMR-12"], "chg": "Decide on Valid Until (required/optional/remove) and Delete vs Cancel; adjust dialog and SP accordingly.", "gap": "Whether Valid Until is mandatory and whether Delete (vs cancel) is permitted is undecided."}, "AM-072": {"ref": "AM-072", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Patient Search [Patients & Referrals → Patient Search]", "text": "The prescription “Created” date is blank even when a prescription exists; the actual creation date should be displayed.", "section": "Patients & Referrals Section", "out": true, "mod": "EMR", "sec": [], "corr": ["EMR-01"], "chg": "Set created_at/created_by in the prescription insert (or add DEFAULT now()); backfill existing NULL rows from the id/consultation date.", "gap": "New prescriptions have no creation timestamp (and the generic table shows a dash)."}, "AM-073": {"ref": "AM-073", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Patient Search [Patients & Referrals → Patient Search]", "text": "Prescription downloads are not producing the required content: Excel downloads are blank and PDF downloads contain only an incorrect generic header. Both formats should export the actual prescription data using the Care Gate identity.", "section": "Patients & Referrals Section", "out": true, "mod": "EMR", "sec": ["ADMUX"], "corr": ["EMR-13"], "chg": "Build a prescription document (lines, patient, clinician, Care Gate header) as PDF/Excel via SP_Prescription_Pdf or a client template and wire a Download button in Prescription dialog.", "gap": "No real prescription export; the toolbar is now hidden in Pat360 so nothing replaces it."}, "AM-074": {"ref": "AM-074", "src": 2, "status": "Done", "pri": "-", "screen": "Patient Search [Patients & Referrals → Patient Search]", "text": "Clarify the significance and intended use of the “Diagnosis” field in Patient 360.", "section": "Patients & Referrals Section", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "AM-075": {"ref": "AM-075", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Patient Search [Patients & Referrals → Patient Search]", "text": "The Medical Certificate template should be redesigned to provide a clear, complete and professionally structured output.", "section": "Patients & Referrals Section", "out": true, "mod": "EMR", "sec": [], "corr": ["EMR-14"], "chg": "Design the certificate template (Care Gate header, patient, clinician, dates, diagnosis/leave, signature and verification code) and generate PDF.", "gap": "No structured, professional certificate output."}, "AM-076": {"ref": "AM-076", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Patient Search [Patients & Referrals → Patient Search]", "text": "Ensure popup templates and generated documents use the agreed network/platform name “Care Gate” rather than unrelated placeholder branding.", "section": "Patients & Referrals Section", "out": true, "mod": "L10N", "sec": ["EMR"], "corr": ["L10N-02"], "chg": "Replace header text/logo/address with Care Gate identity (configurable) in MOPDataTable and any new certificate/prescription documents.", "gap": "Placeholder branding in generated exports; no Care Gate identity on documents."}, "AM-077": {"ref": "AM-077", "src": 2, "status": "Cannot verify", "pri": "Medium", "screen": "Patient Search [Patients & Referrals → Patient Search]", "text": "The Date of Birth field is empty for existing patient records; verify the data mapping and ensure the stored value is displayed.", "section": "Patients & Referrals Section", "out": true, "mod": "REG", "sec": [], "corr": ["REG-03"], "chg": "Query the database for patients with NULL date_of_birth; backfill from dob/year_of_birth where available; make DOB required at registration if policy allows.", "gap": "Cannot see live data; some records likely have NULL date_of_birth (hotfix_patient_register_active_dob.sql notes 136 patients with only one date column)."}, "AM-078": {"ref": "AM-078", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Patient Registration [Patients & Referrals → Patient Registration]", "text": "The Gender and Blood Type fields should be selection lists, not free-text input.", "section": "Patients & Referrals Section", "out": true, "mod": "REG", "sec": [], "corr": ["REG-03", "REG-04"], "chg": "Use select lists for gender and blood group; add blood_group to the register SP/DAL or follow with an update call.", "gap": "Free text, and blood group is silently dropped at registration."}, "AM-079": {"ref": "AM-079", "src": 2, "status": "Needs decision", "pri": "Low", "screen": "Patient Registration [Patients & Referrals → Patient Registration]", "text": "The \"Condition\" field contains unclear options. When registering a patient, the disease or infection type should be selected via dropdowns of symptoms, diseases, and vital signs, with a free-text field for explanation if symptoms are not listed.", "section": "Patients & Referrals Section", "out": true, "mod": "REG", "sec": ["EMR"], "corr": ["REG-16"], "chg": "Decide the lists and whether registration or intake should capture them; then add a field group fed by master data with a free-text 'other' box.", "gap": "Request is for disease/symptom/vitals dropdowns plus free text at registration; the agreed lists and whether clinical data belongs at registration are undecided."}, "AM-080": {"ref": "AM-080", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Patient Registration [Patients & Referrals → Patient Registration]", "text": "Is the Cashier allowed to register a patient? The option is visible in the account but does not work; functions the account has no permission for should not be displayed.", "section": "Patients & Referrals Section", "out": true, "mod": "REG", "sec": ["SEC"], "corr": ["REG-02"], "chg": "Decide role rights; then align API role lists and hide Register/Edit/Merge/Set Status/Sensitive buttons per role (use AfdGrid show()/hide add button).", "gap": "UI shows actions the roles cannot perform; whether cashier should register is undecided."}, "AM-081": {"ref": "AM-081", "src": 2, "status": "Not done", "pri": "Low", "screen": "Patient Registration [Patients & Referrals → Patient Registration]", "text": "On Patient Registration, rename “National” to “Nationality” and, where applicable, default the value to “Syrian” and make it non-editable.", "section": "Patients & Referrals Section", "out": true, "mod": "REG", "sec": [], "corr": ["REG-04"], "chg": "Rename label to 'National ID'; if Nationality is wanted add a column/field defaulting to Syrian, locked.", "gap": "Label wrong for what it holds; no nationality field."}, "AM-082": {"ref": "AM-082", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Patient Registration [Patients & Referrals → Patient Registration]", "text": "Clarify the purpose and expected use of the “Is Sensitive” field during patient registration.", "section": "Patients & Referrals Section", "out": true, "mod": "REG", "sec": ["MHPSS"], "corr": ["REG-01", "REG-03"], "chg": "Add is_sensitive to registration SP, filter sensitive patients in search for other roles, or remove the checkbox from registration.", "gap": "Flag meaning is defined but not enforced in the list and not saved at registration."}, "AM-083": {"ref": "AM-083", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Patient Registration [Patients & Referrals → Patient Registration]", "text": "Patient registration should allow entry/selection of the date in DD/MM/YYYY format only; the time should be system/server-generated rather than manually entered.", "section": "Patients & Referrals Section", "out": true, "mod": "REG", "sec": [], "corr": ["REG-03"], "chg": "Remove the Registration date field and its validation; use a DD/MM/YYYY date picker for DOB.", "gap": "Manual, ignored time field; date format not enforced."}, "AM-084": {"ref": "AM-084", "src": 2, "status": "Not done", "pri": "Low", "screen": "Patient Registration [Patients & Referrals → Patient Registration]", "text": "Provide “Preferred Language” as a dropdown limited to the approved options, currently identified as Arabic and English.", "section": "Patients & Referrals Section", "out": true, "mod": "REG", "sec": [], "corr": ["REG-04"], "chg": "Add a select (Arabic, English) to register and edit, validate server-side.", "gap": "No dropdown limited to approved languages."}, "AM-085": {"ref": "AM-085", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Receipts & Dues [Billing & Payments → Invoices → Receipts & Dues]", "text": "The receipts table should be a Responsive Table so that all columns appear clearly as the screen size changes.", "section": "Billing & Payments Section", "out": true, "mod": "BILL", "sec": ["ADMUX"], "corr": ["BILL-09"], "chg": "Add responsive behaviour to AfdGrid (priority columns, collapse/stack on small widths); applies to every list screen, not just receipts.", "gap": "Table is horizontally scrollable, not truly responsive (no column hiding or stacked rows on small screens)."}, "AM-086": {"ref": "AM-086", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Receipts & Dues [Billing & Payments → Invoices → Receipts & Dues]", "text": "The \"Open Full View\" action for a receipt does not work.", "section": "Billing & Payments Section", "out": true, "mod": "BILL", "sec": [], "corr": ["BILL-05"], "chg": "Build a receipt detail page (receipt, bill lines, payments, collected by, void state) and link the row action to it; rename label.", "gap": "No real receipt detail view; the action opens the parent bill summary only, and it fails silently if a row has no opBillId. The label still reads 'Open the 360 view' in en.json, not 'Open Full View'."}, "AM-087": {"ref": "AM-087", "src": 2, "status": "Not done", "pri": "High", "screen": "Receipts & Dues [Billing & Payments → Invoices → Receipts & Dues]", "text": "The \"Add New\" button does not work.", "section": "Billing & Payments Section", "out": true, "mod": "BILL", "sec": [], "corr": ["BILL-01"], "chg": "Wire Add New to a bill picker then /billing/bills/:id/collect (or add a Collect button on Outstanding Bills / Bill 360); implement Void with reason or remove the action.", "gap": "Add New on Receipts does nothing useful; the working issue-receipt form is unreachable from the UI. Void row action is also only a placeholder pane."}, "AM-088": {"ref": "AM-088", "src": 2, "status": "Needs decision", "pri": "Medium", "screen": "Receipts & Dues [Billing & Payments → Invoices → Receipts & Dues]", "text": "What is the \"Add New\" button for? Is the Cashier meant to issue a receipt the traditional way and then enter that receipt's information into the platform?", "section": "Billing & Payments Section", "out": true, "mod": "BILL", "sec": [], "corr": ["BILL-02"], "chg": "Decide paper vs electronic receipt policy; if paper stays, add manual receipt number field and print template.", "gap": "Client must confirm whether paper receipts will still be used in parallel (then a 'manual receipt no.' field is needed) or the platform receipt is the only one."}, "AM-089": {"ref": "AM-089", "src": 2, "status": "Done", "pri": "-", "screen": "Receipts & Dues [Billing & Payments → Invoices → Receipts & Dues]", "text": "What is meant by \"Status\" in the box next to the search box?", "section": "Billing & Payments Section", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "AM-090": {"ref": "AM-090", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Receipts & Dues [Billing & Payments → Invoices → Receipts & Dues]", "text": "For Outstanding Bills / Dues, provide access to the billing details in a format comparable to the detail view available for Receipts.", "section": "Billing & Payments Section", "out": true, "mod": "BILL", "sec": [], "corr": ["BILL-06"], "chg": "Add Lines / Payments / Receipts / Refunds tabs to Bill360 using existing bill, receipt and payment endpoints; hide the irrelevant clinical tabs.", "gap": "No itemised billing detail (services, discounts, payments received, balance) comparable to a receipt view."}, "AM-091": {"ref": "AM-091", "src": 2, "status": "Done", "pri": "Medium", "screen": "Refunds [Billing & Payments → Refunds]", "text": "Status \"Approved\": who approves the refund, and in which interface does the approval take place?", "section": "Billing & Payments Section", "out": true, "mod": "BILL", "sec": [], "corr": ["BILL-04"], "chg": "Hide Decide for CASH; make list Decide open the journey decision form; align status labels.", "gap": "Statuses displayed come from the DB as stored (e.g. Approved) while the journey stages are named Decided; wording not harmonised. The list-row Decide sends only the id (no approved flag) so it may fail; the Journey page is the reliable route."}, "AM-092": {"ref": "AM-092", "src": 2, "status": "Done", "pri": "Low", "screen": "Refunds [Billing & Payments → Refunds]", "text": "Status \"Requested\": who requests the refund? Is it a value populated automatically from entries on another page (the field is not interactive), or is there expected to be a button allowing the Cashier to confirm the status (Approved / Requested)?", "section": "Billing & Payments Section", "out": true, "mod": "BILL", "sec": [], "corr": ["BILL-04"], "chg": "Hide Decide row action for CASH; optionally add a visible stage hint.", "gap": "The status is not clickable in the list; the cashier has no 'confirm status' button, by design. Cashier sees the Decide action although the API refuses it."}, "AM-093": {"ref": "AM-093", "src": 2, "status": "Not done", "pri": "High", "screen": "Payment [Billing & Payments → Payment]", "text": "The options on the Payment page do not work.", "section": "Billing & Payments Section", "out": true, "mod": "BILL", "sec": [], "corr": ["BILL-03"], "chg": "Remove or hide stub actions (Initiate/Callback/Add New) for staff; implement Reverse with reason and role check; surface collect-payment from Outstanding Bills.", "gap": "Most options on the Payments list are stubs; online payment (eCash) integration not wired in UI."}, "AM-094": {"ref": "AM-094", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Shift Close [Billing & Payments → Shift Close]", "text": "How does the Shift Close function work, and who determines it? (Same Queries as raised for the Refunds statuses.)", "section": "Billing & Payments Section", "out": true, "mod": "BILL", "sec": [], "corr": ["BILL-07"], "chg": "Add help text (Cashier declares, Manager/Admin verifies); hide Close Shift reconcile for CASH; make the workspace tab link to Day-end.", "gap": "Workflow is not explained on screen and the Close Shift page is the supervisor step but is shown to the Cashier menu; cashier cannot complete it."}, "AM-095": {"ref": "AM-095", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Setup & Config [Billing & Payments → Setup & Config]", "text": "A box named \"Actions\" appears every time the interface is opened; it can be closed but reappears when the interface is opened again, and it produces no result when clicked.", "section": "Billing & Payments Section", "out": true, "mod": "BILL", "sec": [], "corr": ["BILL-07"], "chg": "Rename to 'Billing setup', drop the misleading hint, or fold Day-end report into a normal tab and remove the Setup section.", "gap": "The panel is still headed 'Actions' with a single link and an unrelated hint ('Changes apply immediately...'); main pane is empty; it reappears by design each time."}, "AM-135": {"ref": "AM-135", "src": 2, "status": "Done", "pri": "-", "screen": "Policies & Consent Text [Administration → Policies & Consent Text]", "text": "What is the purpose of the Policies & Consent Text page and what is its function? Is it meant for displaying the terms of use and privacy policy and storing user consent?", "section": "Administration Section", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-06"], "chg": "None required; optionally hide Edit/Publish for MGR.", "gap": "Manager sees the page but cannot publish or edit (API ADM only). Consent is stored as a version on the account, not as a timestamped log per policy."}, "AM-136": {"ref": "AM-136", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Policies & Consent Text [Administration → Policies & Consent Text]", "text": "Clarify the relevance of all privileges displayed in the Roles & Permissions Access Matrix and document what each privilege permits.", "section": "Administration Section", "out": true, "mod": "SEC", "sec": [], "corr": ["SEC-10"], "chg": "Add a description per permission (en/ar), show it as tooltip in the matrix, and produce a permission reference document for the client.", "gap": "No explanation of what each privilege permits."}, "AM-137": {"ref": "AM-137", "src": 2, "status": "Done", "pri": "-", "screen": "Active Sessions [Administration → Active Sessions]", "text": "Restrict access to the Active Sessions page to the main Admin only.", "section": "Administration Section", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": "If a hosted Manager still sees it, the hosted build is older."}, "AM-138": {"ref": "AM-138", "src": 2, "status": "Not done", "pri": "Medium", "screen": "User Accessibility Settings [Administration → User settings (font and language)]", "text": "When changing a user's font and language settings, the values are not shown correctly in the table: the language value remains \"en\" even after selecting Arabic, and the font does not change to the selected one.", "section": "Administration Section", "out": true, "mod": "AUTH", "sec": [], "corr": ["AUTH-02"], "chg": "Add a Language selector bound to languageCode (and show fallback as its own column); verify the upsert SP persists both; confirm what 'font' should mean (size vs typeface).", "gap": "Displayed column and the editable field are different fields; no language or font-family choice is actually saved."}, "AM-139": {"ref": "AM-139", "src": 2, "status": "Not done", "pri": "High", "screen": "User Accessibility Settings [Administration → User settings (font and language)]", "text": "Adding a new User currently fails with “The Status Field is required”; the Add User workflow should correctly validate and save the record.", "section": "Administration Section", "out": true, "mod": "AUTH", "sec": [], "corr": ["AUTH-01"], "chg": "Remove the Status check from the create validator (status is set by the SP/state machine) or send status 'Active' from the form; fix at generator level (create-ignores-status rule).", "gap": "Create always fails validation (HTTP 400, Status is required)."}, "AM-140": {"ref": "AM-140", "src": 2, "status": "Not done", "pri": "Low", "screen": "User Accessibility Settings [Administration → User settings (font and language)]", "text": "For an Active User, rename “Set Password” to “Reset Password” if the function is intended to reset an existing user's password.", "section": "Administration Section", "out": true, "mod": "AUTH", "sec": [], "corr": ["AUTH-12"], "chg": "Rename action label to 'Reset password' (en/ar/ku keys and fallback).", "gap": "Label still says Set password."}, "AM-141": {"ref": "AM-141", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Audit [Security & Audit → Audit]", "text": "The Audit page mixes information, combining platform administrators' operations with patient records. The information should be separated: a System Log for admin interface events, with patient data archived separately.", "section": "Security & Audit Section", "out": true, "mod": "SEC", "sec": [], "corr": ["SEC-08"], "chg": "Add a category (System/Admin vs Clinical) filter or two tabs on audit_log by entity_name; decide archive policy for patient data.", "gap": "No separate System/Admin log vs clinical-activity log within the trail; no category filter."}, "AM-142": {"ref": "AM-142", "src": 2, "status": "Done", "pri": "-", "screen": "Audit [Security & Audit → Audit]", "text": "Clarify where Security Alerts are listed and how administrators are expected to access and review them.", "section": "Security & Audit Section", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "AM-143": {"ref": "AM-143", "src": 2, "status": "Needs decision", "pri": "Low", "screen": "Audit [Security & Audit → Audit]", "text": "Review whether the “review each and mark it Acknowledged, Resolved, or Dismissed” action set is required on the Security Alerts interface; remove it if it is outside the agreed workflow.", "section": "Security & Audit Section", "out": true, "mod": "SEC", "sec": [], "corr": ["SEC-09"], "chg": "If out of scope: remove the Acknowledge/Resolve/Dismiss actions and subtitle text (keep Unlock if wanted). If kept: no change.", "gap": "Client must say whether this alert workflow is in scope or alerts should be read-only."}, "AM-144": {"ref": "AM-144", "src": 2, "status": "Not done", "pri": "Low", "screen": "Audit [Security & Audit → Audit]", "text": "On Security Alerts, rename “Open the 360 View” to “View Details”; where displayed, rename “What Happened” to “Reason” and “Unlocks at” to “Unlocked at”.", "section": "Security & Audit Section", "out": true, "mod": "SEC", "sec": ["L10N"], "corr": ["SEC-09"], "chg": "Change en.json Open360 to 'View details'; set DETAIL_LABELS reason to 'Reason' and locked_until to 'Unlocked at' (or 'Locked until' if that is the real meaning); add ar/ku.", "gap": "None of the three renames applied."}, "AM-145": {"ref": "AM-145", "src": 2, "status": "Done", "pri": "Low", "screen": "Audit [Security & Audit → Audit]", "text": "On Audit, clarify the relevance and intended use of the “Outcome” field.", "section": "Security & Audit Section", "out": true, "mod": "SEC", "sec": [], "corr": ["SEC-07"], "chg": "Standardise outcome values (Success / Failure / Denied) and add a legend.", "gap": "Values are not standardised (mixed case, no master list), so the column is inconsistent."}, "AM-146": {"ref": "AM-146", "src": 2, "status": "Needs decision", "pri": "Low", "screen": "Audit [Security & Audit → Audit]", "text": "On Audit, clarify where the master list of permitted Action values (for example Add / Modify / Delete) is maintained.", "section": "Security & Audit Section", "out": true, "mod": "SEC", "sec": [], "corr": ["SEC-07"], "chg": "Decide whether to keep business-operation names or map to Add/Modify/Delete categories; if so add an operation catalogue table/map in the DB and use it in the filter.", "gap": "Client expects Add/Modify/Delete style actions; the system logs business operations. A governed list would need to be defined."}, "AM-147": {"ref": "AM-147", "src": 2, "status": "Not done", "pri": "Low", "screen": "Audit [Security & Audit → Audit]", "text": "On Audit, rename “Actor User” to “Actor” and “Actor Role Code” to “Role” for clearer presentation.", "section": "Security & Audit Section", "out": true, "mod": "SEC", "sec": ["L10N"], "corr": ["SEC-08"], "chg": "Edit en.json (and ar/ku): actorUserName to 'Actor', actorRoleCode to 'Role'.", "gap": "Headers not renamed."}, "AM-148": {"ref": "AM-148", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Audit [Security & Audit → Audit]", "text": "The “Verify Chain” action on Audit returns a permission error; the intended permission and workflow should be clarified and the action corrected.", "section": "Security & Audit Section", "out": true, "mod": "SEC", "sec": [], "corr": ["SEC-08"], "chg": "Deploy AfdGovernance and 021 SQL; remove the per-row Verify Chain action and use the Integrity tab, which displays intact/broken.", "gap": "Hosted 403 likely an older API build; row action is misleading (id ignored, result not shown)."}, "AM-149": {"ref": "AM-149", "src": 2, "status": "Done", "pri": "Low", "screen": "Audit [Security & Audit → Audit]", "text": "Clarify the significance and intended use of the “App Code” field on the Audit interface.", "section": "Security & Audit Section", "out": true, "mod": "SEC", "sec": [], "corr": ["SEC-07"], "chg": "Populate app_code from the session/JWT in all audit writes, or hide the field.", "gap": "Field is mostly empty today, so it carries little information."}, "AM-150": {"ref": "AM-150", "src": 2, "status": "Needs decision", "pri": "Low", "screen": "SMS Fallback Log [System → SMS Fallback Log]", "text": "Please clarify the purpose of the SMS Fallback Log page, and what is meant by \"Extracted Keyword\".", "section": "System Section", "out": true, "mod": "NOTIF", "sec": [], "corr": ["NOTIF-05"], "chg": "Decide if SMS fallback is in scope; if yes build inbound webhook + keyword parser (BOOK, CANCEL, STATUS) + reply; if not hide the page.", "gap": "Page and Extracted Keyword (parsed_keyword) are empty scaffolding; no inbound SMS gateway or parser."}, "AM-096": {"ref": "AM-096", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Diagnostic Devices [Master Data → Diagnostic Devices]", "text": "The use of diagnostic devices is currently not permitted in Syria, so this function must be deactivated until the Ministry of Health issues the relevant approvals.", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-14"], "chg": "Set ble_devices to false in the feature-flag seed/live config for Syria (and in doctor/patient apps) until Ministry approval; no code change needed to switch it back on later.", "gap": "Flag ships ON by default so the screen is still visible until an admin switches it off; no regulatory default."}, "AM-097": {"ref": "AM-097", "src": 2, "status": "Done", "pri": "Low", "screen": "Clinical Templates [Master Data → Clinical Templates]", "text": "What is meant by clinical templates? And what does the \"Name\" field in them refer to – the name of what?", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-15"], "chg": "Optionally add a one-line help text under the title and Name field.", "gap": "Screen has no on-screen help text explaining the purpose; Name is the template's own title."}, "AM-098": {"ref": "AM-098", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Clinical Templates [Master Data → Clinical Templates]", "text": "The same filter notes raised on other pages apply to this page. See notes 1 to 5.", "section": "Master Data Section", "out": true, "mod": "ADMUX", "sec": ["MSTR"], "corr": ["ADMUX-02"], "chg": "Add per-column or status/type/speciality dropdown filters to AfdGrid and pass them from this list.", "gap": "Notes 1-5 (column filters) are only met by one free-text search; no per-column or status/type dropdown filters."}, "AM-099": {"ref": "AM-099", "src": 2, "status": "Done", "pri": "Low", "screen": "Clinical Templates [Master Data → Clinical Templates]", "text": "What is the purpose of the \"Default\" button on this page?", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-15"], "chg": "Optionally enforce one default per speciality/type and auto-select it in the Case Sheet.", "gap": "Default is a marker only; no rule found that auto-applies it or keeps one default per speciality."}, "AM-100": {"ref": "AM-100", "src": 2, "status": "Done", "pri": "Low", "screen": "Clinical Templates [Master Data → Clinical Templates]", "text": "What is the difference between the Type and Specialty fields, given that they contain similar values such as Paediatric?", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-15"], "chg": "Make Type a fixed list (e.g. General, Follow-up, Procedure) or drop it.", "gap": "Because Type is free text, users type values like Paediatric that duplicate the speciality; it is not a controlled list."}, "AM-101": {"ref": "AM-101", "src": 2, "status": "Cannot verify", "pri": "Medium", "screen": "Clinicians [Master Data → Clinicians]", "text": "The list does not work.", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-06"], "chg": "Reproduce on the hosted site; fix Open360 route to /clinicians/:id/360.", "gap": "Cannot see the failure; may be empty list for an admin whose token facility has no clinicians, or an older hosted build. Note the row action 'Open 360' routes to /clinician/:id, but the route is /clinicians/:id/360 (page not found)."}, "AM-102": {"ref": "AM-102", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Clinicians [Master Data → Clinicians]", "text": "Include “Speciality” when adding a new Clinician and display the Speciality field in the Clinician list.", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-06"], "chg": "Add speciality multi-select to the create form and a Speciality column (join clinician_speciality in v_clinician or list SP).", "gap": "Speciality cannot be chosen at creation and is not displayed in the list."}, "AM-103": {"ref": "AM-103", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Clinicians [Master Data → Clinicians]", "text": "Clearly identify which Clinician fields are mandatory and enforce the required-field validation consistently.", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-06"], "chg": "Align required fields between form and dialog, mark them all, and confirm server-side rules in ClinicianRules.", "gap": "Not verified consistent across the standalone form and the dialog; gender/qualification/experience/languages not marked either way."}, "AM-104": {"ref": "AM-104", "src": 2, "status": "Done", "pri": "Low", "screen": "Clinicians [Master Data → Clinicians]", "text": "Clarify the purpose and significance of the Clinician “Code” field.", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-06"], "chg": "Optionally add a help tooltip.", "gap": "No tooltip on screen explaining it."}, "AM-105": {"ref": "AM-105", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Facilities [Master Data → Facilities]", "text": "In the Actions column, the \"Open Full View\" option does not work.", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-01"], "chg": "Change push target to /facilities/:id/360 and rename label to 'View details'.", "gap": "Broken link to the existing MstrFacility360.vue."}, "AM-106": {"ref": "AM-106", "src": 2, "status": "Partly done", "pri": "High", "screen": "Facilities [Master Data → Facilities]", "text": "We were unable to add a new facility.", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-02"], "chg": "Commit the 11-parameter sp_facility_create (status default, auto code) to Procedures.Custom and redeploy; retest Add Facility.", "gap": "Repo SQL does not match the code (42883 risk on a fresh DB); code field must be typed manually and is required. Cause of the hosted failure cannot be proven."}, "AM-107": {"ref": "AM-107", "src": 2, "status": "Not done", "pri": "Low", "screen": "Facilities [Master Data → Facilities]", "text": "For Facilities, the Facility Code should be system-generated rather than manually entered.", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-02"], "chg": "Generate F-NNN server-side in sp_facility_create when blank; make field read-only/optional in the dialog.", "gap": "Facility code is typed manually."}, "AM-108": {"ref": "AM-108", "src": 2, "status": "Needs decision", "pri": "Low", "screen": "Facilities [Master Data → Facilities]", "text": "Consider removing the “Time Zone” field from the Add Facility screen if it is not required for the agreed operating model.", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-16"], "chg": "Decision: remove the field (recommended) or persist it. If removed, delete fld('timezone') from the dialog and form.", "gap": "Field is shown but ignored; single-country deployment (Syria) needs one timezone."}, "AM-109": {"ref": "AM-109", "src": 2, "status": "Done", "pri": "Low", "screen": "Facilities [Master Data → Facilities]", "text": "The “Name (Arabic)” field should support entry of Arabic characters, or the expected method of entering Arabic values should be clearly defined.", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": ["L10N"], "corr": ["MSTR-02"], "chg": "Optionally add placeholder/hint text 'Type in Arabic'.", "gap": "No hint telling users to type Arabic; cannot test the tester's keyboard/browser."}, "AM-110": {"ref": "AM-110", "src": 2, "status": "Partly done", "pri": "High", "screen": "Facilities [Master Data → Facilities]", "text": "Adding a new Facility is currently unsuccessful and may produce multiple errors; the Add Facility workflow should be corrected so that a valid facility can be saved.", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-02"], "chg": "Same as AM-106; also show the server validation message in the dialog.", "gap": "Root cause of 'multiple errors' not visible in code; source/DB mismatch is the likely candidate."}, "AM-111": {"ref": "AM-111", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Facilities [Master Data → Facilities]", "text": "Clarify the workflow and authorised action for changing a Facility status from “Pending” to “Active”.", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-03"], "chg": "Add a status dialog with allowed next states and mandatory reason; allow ADM on the endpoint; show 'needs verified licence' message.", "gap": "No usable Activate flow for ADM; the rule (licence + reason) is not explained in the UI."}, "AM-112": {"ref": "AM-112", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Facilities [Master Data → Facilities]", "text": "The “Open the 360 View” action on Facilities does not work and displays “The Page does not exist”; it should be corrected and, if intended as a detail view, renamed to “View Details”.", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-01"], "chg": "Fix route to /facilities/:id/360 and rename action to 'View details'.", "gap": "Wrong path gives 'page does not exist'; label not renamed."}, "AM-113": {"ref": "AM-113", "src": 2, "status": "Not done", "pri": "Low", "screen": "Governorates [Master Data → Governorates]", "text": "The filter icon is placed far from the column it belongs to.", "section": "Master Data Section", "out": true, "mod": "ADMUX", "sec": ["MSTR"], "corr": ["ADMUX-02"], "chg": "If column filters are added to AfdGrid, place the icon in each column header.", "gap": "Hosted build may show an older filter row; repository has no per-column filter control to reposition."}, "AM-114": {"ref": "AM-114", "src": 2, "status": "Not done", "pri": "Low", "screen": "Governorates [Master Data → Governorates]", "text": "The \"Status\" column filter should be limited to two options: \"Active\" and \"Inactive\", rather than matching the other filters.", "section": "Master Data Section", "out": true, "mod": "ADMUX", "sec": ["MSTR"], "corr": ["ADMUX-02"], "chg": "Add a status dropdown (Active/Inactive) filter type to AfdGrid and use it here.", "gap": "No Active/Inactive status filter."}, "AM-115": {"ref": "AM-115", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Governorates [Master Data → Governorates]", "text": "The \"Name\" filter should be a dropdown list from which the governorate is selected. And it should be renamed to \"Governorate Name\" or \"Governorate\".", "section": "Master Data Section", "out": true, "mod": "ADMUX", "sec": ["MSTR"], "corr": ["ADMUX-02"], "chg": "Rename header to 'Governorate' and add a dropdown filter of governorate names.", "gap": "No governorate dropdown filter; header not renamed to 'Governorate'."}, "AM-116": {"ref": "AM-116", "src": 2, "status": "Needs decision", "pri": "Medium", "screen": "Governorates [Master Data → Governorates]", "text": "There is an approved coding for the governorates, which we will send by email for adoption on this page.", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-09"], "chg": "Receive the official list/codes; load them as a seed/migration; make code read-only on the screen.", "gap": "Client has not yet sent the approved governorate coding."}, "AM-117": {"ref": "AM-117", "src": 2, "status": "Not done", "pri": "Low", "screen": "Governorates [Master Data → Governorates]", "text": "There is no need for an \"Add Governorate\" option in this interface, as all governorates are already listed.", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-09"], "chg": "Remove Add New (and code field) from Governorates once the official list is loaded; keep Edit for names/status only.", "gap": "Add button still present."}, "AM-118": {"ref": "AM-118", "src": 2, "status": "Done", "pri": "Low", "screen": "Governorates [Master Data → Governorates]", "text": "What edit action might the Cashier perform on the Governorates interface?", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": ["SEC"], "corr": ["MSTR-09"], "chg": "Hide the Edit/Add actions for non-ADM roles (or make the page read-only for Cashier/Manager).", "gap": "UI shows an Edit action that a Cashier cannot execute (403)."}, "AM-119": {"ref": "AM-119", "src": 2, "status": "Done", "pri": "-", "screen": "Governorates [Master Data → Governorates]", "text": "On Governorates, clarify the intended actions available in the “Action” field; currently only “Edit” is displayed.", "section": "Master Data Section", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": "None, other than possible future activate/deactivate."}, "AM-120": {"ref": "AM-120", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Governorates [Master Data → Governorates]", "text": "The “Name (Arabic)” field on Add Governorate requires support for Arabic characters or a clearly defined Arabic-entry method; the current field appears to accept only English characters.", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": ["L10N"], "corr": ["MSTR-09"], "chg": "Set dir=rtl and required marker on Arabic fields; optionally validate Arabic script; retest on hosted build.", "gap": "Cannot confirm the hosted build restriction; no RTL direction or required marker or validation of Arabic script."}, "AM-121": {"ref": "AM-121", "src": 2, "status": "Cannot verify", "pri": "Medium", "screen": "Governorates [Master Data → Governorates]", "text": "Adding a new Governorate is unsuccessful: after selecting “Confirm”, the record is not saved.", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-09"], "chg": "Check live SP version and the admin's role/error response; make SP honour p_id on edit.", "gap": "Cause not visible in code; likely hosted build/DB drift. Edit with changed code creates a new row (id ignored by SP)."}, "AM-122": {"ref": "AM-122", "src": 2, "status": "Not done", "pri": "Low", "screen": "Governorates [Master Data → Governorates]", "text": "Provide a facility to associate/add hospitals under each Governorate, if this relationship is required by the platform design.", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-09"], "chg": "Add a Facilities count/link on the governorate row filtering the Facilities list by governorate (SP_Facility_List already supports p_governorate_id).", "gap": "No view of facilities per governorate."}, "AM-123": {"ref": "AM-123", "src": 2, "status": "Done", "pri": "Low", "screen": "ICD Catalogue [Master Data → ICD Catalogue]", "text": "The information shown on this page is unclear; we need an explanation of its content and how it is used.", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-12"], "chg": "Optionally add a subtitle/help line explaining the catalogue.", "gap": "Screen has no on-page help text."}, "AM-124": {"ref": "AM-124", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "ICD Catalogue [Master Data → ICD Catalogue]", "text": "The classification adopted in Syria is ICD-11, and it can be adopted on this page.", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-12"], "chg": "Confirm ICD-11 adoption; relax/switch the validator by version, default version to ICD-11, load ICD-11 list, check clinical/EMR code pickers.", "gap": "Add/edit rejects ICD-11 code shapes; defaults and wording are ICD-10; no ICD-11 content."}, "AM-125": {"ref": "AM-125", "src": 2, "status": "Needs decision", "pri": "Medium", "screen": "Licence Register [Master Data → Licence Register]", "text": "The licence register relates only to doctors, so there is no need for it to be a separate page; it can be merged with the registered doctors' information (Clinicians).", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-05"], "chg": "Decide: keep one source of licence truth; then hide the page and surface licence on Clinician 360, migrating data.", "gap": "Two overlapping licence stores; merge is a product decision (and facility licences exist)."}, "AM-126": {"ref": "AM-126", "src": 2, "status": "Needs decision", "pri": "Medium", "screen": "Licence Register [Master Data → Licence Register]", "text": "Does a doctor have a licence limited to a specific year, or is it enough to verify that the licence is valid and has not been revoked for any reason? A time-limited licence may apply to the licensed facility rather than the doctor.", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-05"], "chg": "Decide expiry rule per holder type; make expiry optional for doctors if licences are open-ended.", "gap": "Whether expiry applies to doctors, facilities or both is a policy question."}, "AM-127": {"ref": "AM-127", "src": 2, "status": "Done", "pri": "-", "screen": "Licence Register [Master Data → Licence Register]", "text": "Clarify the purpose and expected behaviour of the Licence Register “Expire Sweep” action.", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-04"], "chg": "See AM-128.", "gap": "Not run automatically from this screen as it works today (see AM-128)."}, "AM-128": {"ref": "AM-128", "src": 2, "status": "Not done", "pri": "High", "screen": "Licence Register [Master Data → Licence Register]", "text": "The “Expire Sweep” action returns “Could Not Save. Nothing has changed”; correct the action and ensure appropriate validations are applied when adding a licence. Provide View and Edit actions where required.", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-04"], "chg": "Allow ADM on expire-sweep (or schedule it) and return counts; add View/Edit; validate expires_on > issued_on; show real error text.", "gap": "Sweep unusable by admin; no View/Edit; limited create validation (no date-order check)."}, "AM-129": {"ref": "AM-129", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Medicine Master [Master Data → Medicine Master]", "text": "The medicine list is subject to continuous changes, so the page should allow updating it as a bulk file.", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-10"], "chg": "Add CSV/XLSX import for medicines (upsert by code) with validation report, as done for ICD.", "gap": "No medicine bulk file load."}, "AM-130": {"ref": "AM-130", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Medicine Master [Master Data → Medicine Master]", "text": "Medicine Master Actions should include the agreed options, including View, Delete and Suspend, subject to the approved permission model.", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-10"], "chg": "Add status change (Suspend/Activate), View, and delete/deactivate per agreed permission model; add SP and endpoints.", "gap": "Agreed action set absent; no suspend path."}, "AM-131": {"ref": "AM-131", "src": 2, "status": "Done", "pri": "Medium", "screen": "Medicine Master [Master Data → Medicine Master]", "text": "Clarify the purpose and business significance of the “Is Controlled” field in Medicine Master.", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": ["EMR"], "corr": ["MSTR-10"], "chg": "Add the checkbox to the form (editing also nulls it today); decide any prescribing rule for controlled drugs.", "gap": "Flag is not editable in UI and not enforced in prescribing."}, "AM-132": {"ref": "AM-132", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Services & Tariffs [Master Data → Services & Tariffs]", "text": "The Services & Tariffs menu does not work.", "section": "Master Data Section", "out": true, "mod": "BILL", "sec": ["MSTR"], "corr": ["BILL-08"], "chg": "Add or remove the three routes/actions; hide edit/tariff actions for CASH/MGR; verify the hosted Cashier menu.", "gap": "Dead action links for all roles; Cashier sees edit actions it cannot use; hosted failure not reproducible from code."}, "AM-133": {"ref": "AM-133", "src": 2, "status": "Done", "pri": "Low", "screen": "Services & Tariffs [Master Data → Services & Tariffs]", "text": "Please clarify the purpose of the Services & Tariffs page.", "section": "Master Data Section", "out": true, "mod": "BILL", "sec": ["MSTR"], "corr": ["BILL-08"], "chg": "Optionally add a help subtitle.", "gap": "Not explained on the page itself."}, "AM-134": {"ref": "AM-134", "src": 2, "status": "Done", "pri": "Low", "screen": "Specialities [Master Data → Specialities]", "text": "Why is there a separate column for Mental Health and Psychosocial Support (MHPSS) when it is already one of the specialities?", "section": "Master Data Section", "out": true, "mod": "MSTR", "sec": ["MHPSS"], "corr": ["MSTR-11"], "chg": "Add the MHPSS checkbox to the Edit dialog (edit currently may reset it) and add column help text.", "gap": "Flag is not editable in the Edit dialog (form has code/names only) and is not explained."}, "MF-01": {"ref": "MF-01", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Beneficiary Full Name / اسم المستفيدة الثلاثي", "text": "Data type: Text. Mandatory: Yes. Notes: First name, father's name, and surname", "section": "Mandatory data fields (Al-Yamama)", "out": true, "mod": "REG", "sec": [], "corr": ["REG-06"], "chg": "Make the full name mandato
