true, "mod": "REG", "sec": [], "corr": ["REG-10"], "chg": "Define approved alternatives (facility vouch, community letter, etc.) and record verification level per patient with audit.", "gap": "Alternative verification is a free choice, not an approved, audited, risk-tiered process; for adults no ID-assurance level is recorded or reviewed."}, "PA-CR-07": {"ref": "PA-CR-07", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Adult Registration", "text": "Confirm the complete registration journey for an adult woman: identity/contact data, one-time verification code, privacy notice in Arabic, telehealth consent, safe communication preferences, provider preference, account activation, and audit log.", "section": "Patient App", "out": true, "mod": "REG", "sec": [], "corr": ["REG-07"], "chg": "Define the exact order, add privacy notice and optional provider preference to onboarding, confirm audit events are written for each step.", "gap": "Journey is split across screens, not one confirmed sequence; no provider preference step; privacy-notice text/language and OTP at registration vs login need confirmation."}, "PA-CR-08": {"ref": "PA-CR-08", "src": 1, "status": "Partly done", "pri": "High", "screen": "Minor — Safe Guardian", "text": "Confirm registration of a 16-year-old girl/boy with a safe and verified guardian, including automatic switching to the minor journey, guardian verification, guardian consent, adolescent assent, contact preference, and appointment booking.", "section": "Patient App", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-04"], "chg": "Add guardian verification step (OTP to guardian phone or staff verification) and minor contact preference; test the full 16-year-old path.", "gap": "Guardian is recorded with an ID method but not verified by a code or staff check; contact preference for minor not separately captured; end-to-end test not evidenced."}, "PA-CR-09": {"ref": "PA-CR-09", "src": 1, "status": "Partly done", "pri": "High", "screen": "Minor — Psychosocial Support", "text": "Confirm how the application handles a psychosocial support request submitted by a 14-year-old child, including the sensitive minor journey, MHPSS-specific consent/assent, privacy-preserving notification, restricted access, risk assessment, and referral.", "section": "Patient App", "out": true, "mod": "MHPSS", "sec": ["MIN"], "corr": ["MHPSS-09"], "chg": "Add minor detection to MHPSS entry, MHPSS assent/consent step, and rules on guardian notification and visibility.", "gap": "No MHPSS-specific consent/assent for minors; no minor-aware routing or restricted access beyond case-file scoping; notifying the guardian is not explicitly prevented in the standard path."}, "PA-CR-10": {"ref": "PA-CR-10", "src": 1, "status": "Partly done", "pri": "High", "screen": "Minor — Unsafe Guardian", "text": "Confirm how the application handles a 15-year-old adolescent where the registered guardian may be unsafe, including suppression of guardian contact, the safe communication pathway, safeguarding review, restricted visibility, authorized referral/escalation, and audit log.", "section": "Patient App", "out": true, "mod": "MHPSS", "sec": ["MIN"], "corr": ["MHPSS-05"], "chg": "Verify scripts are applied; add an admin/safeguarding UI to set and review overrides; confirm audit entries.", "gap": "Needs trigger path (who sets override, from which screen), a patient-facing safe pathway, and audit evidence verified; deployment to live DB unconfirmed."}, "PA-CR-11": {"ref": "PA-CR-11", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Minor Reaching 18", "text": "Confirm the automatic transition from “minor” to “adult” status on reaching 18 without deleting historical guardian records/consents, and with new adult consent and permissions obtained where applicable.", "section": "Patient App", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-11"], "chg": "Schedule the sweep daily; on promotion, flag the patient to re-accept consent and review contact/permissions.", "gap": "Transition runs only when someone calls the endpoint; adult re-consent not triggered; old consents are not touched (history kept)."}, "PA-CR-12": {"ref": "PA-CR-12", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Offline / Synchronization", "text": "Confirm approved offline use, reconnection, synchronization, data conflict handling, duplicate prevention, and audit logging.", "section": "Patient App", "out": true, "mod": "PLAT", "sec": [], "corr": ["PLAT-01"], "chg": "Define offline-capable actions and conflict rule; test on devices; confirm audit for sync events.", "gap": "Approved offline scope and conflict policy not defined; real-device behaviour not verifiable from code."}, "PA-CR-13": {"ref": "PA-CR-13", "src": 1, "status": "Cannot verify", "pri": "Medium", "screen": "Arabic Right-to-Left — Patient", "text": "Confirm the complete patient journey in Arabic and in right-to-left direction: registration, login, doctor search, booking, consultation, profile, prescription, referral, psychosocial support, error messages, and notifications.", "section": "Patient App", "out": true, "mod": "L10N", "sec": [], "corr": ["L10N-08"], "chg": "Run an Arabic RTL walkthrough of all listed journeys and externalise remaining English strings and server error messages.", "gap": "Hard-coded English strings remain in several patient screens; no full RTL walkthrough evidence."}, "PA-CR-14": {"ref": "PA-CR-14", "src": 1, "status": "Cannot verify", "pri": "High", "screen": "SMS / Verification Code", "text": "Confirm one-time verification code, appointment reminder, cancellation, and password reset messages end-to-end through every SMS provider configured in Syria.", "section": "Patient App", "out": true, "mod": "NOTIF", "sec": [], "corr": ["NOTIF-04"], "chg": "Obtain provider specs and credentials, configure HttpSms, test OTP, reminder, cancellation and reset messages on real numbers.", "gap": "Live delivery through Syrian providers unproven; the provider choice is undecided."}, "PA-CR-15": {"ref": "PA-CR-15", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Patient Payment", "text": "Confirm the patient payment journey: collection of the amount, subsidy/insurance if any, payment success/failure, receipt, refund/reversal, and final account status.", "section": "Patient App", "out": true, "mod": "BILL", "sec": ["NOTIF"], "corr": ["BILL-10"], "chg": "Choose gateway (eCash), implement integration and failure/reversal handling; add subsidy model if required.", "gap": "No real payment gateway connected; subsidy/insurance not modelled; failure/reversal flows exist in data model but end-to-end untested."}, "PA-CR-16": {"ref": "PA-CR-16", "src": 1, "status": "Partly done", "pri": "Low", "screen": "Feedback / Grievances", "text": "Confirm that separate journeys exist for technical support, ordinary feedback/complaints, and safeguarding concerns, and confirm that sensitive information is not visible to unauthorized support users.", "section": "Patient App", "out": true, "mod": "QUAL", "sec": ["MHPSS"], "corr": ["QUAL-03"], "chg": "Add a technical-support category or contact route; confirm 022 is deployed.", "gap": "No separate technical-support route (only the complaint form); SQL not confirmed applied live."}, "PA-CR-17": {"ref": "PA-CR-17", "src": 1, "status": "Needs decision", "pri": "High", "screen": "Safe Access for Women and Girls", "text": "The note raised in the presentation proposed allowing women and girls to use the service without identity or verification-code barriers. The approved safe-access approach needs to be clarified. A national ID should not be an absolute barrier, and an approved alternative should be available where obtaining an official ID, a personal phone,", "section": "Patient App", "out": true, "mod": "MHPSS", "sec": ["REG", "AUTH"], "corr": ["MHPSS-15"], "chg": "Decide options (trusted-facility registration, delegated device, PIN-only, anonymous crisis access); implement as a configurable, audit-logged pathway with limited scope.", "gap": "Approved safe-access approach undefined: how to register/log in without own phone or code, and how reduced verification is approved and audited."}, "PA-CR-18": {"ref": "PA-CR-18", "src": 1, "status": "Partly done", "pri": "Low", "screen": "Temperature Unit of Measurement", "text": "Adopt Celsius as the base unit, with the option of displaying Fahrenheit as an optional conversion rather than as the storage unit.", "section": "Patient App", "out": true, "mod": "EMR", "sec": ["L10N"], "corr": ["EMR-10"], "chg": "Add a display-only Fahrenheit conversion setting (profile/accessibility preference), keeping Celsius storage.", "gap": "Celsius base is already used; the optional Fahrenheit display toggle is not built."}, "DR-OS-01": {"ref": "DR-OS-01", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "General", "text": "Correct the translation and terminology errors in the Doctor App. Conduct a formal Arabic linguistic/clinical review rather than scattered text fixes.", "section": "Doctor App", "out": true, "mod": "L10N", "sec": [], "corr": ["L10N-07", "L10N-09"], "chg": "Commission a clinical Arabic review of TRANSLATION_REVIEW.md items. Move hard-coded doctor-app strings to i18n. Load approved translations.", "gap": "Formal Arabic linguistic/clinical review not performed; hard-coded English strings remain."}, "DR-OS-02": {"ref": "DR-OS-02", "src": 1, "status": "Partly done", "pri": "Low", "screen": "Message Box", "text": "Only received messages are displayed. A clear inbox/sent view (and drafts where needed) should be added, with delivery/read status where appropriate.", "section": "Doctor App", "out": true, "mod": "CONS", "sec": [], "corr": ["CONS-06"], "chg": "Add sent/read state to message rows in ConsChat. Add a Sent filter or tab on the inbox. Decide whether drafts are needed.", "gap": "No explicit Sent view, drafts or delivery/read status on messages."}, "DR-OS-03": {"ref": "DR-OS-03", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Messages", "text": "When composing a message to a patient, the application does not provide a functional interface for composing and sending. A controlled patient messaging system should be implemented with role, privacy, and audit rules.", "section": "Doctor App", "out": true, "mod": "CONS", "sec": [], "corr": ["CONS-07"], "chg": "Confirm audit logging on consultation-message send. Define who may initiate messages (consent, hours). Add templates/attachments if wanted.", "gap": "Compose only works against existing consultations; role/privacy/audit rules for patient messaging not confirmed."}, "DR-OS-04": {"ref": "DR-OS-04", "src": 1, "status": "Not done", "pri": "Low", "screen": "Consultant Profile", "text": "Turkish is currently listed as one of the consultation languages. It should be removed if it is not part of the approved service configuration for Syria; languages must be configurable by the administrator.", "section": "Doctor App", "out": true, "mod": "MSTR", "sec": ["L10N"], "corr": ["MSTR-13"], "chg": "Remove Turkish from the options or drive options from a master-data list. Add an admin screen to manage consultation languages.", "gap": "Turkish still offered; list not administrator-configurable."}, "DR-OS-05": {"ref": "DR-OS-05", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Case 360 Comprehensive View", "text": "The button that opens the comprehensive patient/case view does not work. The functionality should be fixed and role-based visibility verified before use.", "section": "Doctor App", "out": true, "mod": "REG", "sec": ["ADMUX"], "corr": ["REG-15"], "chg": "Retest every 360 entry point on device. Verify per-role data shown in Pat360/Cons360.", "gap": "Runtime retest needed; role-based tab visibility not verified."}, "DR-OS-06": {"ref": "DR-OS-06", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Vital Signs / Clinical Entry", "text": "Clinical fields should reject impossible values and alert the doctor to unusual values. Clearly impossible readings must not be saved other than through an approved override process.", "section": "Doctor App", "out": true, "mod": "EMR", "sec": [], "corr": ["EMR-09"], "chg": "Add a controlled override (reason + second approver) for out-of-range values. Extend reference codes and review bounds clinically.", "gap": "No override/approval path for genuine extreme values; coverage limited to curated codes."}, "DR-OS-07": {"ref": "DR-OS-07", "src": 1, "status": "Done", "pri": "-", "screen": "Clinical Record", "text": "Once a consultation has been finalized and signed, the record should no longer remain freely editable. Any subsequent correction should be made through a traceable amendment/addendum without altering the original entry.", "section": "Doctor App", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "DR-OS-08": {"ref": "DR-OS-08", "src": 1, "status": "Partly done", "pri": "High", "screen": "Case 360 / Privacy", "text": "The Case 360 view must not disclose all information to every doctor or administrator. Sensitive MHPSS and GBV content should be segregated and shown only on a role-based need-to-know basis.", "section": "Doctor App", "out": true, "mod": "SEC", "sec": ["MHPSS"], "corr": ["SEC-03"], "chg": "Audit each 360 tab/endpoint for MHPSS/GBV leakage. Add a break-glass/need-to-know rule with logging.", "gap": "Need-to-know segregation proven only for the MHPSS care summary; 360 views not audited."}, "DR-NI-01": {"ref": "DR-NI-01", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Doctor Search", "text": "Add doctor search/filtering by specialty, sub-specialty, gender, language, fee/price, and rating; taking availability and facility into account where applicable.", "section": "Doctor App", "out": true, "mod": "SCHED", "sec": ["MSTR"], "corr": ["SCHED-02", "SCHED-03"], "chg": "Capture consultation fee on clinician. Add sub-specialty, facility and next-available filters to search.", "gap": "Missing fee, sub-specialty, availability and facility filters."}, "DR-NI-02": {"ref": "DR-NI-02", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Consultation", "text": "Allow more than one authorized doctor to join the same consultation for multidisciplinary team or second opinion purposes, with participants clearly displayed, consent obtained, and access logged.", "section": "Doctor App", "out": true, "mod": "CONS", "sec": [], "corr": ["CONS-04", "CONS-05"], "chg": "Choose SFU/video approach and build 3-way video. Verify consent prompt to patient and audit entries for joins.", "gap": "No multi-party live video; patient consent UI and access log unconfirmed."}, "DR-NI-03": {"ref": "DR-NI-03", "src": 1, "status": "Not done", "pri": "Medium", "screen": "Doctor Registration from outside Syria", "text": "Provide an approved onboarding journey for doctors residing outside Syria. If the use of a verification code via WhatsApp is proposed, its regulatory and privacy acceptability must be confirmed, and it must remain a configurable verification channel rather than the sole proof of identity.", "section": "Doctor App", "out": true, "mod": "MSTR", "sec": ["AUTH"], "corr": ["MSTR-08"], "chg": "Define the journey (document upload, credential check, admin approval). Decide WhatsApp acceptability and add as configurable channel.", "gap": "No onboarding journey for doctors outside Syria; no WhatsApp verification channel."}, "DR-NI-04": {"ref": "DR-NI-04", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Provider Credentialing (doctors and counselors)", "text": "Add fields for provider qualifications, license/registration number, issuing authority, specialty verification, document expiry date, credentialing status, suspension/deactivation, and expiry alerts.", "section": "Doctor App", "out": true, "mod": "MSTR", "sec": ["NOTIF"], "corr": ["MSTR-07"], "chg": "Add scheduled expiry notification. Add suspend/deactivate on credential lapse. Optionally gate booking on is_credentialed.", "gap": "No expiry alerts, no auto-suspension, booking not blocked on lapsed credentials."}, "DR-NI-05": {"ref": "DR-NI-05", "src": 1, "status": "Partly done", "pri": "High", "screen": "Role-Based Access", "text": "Implement and make available a formal role-based access model covering the roles of doctor, counsellor, safeguarding officer, field worker, M&E, finance, Julia L1 team, administrator, and vendor support. Julia and Mocero should jointly finalize the roles/permissions matrix, including what each role may view, create, change, approve, and e", "section": "Doctor App", "out": true, "mod": "SEC", "sec": [], "corr": ["SEC-01"], "chg": "Run a joint matrix workshop with Julia. Seed missing roles and align endpoint role lists.", "gap": "Final agreed roles/permissions matrix and export rights not confirmed."}, "DR-NI-06": {"ref": "DR-NI-06", "src": 1, "status": "Done", "pri": "-", "screen": "Clinical Signature and Amendments", "text": "Provide electronic signature/confirmation by the doctor, record locking on completion, an addendum/amendment pathway, and a full audit trail.", "section": "Doctor App", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "DR-NI-07": {"ref": "DR-NI-07", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Referral Closure", "text": "Enable referral to hospitals/other providers with acknowledgement of receipt, referral status, and feedback where legally and clinically appropriate, plus follow-up and closure without unnecessarily disclosing sensitive data.", "section": "Doctor App", "out": true, "mod": "REF", "sec": [], "corr": ["REF-08"], "chg": "Add external-facility referral target and acknowledgement/feedback step. Define minimum data disclosed.", "gap": "External-provider referral and receipt acknowledgement/feedback not confirmed."}, "DR-NI-08": {"ref": "DR-NI-08", "src": 1, "status": "Partly done", "pri": "High", "screen": "Escalation of High-Risk Mental Health Cases", "text": "For mental health service users, provide preconfigured risk levels and a protected escalation pathway for high/imminent risk, covering the responsible person, action, referral, acknowledgement of receipt, and follow-up.", "section": "Doctor App", "out": true, "mod": "MHPSS", "sec": ["REF"], "corr": ["MHPSS-02"], "chg": "Add acknowledge and follow-up due date to escalation. Make risk levels configurable. Confirm responsible-person assignment.", "gap": "No explicit acknowledgement/follow-up step; risk levels hard-coded."}, "DR-NI-09": {"ref": "DR-NI-09", "src": 1, "status": "Partly done", "pri": "Low", "screen": "Provider Performance", "text": "Add approved operational provider indicators such as availability, acceptance rate, cancellations/no-shows, documentation completeness, patient feedback, and service volume, without resorting to automated clinical quality scoring outside governance.", "section": "Doctor App", "out": true, "mod": "ADMUX", "sec": ["MSTR"], "corr": ["ADMUX-10"], "chg": "Add no-show, acceptance rate, feedback score and volume columns. Add a Web report screen with governance approval of indicators.", "gap": "No-show/acceptance/feedback metrics and UI not confirmed."}, "DR-NI-10": {"ref": "DR-NI-10", "src": 1, "status": "Partly done", "pri": "High", "screen": "Clinical Safety Flags", "text": "Display allergy, pregnancy/breastfeeding, and other relevant high clinical risk flags to authorized treating doctors, while preventing unnecessary disclosure to non-clinical roles.", "section": "Doctor App", "out": true, "mod": "EMR", "sec": [], "corr": ["EMR-06"], "chg": "Add flags to patient/clinical record and show banner in 360/consultation for treating clinicians only.", "gap": "No pregnancy/breastfeeding or other risk flags; no banner; non-clinical role masking unverified."}, "DR-NI-11": {"ref": "DR-NI-11", "src": 1, "status": "Not done", "pri": "Medium", "screen": "Provider Settlement Evidence", "text": "Provide service verification fields/statuses that support reconciliation and payment without exposing the content of sensitive MHPSS or GBV notes to finance staff.", "section": "Doctor App", "out": true, "mod": "BILL", "sec": [], "corr": ["BILL-14"], "chg": "Add settlement status per completed consultation (verified/disputed/paid) without clinical content; finance view restricted to those fields.", "gap": "No service verification fields/statuses for provider payment."}, "DR-CR-01": {"ref": "DR-CR-01", "src": 1, "status": "Done", "pri": "-", "screen": "Pathways", "text": "Clarify how the general medicine/telehealth pathway and the psychosocial support pathway are separated within the Doctor App, including roles, queues, records, and access rights.", "section": "Doctor App", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "DR-CR-02": {"ref": "DR-CR-02", "src": 1, "status": "Done", "pri": "-", "screen": "MHPSS Referrals", "text": "Clarify how mental health referrals are allocated: through a rules-based workflow, an authorized human supervisor, the counsellor’s decision, or an AI-assisted suggestion. AI must not make safeguarding/clinical referral decisions independently without approved human oversight.", "section": "Doctor App", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "DR-CR-03": {"ref": "DR-CR-03", "src": 1, "status": "Needs decision", "pri": "High", "screen": "Consultations – Minor", "text": "Clarify the approved journey for a patient under 18: guardian/legal representative verification, consent, child/adolescent assent, confidentiality, exceptions, and safeguarding.", "section": "Doctor App", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-02"], "chg": "Decide guardian ID verification rule and whether booking is blocked until verified. Decide assent age and confidentiality exceptions. Then enforce in booking/consult SPs and document the journey.", "gap": "Policy not fixed on: what proof of guardianship is mandatory, from what age assent is required, adolescent confidentiality exceptions, and who may set Protected."}, "DR-CR-04": {"ref": "DR-CR-04", "src": 1, "status": "Needs decision", "pri": "Medium", "screen": "Online Payment / Insurance", "text": "Clarify how the platform handles a patient with health insurance or third-party coverage, including eligibility verification, patient contribution, insurer liability, payment status, and reconciliation.", "section": "Doctor App", "out": true, "mod": "BILL", "sec": [], "corr": ["BILL-15"], "chg": "Decide in/out of scope. If in: add payer/policy tables, eligibility check, patient-contribution split on bill, payer receivable status and reconciliation report. If out: state that all consultations are patient-paid or programme-funded.", "gap": "Whether insurance/third-party payers are in scope for launch and how liability is split is undefined."}, "DR-CR-05": {"ref": "DR-CR-05", "src": 1, "status": "Partly done", "pri": "High", "screen": "MHPSS / GBV Visibility", "text": "Clarify precisely which roles may view mental health notes, risk assessments, GBV information, and referrals; and define minimum-data rules for doctors not involved in the protected case.", "section": "Doctor App", "out": true, "mod": "SEC", "sec": ["MHPSS"], "corr": ["SEC-03"], "chg": "Approve a role-by-data matrix (notes, risk, GBV, referrals). Enforce is_sensitive/restricted_to_treating in patient and EMR read procedures with a minimum-data view for non-involved doctors.", "gap": "Roles are only partly written down; sensitivity/restriction flags are not enforced on general record reads; ADM/MGR see escalation summaries."}, "DR-CR-06": {"ref": "DR-CR-06", "src": 1, "status": "Needs decision", "pri": "High", "screen": "Vendor / Support Access", "text": "Clarify whether the Julia L1 team, Mocero L2/L3, or infrastructure administrators can view clinical data under any circumstances. The default should be no access to clinical content, other than tightly controlled, authorized, and audited exceptional support cases where strictly necessary.", "section": "Doctor App", "out": true, "mod": "SEC", "sec": [], "corr": ["SEC-02"], "chg": "Decide default no-access and an exceptional approved/time-boxed/audited access process; implement support role without clinical scopes, masked views, and DB-level access controls and logging.", "gap": "No documented policy or technical control separating support access from clinical content; no exceptional-access workflow."}, "DR-CR-07": {"ref": "DR-CR-07", "src": 1, "status": "Needs decision", "pri": "High", "screen": "Recording", "text": "Clarify whether the doctor’s audio/video sessions can be recorded and whether recording controls are enabled. Define the default-off policy, consent, storage, retention period, and access rules.", "section": "Doctor App", "out": true, "mod": "CONS", "sec": [], "corr": ["CONS-01"], "chg": "Decide whether recording is allowed at all. If not: remove/flag-off the Rec button. If yes: default off, consent capture, server storage with encryption, retention and role access.", "gap": "Recording is available to both parties without consent or policy; files land on the user's device."}, "DR-CR-08": {"ref": "DR-CR-08", "src": 1, "status": "Needs decision", "pri": "High", "screen": "E-Prescription / Licensure", "text": "Clarify the regulatory requirements in Syria regarding doctor licensing, cross-border consultation, and e-prescription validity before activating providers and prescription journeys.", "section": "Doctor App", "out": true, "mod": "MSTR", "sec": ["EMR"], "corr": ["MSTR-08"], "chg": "Obtain legal ruling; then add jurisdiction field to credentials/consult routing and prescription validity/expiry rules as required.", "gap": "Regulatory requirements in Syria (licensing body, cross-border practice, e-prescription legal validity) are not specified by the client/legal."}, "DR-CR-09": {"ref": "DR-CR-09", "src": 1, "status": "Partly done", "pri": "High", "screen": "MFA", "text": "Confirm MFA enrolment, login, recovery, device change, and its mandatory application to privileged and clinical roles.", "section": "Doctor App", "out": true, "mod": "AUTH", "sec": ["SEC"], "corr": ["AUTH-05", "AUTH-06"], "chg": "Add MFA enrol + challenge to the Doctor app login; force enrolment for DOC/CNS/ADM/MGR/SYSADM; add recovery codes and device-change flow.", "gap": "MFA is optional, not enforced for clinical/privileged roles, and missing in the Doctor app login; no self-service recovery codes."}, "DR-CR-10": {"ref": "DR-CR-10", "src": 1, "status": "Partly done", "pri": "High", "screen": "Role-Based Access", "text": "Confirm what each key role can and cannot view, including the prevention of access to sensitive MHPSS and GBV information.", "section": "Doctor App", "out": true, "mod": "SEC", "sec": ["MHPSS"], "corr": ["SEC-04"], "chg": "Produce role matrix, enforce is_sensitive, and align SYSADM/ADM scopes.", "gap": "No signed-off per-role view/deny matrix; sensitive flag unenforced; admin-role scoping tightening deferred."}, "DR-CR-11": {"ref": "DR-CR-11", "src": 1, "status": "Partly done", "pri": "High", "screen": "Audit Trail", "text": "Confirm audit logs for login, patient record access, creation/amendment, signature, referral, messages, export, administrator changes, and failed/denied access attempts.", "section": "Doctor App", "out": true, "mod": "SEC", "sec": [], "corr": ["SEC-06"], "chg": "Add read-access audit on patient/EMR/MHPSS views, export and message audit, and log authorisation failures in the API pipeline.", "gap": "No logging of patient-record access (read), messages, exports or denied access."}, "DR-CR-12": {"ref": "DR-CR-12", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Record Locking / Amendment", "text": "Confirm that a completed consultation is locked, that subsequent changes go through an addendum/amendment pathway, and that the original entry remains unchanged and traceable.", "section": "Doctor App", "out": true, "mod": "EMR", "sec": [], "corr": ["EMR-03"], "chg": "Require signing (or auto-lock) on consultation end, and confirm a Draft cannot remain editable indefinitely.", "gap": "Consultation completion does not force sign/lock; sign is optional."}, "DR-CR-13": {"ref": "DR-CR-13", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Referral", "text": "Confirm the referral journey from doctor to hospital/another doctor, including acknowledgement of receipt, follow-up, and closure.", "section": "Doctor App", "out": true, "mod": "REF", "sec": [], "corr": ["REF-07"], "chg": "Wire the escalate sweep to a worker or scheduler, add 'received' acknowledgement state, and follow-up reminders.", "gap": "No automatic acknowledgement of receipt, no scheduled escalation, follow-up reminders unverified."}, "DR-CR-14": {"ref": "DR-CR-14", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Multi-Doctor Consultation", "text": "Confirm that a second authorized doctor can join an ongoing consultation, that participants are visible, that consent is handled, and that the consultation is properly documented.", "section": "Doctor App", "out": true, "mod": "CONS", "sec": [], "corr": ["CONS-04", "CONS-05"], "chg": "Let patient confirm consent in-app; complete/test multi-party A/V; record participants in the case sheet.", "gap": "Patient consent captured by doctor, not patient; live multi-party video missing; voice mesh untested live; documentation of second doctor input in the case sheet not verified."}, "DR-CR-15": {"ref": "DR-CR-15", "src": 1, "status": "Partly done", "pri": "High", "screen": "High-Risk Mental Health Cases", "text": "Confirm the protected pathway for high/imminent risk mental health cases, including notifications, referral, responsible-person action, and closure.", "section": "Doctor App", "out": true, "mod": "MHPSS", "sec": [], "corr": ["MHPSS-02"], "chg": "Notify the safeguarding responsible person on raise, add owner assignment and SLA/overdue alert.", "gap": "No notification or SLA on raise; responsible person is a role, not a named owner."}, "DR-CR-16": {"ref": "DR-CR-16", "src": 1, "status": "Partly done", "pri": "High", "screen": "Provider Lifecycle", "text": "Confirm provider credentialing, license expiry alerting, suspension/deactivation, and prevention of new bookings after deactivation.", "section": "Doctor App", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-07"], "chg": "Add expiry alert worker, enforce Verified+credentialed in appointment_book/slot listing, and block/cancel slots on suspension.", "gap": "No licence-expiry alerts; booking SP does not check clinician status or credentials; suspension does not close open slots."}, "GN-OS-01": {"ref": "GN-OS-01", "src": 1, "status": "Operational", "pri": "Medium", "screen": "Launch", "text": "A Google Play developer account will be created first in order to shorten the launch timeline, with an Apple App Store account considered later. A documented iOS distribution plan should be maintained, and an Android-only release should not be treated as fulfilling the contracted multi- platform scope if iOS is within scope.", "section": "Platform-Level and Next Steps", "out": true, "mod": "PLAT", "sec": [], "corr": ["PLAT-06"], "chg": "Create the Google Play developer account and publish the Android build. Write and maintain an iOS distribution plan with a dated milestone. Confirm with the client whether iOS is in contracted scope.", "gap": "Store accounts, the signed Android build and a written iOS distribution plan are not software items in this repo."}, "GN-OS-02": {"ref": "GN-OS-02", "src": 1, "status": "Operational", "pri": "Medium", "screen": "Integration", "text": "Provide Mocero with the approved integration/API documentation for Syriatel and MTN, credentials, and testing arrangements, through controlled project channels.", "section": "Platform-Level and Next Steps", "out": true, "mod": "NOTIF", "sec": [], "corr": ["NOTIF-01"], "chg": "Obtain Syriatel SMS API docs, sandbox credentials and test numbers through a controlled channel. Move the secret out of the repo into server config and rotate it.", "gap": "Per memory the Syriatel PDF is a wallet payment spec, not SMS; no Syriatel SMS spec, no test arrangements/sandbox confirmed. A plaintext client secret sits in the repo folder."}, "GN-OS-03": {"ref": "GN-OS-03", "src": 1, "status": "Operational", "pri": "Medium", "screen": "Medical Content", "text": "The medication list, including approved trade/generic names, will be provided once obtained/approved through the Ministry of Health or the authorized clinical body.", "section": "Platform-Level and Next Steps", "out": true, "mod": "MSTR", "sec": [], "corr": ["MSTR-10"], "chg": "Receive the approved list, then bulk-load it into the medicine master with trade and generic names (AdmnBulkUpload exists).", "gap": "The approved MoH trade/generic list has not been supplied."}, "GN-OS-04": {"ref": "GN-OS-04", "src": 1, "status": "Partly done", "pri": "Low", "screen": "E-Payment", "text": "No taxes are currently configured in the system. Tax/fee fields should remain configurable and inactive until formally approved, rather than a value being hard-coded.", "section": "Platform-Level and Next Steps", "out": true, "mod": "BILL", "sec": [], "corr": ["BILL-12"], "chg": "Add inactive tax/fee config keys (rate, on/off, effective date) in afd_admin.app_config. Apply them in bill finalise only when active. Add an admin screen with change log.", "gap": "No configurable, switchable tax or fee setting; tax_amount is only ever 0."}, "GN-OS-05": {"ref": "GN-OS-05", "src": 1, "status": "Not done", "pri": "Medium", "screen": "E-Payment", "text": "The platform commission should be configurable as an approved percentage/deduction from provider revenue, with an accounting trail, reconciliation, and exception handling to be agreed separately.", "section": "Platform-Level and Next Steps", "out": true, "mod": "BILL", "sec": [], "corr": ["BILL-13"], "chg": "Decide commission rules (rate, basis, per provider or facility). Add config, per-payment commission ledger rows, a settlement/reconciliation report and an exception queue.", "gap": "No commission percentage, no deduction ledger, no reconciliation or exception handling."}, "GN-OS-06": {"ref": "GN-OS-06", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "E-Payment", "text": "Doctor fees may vary according to approved factors. Controlled fee/tariff configuration with approval rules should be provided, rather than unconstrained ad hoc changes, if program governance requires central approval.", "section": "Platform-Level and Next Steps", "out": true, "mod": "BILL", "sec": [], "corr": ["BILL-11"], "chg": "Decide who approves fees and which factors are allowed (speciality, mode, urgency, clinician). Add draft/approved status with maker-checker and audit on tariff changes.", "gap": "Tariffs are effective-dated but have no approval workflow, no allowed-factor rules, and no limits; any permitted editor can change a fee."}, "GN-OS-07": {"ref": "GN-OS-07", "src": 1, "status": "Not done", "pri": "Medium", "screen": "Visual Identity", "text": "The walkthrough mainly showed the AFD / AFD Doctor identity. For the Syria version, the proposed name for the patient application is “Care Gate”, with a new logo to be approved and a tagline beneath the application name that has not yet been defined by Julia. The final approved name, logo, tagline, and Syria program identity should be app", "section": "Platform-Level and Next Steps", "out": true, "mod": "L10N", "sec": [], "corr": ["L10N-01"], "chg": "Get the final tagline and logo files. Replace names, logo, favicon, titles and splash in all three apps and Flutter shells; centralise the brand in config.", "gap": "Name, logo and tagline are not applied; tagline not yet defined by Julia."}, "GN-OS-08": {"ref": "GN-OS-08", "src": 1, "status": "Done", "pri": "-", "screen": "Emergency Terminology", "text": "Avoid presenting the platform as an “emergency service” unless a full clinical/operational emergency response is approved and available. “Urgent / Immediate Consultation” is preferred, together with a clear disclaimer regarding emergency care.", "section": "Platform-Level and Next Steps", "out": true, "mod": "L10N", "sec": [], "corr": ["L10N-05"], "chg": "None. Optionally confirm every Arabic and Kurmanji string for these keys, and rename any remaining 'Emergency' wording in doctor-facing labels.", "gap": ""}, "GN-OS-09": {"ref": "GN-OS-09", "src": 1, "status": "Partly done", "pri": "Low", "screen": "Alignment with the Syrian Context", "text": "Use the Syrian pound where applicable, Syrian names, numbers, and locations in examples, local date and time formats in the Syria version, and review the examples and data.", "section": "Platform-Level and Next Steps", "out": true, "mod": "L10N", "sec": [], "corr": ["L10N-10"], "chg": "Confirm digit style (Latin vs Eastern Arabic) and currency display. Review seed data, examples, placeholders and phone formats for Syrian relevance.", "gap": "SYP is not shown or enforced everywhere (patient money formatters just print a currency code); seed examples and names have not been reviewed for Syrian context; Latin digits were a deliberate choice that needs client sign-off."}, "GN-OS-10": {"ref": "GN-OS-10", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Arabic Readiness", "text": "Full Arabic right-to-left behavior was not demonstrated across the entire journey. The presence of partial Arabic names/content should not be treated as complete Arabic localization.", "section": "Platform-Level and Next Steps", "out": true, "mod": "L10N", "sec": [], "corr": ["L10N-08"], "chg": "Run a full Arabic RTL walkthrough of every role and fix layout defects. Audit untranslated keys and server messages. Commission a clinical Arabic review.", "gap": "Full-journey RTL has not been proven in code; no systematic screen-by-screen RTL/overflow check and no clinical Arabic review; server-side messages and notifications may still be English."}, "GN-NI-01": {"ref": "GN-NI-01", "src": 1, "status": "Not done", "pri": "Low", "screen": "Download and Distribution", "text": "Provide a QR code and an approved direct download link for the application, with release/version identification and instructions for verifying authenticity.", "section": "Platform-Level and Next Steps", "out": true, "mod": "PLAT", "sec": [], "corr": ["PLAT-06"], "chg": "Publish a signed Android build and a landing page on the Care Gate domain with a QR code, version number, checksum/signing fingerprint and verification steps.", "gap": "No QR, approved link, version identification or verification instructions."}, "GN-NI-02": {"ref": "GN-NI-02", "src": 1, "status": "Not done", "pri": "Medium", "screen": "Visual Identity", "text": "Apply the approved visual identity consistently across the patient, doctor, psychosocial support, web, and administration interfaces. This should include the final application name (proposed: “Care Gate”), the approved new logo, and the final tagline confirmed by Julia.", "section": "Platform-Level and Next Steps", "out": true, "mod": "L10N", "sec": [], "corr": ["L10N-01"], "chg": "Apply the brand kit once the tagline is confirmed: logo, colours, app name, favicon, splash, email/SMS sender name; add a single brand config.", "gap": "Approved name, logo and tagline not applied to patient, doctor, MHPSS, web and admin UIs."}, "GN-NI-03": {"ref": "GN-NI-03", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Arabic Right-to-Left", "text": "Provide full Arabic language and right-to-left display support in every module, form, error message, notification, report, and help text, with a clinical/content Arabic review.", "section": "Platform-Level and Next Steps", "out": true, "mod": "L10N", "sec": [], "corr": ["L10N-08"], "chg": "Audit every module for untranslated text, translate server error and notification messages and reports, add help text, then do a clinical Arabic review.", "gap": "Full coverage not verified: server errors, notifications, reports, help text and PDFs; no clinical Arabic review; no help-text module found."}, "GN-NI-04": {"ref": "GN-NI-04", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Web Application", "text": "Provide and test the web application for all roles and key workflows within scope, not the mobile application alone.", "section": "Platform-Level and Next Steps", "out": true, "mod": "PLAT", "sec": [], "corr": ["PLAT-07"], "chg": "Agree the role and workflow test matrix, run it end to end on staging, fix defects and issue a test report.", "gap": "'Tested for all roles and key workflows' cannot be shown from code; the Playwright scripts exist but no passing role-by-role test record; several flows are known gaps (document/PDF export, referral-to-appointment bridge, online payment)."}, "GN-NI-05": {"ref": "GN-NI-05", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Administration Portal", "text": "Provide an administration portal for the Julia team/authorized administrators to manage user lifecycle, roles, facilities, specialties, providers, access resets, settings, integrations, audit logs, system status, and reports. Authorized administrators should also be able to enable or disable approved features/options by role, user group, ", "section": "Platform-Level and Next Steps", "out": true, "mod": "ADMUX", "sec": ["AUTH"], "corr": ["ADMUX-18"], "chg": "Add role/user scoping to feature flags with logged changes. Add an integrations and system-status page. Confirm access-reset flow covers all roles.", "gap": "Flags are scoped per facility only, not by role, user group or individual user; no integrations-status or system-status screen found; flag changes logged but gating by role/user not available."}, "GN-NI-06": {"ref": "GN-NI-06", "src": 1, "status": "Partly done", "pri": "High", "screen": "M&E / Donor Dashboard", "text": "Provide role-restricted reporting on teleconsultations, psychosocial support sessions, GBV/EVAWG referrals, beneficiaries, disaggregation by sex, age, location, and service, satisfaction level, and other approved indicators. Authorized users should be able to generate dynamic/real- time reports using approved filters and export privacy-pr", "section": "Platform-Level and Next Steps", "out": true, "mod": "ADMUX", "sec": ["MHPSS"], "corr": ["ADMUX-09"], "chg": "Agree indicator list. Add sex/age/service/satisfaction/GBV indicators with small-cell suppression, filters, role restriction and CSV/XLSX export.", "gap": "No disaggregation by sex, age or service, no satisfaction or GBV-referral indicators, no filters beyond dates, no Excel export, report export SP was a stub per memory."}, "GN-NI-07": {"ref": "GN-NI-07", "src": 1, "status": "Partly done", "pri": "High", "screen": "Two SMS Gateways", "text": "Integrate two approved Syrian SMS/telecom providers for verification codes, reminders, alerts, and approved fallback. Include routing/failover, delivery status, retry, and provider-level reporting.", "section": "Platform-Level and Next Steps", "out": true, "mod": "NOTIF", "sec": [], "corr": ["NOTIF-02", "NOTIF-03"], "chg": "Build MTN and Syriatel channels with prefix routing and failover, DLR/status handling, provider report and OTP delivery. Needs provider specs and credentials (see GN-OS-02).", "gap": "No Syriatel or MTN adapter (MTN is SOAP), no two-provider routing by number prefix or failover, no delivery-status callbacks, no provider-level report; OTP and reminders not live on SMS."}, "GN-NI-08": {"ref": "GN-NI-08", "src": 1, "status": "Not done", "pri": "High", "screen": "Two Payment Networks", "text": "Integrate two approved payment networks with success/failure handling, receipt, reversal/refund, settlement, reconciliation, transaction references, and exception handling.", "section": "Platform-Level and Next Steps", "out": true, "mod": "BILL", "sec": ["NOTIF"], "corr": ["BILL-10"], "chg": "Implement eCash client, callback handling, refund/reverse and reconciliation; then second network (Syriatel or Paymera); wire prepay booking and bill payment updates.", "gap": "No integration with any payment network, callbacks, receipts, reversal, settlement, reconciliation or second network."}, "GN-NI-09": {"ref": "GN-NI-09", "src": 1, "status": "Not done", "pri": "High", "screen": "Data Storage Location and External Dependencies", "text": "Document where each category of data is stored/processed, every third-party service used, any cross-border data transfer, and the corresponding protection/approval requirements.", "section": "Platform-Level and Next Steps", "out": true, "mod": "SEC", "sec": ["NOTIF"], "corr": ["SEC-13"], "chg": "Write a data inventory: storage location per data category, each third party (Firebase/Google, SMS, payment, STUN/TURN), cross-border transfers and approvals; get legal sign-off.", "gap": "No data-flow, storage-location or third-party register."}, "GN-NI-10": {"ref": "GN-NI-10", "src": 1, "status": "Partly done", "pri": "High", "screen": "Identity and Access Security", "text": "Add multi-factor authentication where required, clear role-based access, session timeout, forced logout, controlled administrative access, and a secure account recovery process.", "section": "Platform-Level and Next Steps", "out": true, "mod": "AUTH", "sec": ["SEC"], "corr": ["AUTH-05", "AUTH-07"], "chg": "Decide MFA mandatory roles and enforce at first login. Add idle timeout. Complete OTP/secure recovery once SMS is live. Review the session lifetime.", "gap": "MFA is opt-in, not mandatory for admin/clinical roles; no idle timeout found in front ends; patient self-service recovery by OTP is not delivered (no SMS) and only admin reset works; 90-day doctor/patient sessions may be too long."}, "GN-NI-11": {"ref": "GN-NI-11", "src": 1, "status": "Partly done", "pri": "High", "screen": "Audit Logs", "text": "Maintain reliable audit logs for record access and amendment, consents, referrals, exports, administrator actions/settings, and failed/denied access attempts. The audit log retention period should be configurable.", "section": "Platform-Level and Next Steps", "out": true, "mod": "SEC", "sec": [], "corr": ["SEC-06"], "chg": "Audit coverage review against the list (reads, amendments, consents, referrals, exports, admin settings, denied access). Add missing audit calls and confirm configurable audit retention.", "gap": "Coverage of record reads, exports, consents and failed access attempts not verified end to end; export audit is weak because export SP was a stub; audit-log retention is a policy row but purge is deliberately not applied; hosted run endpoint 403 per memory."}, "GN-NI-12": {"ref": "GN-NI-12", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Monitoring and Alerting", "text": "Provide monitoring of application health and performance, error/availability alerts, active session indicators, integration status, and operational logs available to authorized Julia technical staff.", "section": "Platform-Level and Next Steps", "out": true, "mod": "PLAT", "sec": [], "corr": ["PLAT-03"], "chg": "Add a system-status page aggregating service health and integration status, log/error capture with alerting (e.g. email/SMS to technical staff) and an operations runbook.", "gap": "No admin monitoring dashboard for app health, performance, error/availability alerts, integration status or operational logs; relies on external server tooling."}, "GN-NI-13": {"ref": "GN-NI-13", "src": 1, "status": "Operational", "pri": "High", "screen": "Backup / Restore / Disaster Recovery", "text": "Establish documented arrangements for backup, encryption, retention period, restore testing, and disaster recovery, including the agreed RTO and RPO targets, with responsibility for each activity clearly assigned.", "section": "Platform-Level and Next Steps", "out": true, "mod": "PLAT", "sec": [], "corr": ["PLAT-05"], "chg": "Agree RTO/RPO with the client. Write the backup/restore/DR procedure with owners. Run and record a restore test.", "gap": "No documented backup, retention, restore-test or DR plan with RTO/RPO and named owners."}, "GN-NI-14": {"ref": "GN-NI-14", "src": 1, "status": "Not done", "pri": "High", "screen": "Security Assessment", "text": "Complete vulnerability testing and penetration testing and remediate critical and high findings before go-live. Maintain a formal security report setting out the findings and their remediation status.", "section": "Platform-Level and Next Steps", "out": true, "mod": "SEC", "sec": [], "corr": ["SEC-15"], "chg": "Commission VA/pentest on the deployed environment. Remediate critical/high findings. Maintain a findings and remediation register.", "gap": "No vulnerability scan or penetration test performed or recorded; no security report with remediation status."}, "GN-NI-15": {"ref": "GN-NI-15", "src": 1, "status": "Partly done", "pri": "High", "screen": "Performance / WebRTC", "text": "Define and test the number of concurrent users, concurrent video sessions, response times, database performance, reconnection, and behavior at peak load. Mocero explained that, where connectivity is weak, a consultation can step down from video to audio and then to text chat. In the next review, the application should actually be run unde", "section": "Platform-Level and Next Steps", "out": true, "mod": "PLAT", "sec": ["CONS"], "corr": ["PLAT-02"], "chg": "Port quality sampling and step-down to doctor/patient call screens. Add TURN servers. Run load test for concurrent users/video sessions and throttled-network test of step-down, disconnect, reconnect and recovery.", "gap": "Step-down logic is not seen in the doctor/patient call paths; no TURN relay; no concurrency/load test results; reconnection and recovery untested under weak bandwidth."}, "GN-NI-16": {"ref": "GN-NI-16", "src": 1, "status": "Operational", "pri": "Medium", "screen": "Application Distribution and Release Management", "text": "Define the supported Android/iOS versions, the distribution channels in Syria, compatibility with older devices, mandatory/optional updates, build signing, rollback, and user communication.", "section": "Platform-Level and Next Steps", "out": true, "mod": "PLAT", "sec": [], "corr": ["PLAT-06"], "chg": "Define supported Android/iOS versions and Syria distribution channels. Document signing, rollback and user communication. Add a min-version/update-prompt check if wanted.", "gap": "Release management policy and in-app mandatory/optional update check are not defined or implemented."}, "GN-NI-17": {"ref": "GN-NI-17", "src": 1, "status": "Operational", "pri": "Medium", "screen": "Operational Handover", "text": "Provide the final system, administrator, and user manuals, the configuration baseline, deployment/upgrade procedures, fault handling, monitoring, backup/recovery interfaces, support escalation, and handover of access rights.", "section": "Platform-Level and Next Steps", "out": true, "mod": "PLAT", "sec": [], "corr": ["PLAT-08"], "chg": "Produce system, admin and user manuals, config baseline, deploy/upgrade and fault-handling procedures, support escalation and access handover checklist.", "gap": "Handover documentation and access-rights handover not produced."}, "GN-NI-18": {"ref": "GN-NI-18", "src": 1, "status": "Operational", "pri": "Medium", "screen": "Role-Based Training", "text": "Deliver role-specific training and competency assessments for the Julia L1/administration team, the AYF health, mental health, field, and M&E teams, doctors/counsellors, and site coordinators, with attendance records and feedback.", "section": "Platform-Level and Next Steps", "out": true, "mod": "PLAT", "sec": [], "corr": ["PLAT-08"], "chg": "Prepare role-based training plan and materials, run sessions, record attendance, assessment and feedback.", "gap": "No training plan, materials, competency assessment or attendance records."}, "GN-NI-19": {"ref": "GN-NI-19", "src": 1, "status": "Operational", "pri": "Low", "screen": "Review and Feedback Tracking", "text": "Maintain a clear review and feedback log showing the related requirement, issue priority, the party responsible for action, remediation status, confirmation outcome, and agreed closure.", "section": "Platform-Level and Next Steps", "out": true, "mod": "PLAT", "sec": [], "corr": ["PLAT-09"], "chg": "Maintain a shared register (requirement, priority, owner, status, confirmation, closure) and update it each review.", "gap": "No agreed log with requirement link, owner, status, confirmation and closure."}, "GN-NI-20": {"ref": "GN-NI-20", "src": 1, "status": "Operational", "pri": "Medium", "screen": "Go-Live / Hypercare Period", "text": "Use a single go/no-go checklist covering the platform, staffing, sites, connectivity, support, referral, regulatory and safeguarding aspects, and beneficiary journeys, together with rollback and early support plans.", "section": "Platform-Level and Next Steps", "out": true, "mod": "PLAT", "sec": [], "corr": ["PLAT-09"], "chg": "Draft one go/no-go checklist covering platform, staffing, sites, connectivity, support, referral, regulatory, safeguarding and beneficiary journeys, plus rollback and hypercare plans.", "gap": "No single go-live checklist, rollback or early-support plan."}, "GN-NI-21": {"ref": "GN-NI-21", "src": 1, "status": "Partly done", "pri": "High", "screen": "Protected GBV Referral", "text": "Provide a minimum-data, role-restricted, survivor-centered referral pathway, from assessment and consent through authorized referral, acknowledgement of receipt, and follow-up to closure.", "section": "Platform-Level and Next Steps", "out": true, "mod": "MHPSS", "sec": ["REF"], "corr": ["MHPSS-13"], "chg": "Define the GBV pathway with the client. Add consent step, minimum-data form, role restriction, receipt acknowledgement and follow-up/closure states.", "gap": "No dedicated minimum-data GBV pathway end to end (consent capture, role-restricted access, receipt acknowledgement, follow-up to closure) confirmed."}, "GN-NI-22": {"ref": "GN-NI-22", "src": 1, "status": "Partly done", "pri": "High", "screen": "Privacy-Preserving Export / Analytics", "text": "Provide anonymized/aggregated reporting for MHPSS and GBV services, and field-level export controls, so that donor/M&E users do not unnecessarily receive identifiable case narratives.", "section": "Platform-Level and Next Steps", "out": true, "mod": "MHPSS", "sec": ["ADMUX", "SEC"], "corr": ["MHPSS-14"], "chg": "Add MHPSS/GBV aggregate reports with small-number suppression. Add field-level export permissions so donor/M&E roles never get case narratives. Audit exports.", "gap": "Aggregate M&E exists but MHPSS/GBV-specific anonymised reports and per-field export restrictions are missing."}, "GN-NI-23": {"ref": "GN-NI-23", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Bulk Upload / Maker-Checker Principle", "text": "Provide authorized bulk upload of patient registration data and their laboratory reports. The patient registration upload should support the agreed batch number format DD/MM/YYYY/XXX/ZZZ, where XXX is the three-digit patient category and ZZZ is the three-digit batch number. Include maker and checker approval, validation, duplicate checkin", "section": "Platform-Level and Next Steps", "out": true, "mod": "ADMUX", "sec": ["REG"], "corr": ["ADMUX-17"], "chg": "Add Patient and LabReport entity types with validation and duplicate checks. Generate batch_no as DD/MM/YYYY/category/sequence. Add row-level error report download. Keep audit logging.", "gap": "Patient registration and lab-report uploads and the agreed batch number format are not implemented; duplicate-check/error report for patients not seen."}, "GN-NI-24": {"ref": "GN-NI-24", "src": 1, "status": "Not done", "pri": "High", "screen": "Encryption of Sensitive Data", "text": "Encrypt sensitive personal and health data in the database (at rest) and in transit. Document key management, backup encryption, and the roles authorized to access the data after decryption.", "section": "Platform-Level and Next Steps", "out": true, "mod": "SEC", "sec": [], "corr": ["SEC-12"], "chg": "Decide at-rest approach (disk/TDE and/or column encryption for MHPSS/GBV). Enforce HTTPS/HSTS. Document key management, backup encryption and decrypt-authorised roles.", "gap": "At-rest encryption of sensitive health data and key management are not implemented or documented in code; TLS config unverifiable."}, "GN-NI-25": {"ref": "GN-NI-25", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Configurability / Settings", "text": "Keep the application highly configurable so that approved items such as labels, service options, roles, fees, languages, notifications, reports, and feature availability can be changed through authorized settings rather than code changes wherever practical. Configuration changes should be controlled and logged.", "section": "Platform-Level and Next Steps", "out": true, "mod": "PLAT", "sec": [], "corr": ["PLAT-10"], "chg": "Inventory what is still hardcoded and expose it via admin settings. Ensure all config edits write to the change log.", "gap": "Configurability exists for flags and key settings with change log; completeness across labels, fees, roles, reports and consistent audit of every master change is unconfirmed."}, "GN-CR-01": {"ref": "GN-CR-01", "src": 1, "status": "Operational", "pri": "Medium", "screen": "Hosting", "text": "Define the minimum and scalable hosting resources for phase one, including Windows/Linux dependencies where applicable, processing capacity, database, storage, network, certificates, monitoring, backup/recovery, and growth assumptions.", "section": "Platform-Level and Next Steps", "out": true, "mod": "PLAT", "sec": [], "corr": ["PLAT-05"], "chg": "Produce sizing doc (CPU/RAM, DB, storage, network, certificates, monitoring, backup, growth) after load testing.", "gap": "Minimum and scalable hosting spec not written."}, "GN-CR-02": {"ref": "GN-CR-02", "src": 1, "status": "Needs decision", "pri": "High", "screen": "External Services / Data Flow", "text": "Clarify every third-party service used outside the approved environment in Syria (video/WebRTC, push notifications, analytics, error tracking, maps, SMS/payment, and others), what data each of them receives, and whether any personal/health data leaves Syria.", "section": "Platform-Level and Next Steps", "out": true, "mod": "SEC", "sec": ["NOTIF"], "corr": ["SEC-13"], "chg": "Decide per service: keep, host in-country (TURN/signalling) or replace. Produce data-flow register. If external stays, minimise payloads (no health data in push/SMS).", "gap": "No data-flow register; call signalling, push and SMS leave Syria (at least IPs, phone numbers, message text); whether acceptable is a policy call."}, "GN-CR-03": {"ref": "GN-CR-03", "src": 1, "status": "Needs decision", "pri": "High", "screen": "Data Retention / Deletion", "text": "Clarify the approved rules for retention, archiving, deletion, legal hold, patient access/export, and account closure, covering general clinical records, MHPSS and GBV records, and audit and transaction logs.", "section": "Platform-Level and Next Steps", "out": true, "mod": "SEC", "sec": [], "corr": ["SEC-14"], "chg": "Client to approve periods and legal basis per record class. Then seed policies, add legal hold flag and patient data export if required.", "gap": "Approved retention periods for clinical, MHPSS/GBV, audit and transaction records, legal hold and patient export rules are not defined."}, "GN-CR-04": {"ref": "GN-CR-04", "src": 1, "status": "Needs decision", "pri": "High", "screen": "Administrative / Database Access", "text": "Clarify who owns and controls administrator, database, server, and log privileges in the production environment; requiring named accounts, multi-factor authentication, least privilege, time-limited vendor access, and full logging.", "section": "Platform-Level and Next Steps", "out": true, "mod": "SEC", "sec": [], "corr": ["SEC-11"], "chg": "Client to name owners and approve policy (named accounts, MFA, least privilege, vendor access expiry, logging). Enforce MFA for admin roles in app and document DB/server controls.", "gap": "Ownership of production admin, DB, server and log privileges and time-limited vendor access are not defined."}, "GN-CR-05": {"ref": "GN-CR-05", "src": 1, "status": "Needs decision", "pri": "Low", "screen": "Current Walkthrough / Scope", "text": "Clarify whether the current walkthrough is simply a demonstration of the core product or shows the version customized for Syria. Arabic right-to-left, integrations, web, administration, reporting, and all other items not demonstrated should remain open pending confirmation.", "section": "Platform-Level and Next Steps", "out": true, "mod": "PLAT", "sec": [], "corr": ["PLAT-09"], "chg": "Confirm in writing that the build is the Syria version and keep non-demonstrated items open in the feedback log.", "gap": "Scope statement of what the walkthrough covered is a communication matter; non-demonstrated items remain open."}, "GN-CR-06": {"ref": "GN-CR-06", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Full Arabic Right-to-Left Support", "text": "Confirm full Arabic right-to-left support in the patient, doctor, psychosocial support, web, and administration applications, including reports, notifications, and error/validation messages.", "section": "Platform-Level and Next Steps", "out": true, "mod": "L10N", "sec": [], "corr": ["L10N-08"], "chg": "Run Arabic RTL walkthrough of every screen, report, notification template and API error. Fill missing translations.", "gap": "Full RTL coverage of reports, notifications and error/validation messages unconfirmed; some labels may fall back to English."}, "GN-CR-07": {"ref": "GN-CR-07", "src": 1, "status": "Operational", "pri": "Medium", "screen": "Web Application", "text": "Confirm the key in-scope workflows on the web application using the relevant user roles.", "section": "Platform-Level and Next Steps", "out": true, "mod": "PLAT", "sec": [], "corr": ["PLAT-07"], "chg": "Schedule a scripted UAT session on the web console per role (test.adm, test.mgr etc.) and record sign-off.", "gap": "Walkthrough of in-scope workflows per role has not been recorded/signed off."}, "GN-CR-08": {"ref": "GN-CR-08", "src": 1, "status": "Partly done", "pri": "High", "screen": "SMS Provider 1", "text": "Confirm verification code, reminder, cancellation, and account recovery messages through the first Syrian SMS provider, including delivery status and failure handling.", "section": "Platform-Level and Next Steps", "out": true, "mod": "NOTIF", "sec": [], "corr": ["NOTIF-02", "NOTIF-04"], "chg": "Obtain provider 1 spec/credentials; add provider adapter; add DLR callback or polling; wire OTP/recovery messages through outbox; test on Syrian numbers.", "gap": "No Syrian provider integrated or tested; no delivery-status callback; verification/recovery SMS not wired."}, "GN-CR-09": {"ref": "GN-CR-09", "src": 1, "status": "Not done", "pri": "Medium", "screen": "SMS Provider 2", "text": "Confirm the same functionality through the second Syrian SMS provider, including routing/fallback where this forms part of the design.", "section": "Platform-Level and Next Steps", "out": true, "mod": "NOTIF", "sec": [], "corr": ["NOTIF-02"], "chg": "Decide routing policy (by prefix vs primary/fallback); implement second adapter and router in the channel layer.", "gap": "No second provider, no routing by carrier, no fallback."}, "GN-CR-10": {"ref": "GN-CR-10", "src": 1, "status": "Partly done", "pri": "High", "screen": "Payment Network 1", "text": "Confirm collection, success, failure, receipt, refund/reversal, and reconciliation through the first payment network.", "section": "Platform-Level and Next Steps", "out": true, "mod": "BILL", "sec": [], "corr": ["BILL-10"], "chg": "Build eCash client (checkout, callback, status lookup, reversal), reconcile job, fix receipt/refund state updates; test in sandbox.", "gap": "No live collection, callbacks, reversal or reconciliation against a payment network."}, "GN-CR-11": {"ref": "GN-CR-11", "src": 1, "status": "Not done", "pri": "Medium", "screen": "Payment Network 2", "text": "Confirm the same end-to-end payment and reconciliation journey through the second payment network.", "section": "Platform-Level and Next Steps", "out": true, "mod": "BILL", "sec": [], "corr": ["BILL-10"], "chg": "Decide whether a second network is in scope; add adapter behind a common payment-gateway interface.", "gap": "Second network not started; also depends on design for multi-network selection."}, "GN-CR-12": {"ref": "GN-CR-12", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Administration Portal", "text": "Confirm administration portal functionality for users, roles, facilities, providers, account deactivation/reset, audit logs, integration settings, and authorized reports.", "section": "Platform-Level and Next Steps", "out": true, "mod": "ADMUX", "sec": ["AUTH"], "corr": ["ADMUX-07", "ADMUX-18"], "chg": "Verify each listed admin function in UAT; fix report export; add integration-settings screen if missing.", "gap": "Integration settings UI and authorised report export not verified working."}, "GN-CR-13": {"ref": "GN-CR-13", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "M&E Dashboard", "text": "Confirm the required donor/operational indicators, filters, disaggregation, and data quality checks. Confirm that authorized users can generate dynamic/real-time reports and export privacy-preserving results in CSV/Excel format.", "section": "Platform-Level and Next Steps", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-09"], "chg": "Agree indicator set with donor; add filters/disaggregation and small-cell suppression; add Excel export and quality checks.", "gap": "Indicator list not agreed; no disaggregation by age/sex/service, no min-cell suppression, no data-quality checks, no .xlsx."}, "GN-CR-14": {"ref": "GN-CR-14", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Offline / Sync Conflict", "text": "Confirm offline use, reconnection, synchronization, and the occurrence and controlled resolution of a data conflict without data loss or duplication.", "section": "Platform-Level and Next Steps", "out": true, "mod": "PLAT", "sec": [], "corr": ["PLAT-01"], "chg": "Run a device test: go offline, record, reconnect, force conflict, resolve; fix gaps found.", "gap": "True offline use and an induced conflict have not been demonstrated; device-side queue unverified."}, "GN-CR-15": {"ref": "GN-CR-15", "src": 1, "status": "Partly done", "pri": "High", "screen": "Security Controls", "text": "Confirm multi-factor authentication, role-based access, session timeout, forced logout, access denial, audit logs, and privileged access controls.", "section": "Platform-Level and Next Steps", "out": true, "mod": "SEC", "sec": ["AUTH"], "corr": ["SEC-11"], "chg": "Add idle timeout, admin force-logout of sessions; review privileged access; demonstrate in UAT.", "gap": "Session inactivity timeout and admin forced logout not found; SYSADM super-admin bypass deferred (memory)."}, "GN-CR-16": {"ref": "GN-CR-16", "src": 1, "status": "Operational", "pri": "High", "screen": "Backup / Restore / DR", "text": "Confirm that backup restore and disaster recovery arrangements are capable of meeting the agreed RTO and RPO targets. This may be confirmed through a technical demonstration rather than through the user interface.", "section": "Platform-Level and Next Steps", "out": true, "mod": "PLAT", "sec": [], "corr": ["PLAT-05"], "chg": "Agree RTO/RPO; configure backups and replica; perform and record a restore drill.", "gap": "Targets not agreed; restore not demonstrated."}, "GN-CR-17": {"ref": "GN-CR-17", "src": 1, "status": "Partly done", "pri": "High", "screen": "GBV/EBAWG Referral", "text": "Confirm the protected GBV referral pathway from intake, risk assessment, and consent, through authorized referral, acknowledgement of receipt, and follow-up, to closure.", "section": "Platform-Level and Next Steps", "out": true, "mod": "MHPSS", "sec": ["REF"], "corr": ["MHPSS-13"], "chg": "Define GBV pathway steps with the GBV partner; add risk assessment and consent steps, acknowledgement and follow-up reminders; test with restricted roles.", "gap": "Structured GBV intake and risk assessment, explicit consent capture, acknowledgement and follow-up tracking not confirmed end to end."}, "GN-CR-18": {"ref": "GN-CR-18", "src": 1, "status": "Operational", "pri": "Medium", "screen": "Real User Conditions", "text": "Confirm that the application works under realistic user conditions in Syria, using Arabic-speaking users, representative devices, local/limited connectivity, proper role separation, local SMS and payment test services, and realistic clinic/center/support journeys.", "section": "Platform-Level and Next Steps", "out": true, "mod": "PLAT", "sec": [], "corr": ["PLAT-07"], "chg": "Plan and run a pilot UAT with Arabic-speaking users, low-end devices and throttled networks once SMS/payment sandboxes exist.", "gap": "No field test plan or run recorded."}, "GN-CR-19": {"ref": "GN-CR-19", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Bulk Upload Operations", "text": "Confirm bulk upload of patient registration data and their laboratory reports, including template validation, the agreed batch numbering, maker and checker approval, duplicate/error handling, and audit logs.", "section": "Platform-Level and Next Steps", "out": true, "mod": "ADMUX", "sec": ["REG"], "corr": ["ADMUX-17"], "chg": "Add patient and lab-report entity types with CSV templates and validation; implement apply with duplicate detection and error report; confirm batch numbering format; audit each step.", "gap": "Patient registration and lab report import, template validation, duplicate/error handling and apply step are missing."}, "GN-CR-20": {"ref": "GN-CR-20", "src": 1, "status": "Operational", "pri": "Medium", "screen": "Major User Journeys", "text": "Confirm the complete end-to-end journey for every key in-scope user type: patient, doctor, counsellor, registration/field staff, administrator, support, M&E, and finance. Each journey should be traced from start/login through to the expected final outcome.", "section": "Platform-Level and Next Steps", "out": true, "mod": "PLAT", "sec": [], "corr": ["PLAT-07"], "chg": "Define the journey scripts per user type, run them, and log defects; close the gaps listed under payments, SMS, document generation.", "gap": "Finance, support and M&E journeys and several cross-module links are incomplete or unverified."}, "AM-001": {"ref": "AM-001", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Table Filters and Sorting", "text": "The filter option is available on every column but is applied inconsistently: the same comparison operators are applied to all columns regardless of data type, e.g., \"Contains\" on a date or status column. Each filter should match the values its column contains.", "section": "General Notes Applying to the Entire Admin Dashboard", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-02"], "chg": "Add typed filter controls to AfdGrid driven by column format (date range picker, select for badge/status, numeric range, text contains).", "gap": "No type-specific filters (date range, status list, number range)."}, "AM-002": {"ref": "AM-002", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Table Filters and Sorting", "text": "Status filtering should use a list of defined values such as (Completed – InProgress – Assigned – Canceled), according to each column's actual values, and duration filtering should use a list of preset values (e.g., 10s – 5m …).", "section": "General Notes Applying to the Entire Admin Dashboard", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-02"], "chg": "Add select-type filters with option lists (status values per screen; preset duration buckets) in AfdGrid and screen filter definitions.", "gap": "Status and duration filters have no defined value lists."}, "AM-003": {"ref": "AM-003", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Table Filters and Sorting", "text": "Some filters do not work at all when applied, and others work incorrectly.", "section": "General Notes Applying to the Entire Admin Dashboard", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-03"], "chg": "Obtain list of failing filters; make filter match the displayed formatted value; push filtering to server for paged lists.", "gap": "Filter works only on loaded rows and on text; specific failing filters unidentified."}, "AM-004": {"ref": "AM-004", "src": 2, "status": "Cannot verify", "pri": "Low", "screen": "Table Filters and Sorting", "text": "When the user selects one option in the filter popover before completing the remaining fields, the popover closes before the selection can be completed and Apply clicked. (Clearly visible on the Call Quality page – see its section.)", "section": "General Notes Applying to the Entire Admin Dashboard", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-21"], "chg": "Retest on the current build; if the popover is still seen, locate it in ConsQualityReport and keep it open until Apply.", "gap": "Hosted build may differ from repository."}, "AM-005": {"ref": "AM-005", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Table Filters and Sorting", "text": "The ascending/descending sort option is not useful for some columns; it should be offered only where meaningful.", "section": "General Notes Applying to the Entire Admin Dashboard", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-04"], "chg": "Review per-screen column definitions and set sortable:false where sorting has no meaning.", "gap": "Non-meaningful columns (status codes, notes, free text) still sortable."}, "AM-006": {"ref": "AM-006", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Dates and Times", "text": "Date formatting and translation are inconsistent across the dashboard; dates appear in different formats in different places.", "section": "General Notes Applying to the Entire Admin Dashboard", "out": true, "mod": "ADMUX", "sec": ["L10N"], "corr": ["ADMUX-05"], "chg": "Route all date display through core/format.ts; replace ad-hoc toLocale calls; ensure date columns declare format.", "gap": "Dates outside AfdGrid use differing formats; grid only formats columns declared as date."}, "AM-007": {"ref": "AM-007", "src": 2, "status": "Not done", "pri": "Low", "screen": "Dates and Times", "text": "Date and time filters should use a Calendar Picker and a Time Picker instead of free-text input.", "section": "General Notes Applying to the Entire Admin Dashboard", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-02"], "chg": "Add date-range and time pickers (PrimeVue Calendar via MOP wrapper) as filter controls for date columns.", "gap": "No calendar/time picker in filters."}, "AM-008": {"ref": "AM-008", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Translation and Localization", "text": "Localization is incomplete and inconsistent: some elements appear in Arabic and others in English, with no unified standard across the interface.", "section": "General Notes Applying to the Entire Admin Dashboard", "out": true, "mod": "L10N", "sec": [], "corr": ["L10N-07"], "chg": "Fill missing Arabic (and Kurdish) labels in menuRoutes/plan data and catalogues; remove hard-coded English; use the gap report to track.", "gap": "Remaining untranslated menu labels, screen titles and some hard-coded English strings."}, "AM-009": {"ref": "AM-009", "src": 2, "status": "Not done", "pri": "Medium", "screen": "Translation and Localization", "text": "Replace the displayed platform name “AFD Telehealth Syria” with “Care Gate” Syria across the Admin module.", "section": "General Notes Applying to the Entire Admin Dashboard", "out": true, "mod": "L10N", "sec": [], "corr": ["L10N-01"], "chg": "Change brand appName/shortName/footerText, index.html title and AppShell subtitle to 'Care Gate' / 'Care Gate Syria' (also logo asset); apply to Doctor/Patient apps if wanted.", "gap": "Old name still displayed in sidebar, page title and footer."}, "AM-010": {"ref": "AM-010", "src": 2, "status": "Needs decision", "pri": "Low", "screen": "Translation and Localization", "text": "Remove “Kurmandi” from the available language options if it is not an approved platform language.", "section": "General Notes Applying to the Entire Admin Dashboard", "out": true, "mod": "L10N", "sec": [], "corr": ["L10N-04"], "chg": "Decision: keep or drop Kurmanji. If dropped, remove ku from i18n locales list, language switcher and menu labelKu fields.", "gap": "Client states Kurmanji may not be an approved language; product decision needed."}, "AM-011": {"ref": "AM-011", "src": 2, "status": "Partly done", "pri": "Low", "screen": "Translation and Localization", "text": "Templates and data fields should be standardised across the Admin module to ensure consistent terminology, field names, formats and presentation.", "section": "General Notes Applying to the Entire Admin Dashboard", "out": true, "mod": "L10N", "sec": ["ADMUX"], "corr": ["L10N-11"], "chg": "Agree a terminology glossary; align field labels/status names across screens in the generator plan data and catalogues.", "gap": "No single glossary/template standard across screens."}, "AM-012": {"ref": "AM-012", "src": 2, "status": "Partly done", "pri": "Medium", "screen": "Permissions and Display of Actions and Menus", "text": "When logged in as Manager, actions are displayed that the user has no permission to perform; clicking them shows the message \"You do not have permission to perform this action\". Users should only see the actions they are permitted to perform. (Principle of Least Privilege).", "section": "General Notes Applying to the Entire Admin Dashboard", "out": true, "mod": "ADMUX", "sec": ["SEC"], "corr": ["ADMUX-06"], "chg": "Add role/permission awareness to AfdGrid actions (e.g. act.roles filtered by auth.roleCode) and set role lists on actions per the controllers' [Authorize] attributes.", "gap": "Row/page actions not hidden by role/permission."}, "AM-013": {"ref": "AM-013", "src": 2, "status": "Done", "pri": "-", "screen": "Permissions and Display of Actions and Menus", "text": "The Clinical Operations menu appears in the Cashier account although it does not work. Is there any need for it to appear in this account at all? It is suggested to hide it if it is not within the account's permissions.", "section": "General Notes Applying to the Entire Admin Dashboard", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "AM-014": {"ref": "AM-014", "src": 2, "status": "Operational", "pri": "Medium", "screen": "Performance and Export", "text": "The dashboard loads slowly despite a good internet connection.", "section": "General Notes Applying to the Entire Admin Dashboard", "out": true, "mod": "PLAT", "sec": ["ADMUX"], "corr": ["PLAT-04"], "chg": "Profile hosted load (bundle size, API timings, DB); consider server-side paging for large lists and enabling compression/caching.", "gap": "Needs profiling on the hosted server."}, "AM-015": {"ref": "AM-015", "src": 2, "status": "Not done", "pri": "High", "screen": "Performance and Export", "text": "PDF and Excel files exported from the dashboard download empty, with no data.", "section": "General Notes Applying to the Entire Admin Dashboard", "out": true, "mod": "ADMUX", "sec": [], "corr": ["ADMUX-07"], "chg": "Implement export (CSV/XLSX/PDF) in AfdGrid from the filtered rows, or server-side exports for reports.", "gap": "No real PDF or Excel export anywhere in the console."}, "AM-016": {"ref": "AM-016", "src": 2, "status": "Cannot verify", "pri": "
