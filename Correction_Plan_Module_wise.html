<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Care Gate Correction Plan</title>
<style>
:root{
  --bg:#f4f7f6; --surface:#fff; --surface2:#eef3f2; --line:#d5dfdd; --text:#10272d; --muted:#586b69; --primary:#0e6e7e; --primary-ink:#fff; --navy:#17324d;
  --hi:#b3261e; --hi-bg:#fde8e6; --md:#8a5a00; --md-bg:#fff1d6; --lo:#2f6b2f; --lo-bg:#e4f3e1;
  --fe:#1d5fa8; --fe-bg:#e3eefb; --api:#6a3fa0; --api-bg:#efe6f8; --db:#a14a00; --db-bg:#fdebd9; --cfg:#33695d; --cfg-bg:#e1f1ec;
  --e1:#0e6e7e; --e2:#8a3d7a; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1a1d; --surface:#16262b; --surface2:#1c3036; --line:#2c444b; --text:#e6f0ef; --muted:#9db2b0; --primary:#38b6c7; --primary-ink:#06242a; --navy:#9fc3e6;
  --hi:#ff8f87; --hi-bg:#3d1e1c; --md:#f2c36b; --md-bg:#3a2e12; --lo:#8fd18f; --lo-bg:#1d3320;
  --fe:#8dbcf0; --fe-bg:#17314f; --api:#c4a2ee; --api-bg:#2b2040; --db:#f0a566; --db-bg:#40260f; --cfg:#8fd3c3; --cfg-bg:#173a33; --e1:#58c7d8; --e2:#d79cc9;}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header.top{background:var(--navy);color:#fff;padding:18px 24px 12px}
@media (prefers-color-scheme:dark){header.top{background:#12303a;color:#e6f0ef}}
header.top h1{margin:0;font-size:22px;letter-spacing:.2px}
header.top p{margin:4px 0 0;opacity:.85;font-size:13px;max-width:1100px;overflow-wrap:anywhere}
main p,main td,main .chg,main .pt{overflow-wrap:anywhere}
nav.tabs{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;padding:0 12px;scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;border:0;background:none;color:var(--muted);padding:12px 12px 10px;font:600 13px system-ui;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button .n{display:inline-block;margin-inline-start:6px;padding:0 6px;border-radius:999px;background:var(--surface2);color:var(--muted);font-weight:700;font-size:11px}
nav.tabs button[aria-selected=true]{color:var(--primary);border-bottom-color:var(--primary)}
nav.tabs button:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
nav.tabs .sep{flex:0 0 1px;background:var(--line);margin:8px 6px}
main{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
h2{margin:6px 0 4px;font-size:20px} h3{margin:18px 0 8px;font-size:16px}
.sub{color:var(--muted);margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0 18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:26px;line-height:1.1} .kpi span{color:var(--muted);font-size:12px}
.kpi.ok b{color:var(--lo)}
table{border-collapse:collapse;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{background:var(--surface2);font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--surface2)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.High{background:var(--hi-bg);color:var(--hi)} .pill.Medium{background:var(--md-bg);color:var(--md)} .pill.Low{background:var(--lo-bg);color:var(--lo)}
.pill.eff{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.dec{background:#ddebf7;color:#1b4d7a} @media (prefers-color-scheme:dark){.pill.dec{background:#1b3550;color:#9fc7ee}}
.chip{display:inline-block;margin:1px 3px 1px 0;padding:0 7px;border-radius:6px;font:600 11.5px var(--mono);border:1px solid var(--line);background:var(--surface2);color:var(--text);text-decoration:none}
.chip.e1{border-color:var(--e1);color:var(--e1)} .chip.e2{border-color:var(--e2);color:var(--e2)}
a.chip{cursor:pointer} a.chip:hover{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.st{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:6px;white-space:nowrap}
.st.Done{background:#c6efce;color:#0c4b1a}.st.Partly{background:#ffeb9c;color:#5e4a00}.st.Not{background:#ffc7ce;color:#7a0b16}.st.Needs{background:#ddebf7;color:#1b4d7a}.st.Operational{background:#e4dfec;color:#43305e}.st.Cannot{background:#ededed;color:#444}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.bar input[type=search],.bar select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font:inherit;font-size:13.5px;min-width:180px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);padding:7px 12px;font:600 13px system-ui;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--primary);color:var(--primary-ink)}
.seg button:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.card>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card>summary::-webkit-details-marker{display:none}
.card>summary:before{content:"▸";color:var(--muted);transition:transform .12s}
.card[open]>summary:before{transform:rotate(90deg)}
.card>summary:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.card .cid{font:700 12px var(--mono);color:var(--primary)}
.card .ttl{font-weight:700;flex:1 1 280px}
.card .body{padding:2px 16px 14px;border-top:1px solid var(--line)}
.card h4{margin:14px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.card ol,.card ul{margin:4px 0 4px 20px;padding:0}
.layers{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin-top:6px}
.layer{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.layer>b{display:block;padding:6px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.layer.fe>b{background:var(--fe-bg);color:var(--fe)} .layer.api>b{background:var(--api-bg);color:var(--api)} .layer.db>b{background:var(--db-bg);color:var(--db)} .layer.cfg>b{background:var(--cfg-bg);color:var(--cfg)}
.layer .f{padding:7px 10px;border-top:1px solid var(--line)} .layer .none{padding:7px 10px;color:var(--muted);font-size:12.5px}
.path{font:12px var(--mono);word-break:break-all}
.kind{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;padding:0 5px;border-radius:4px;margin-inline-end:5px;vertical-align:1px}
.kind.modify{background:var(--surface2);color:var(--muted)} .kind.new{background:var(--lo-bg);color:var(--lo)} .kind.delete{background:var(--hi-bg);color:var(--hi)}
.app{font-size:11.5px;color:var(--muted)}
.chg{font-size:13px;margin-top:2px}
.decbox{border-inline-start:4px solid #3b82c4;background:var(--surface2);padding:8px 12px;border-radius:6px;margin:8px 0}
.pts{margin-top:6px} .pt{display:grid;grid-template-columns:auto auto 1fr;gap:8px;align-items:start;padding:6px 0;border-top:1px dashed var(--line);font-size:13px}
.pt:first-child{border-top:0} .pt .t{color:var(--text)} .pt .g{color:var(--muted);font-size:12px}
.mut{color:var(--muted)} .small{font-size:12.5px}
.wave{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
.wave b{font-size:14px}
details.fold>summary{cursor:pointer;color:var(--primary);font-weight:600;margin:6px 0}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--muted);margin:8px 0}
.banner{border-radius:12px;padding:12px 16px;margin:10px 0;font-weight:600}
.banner.ok{background:var(--lo-bg);color:var(--lo)} .banner.bad{background:var(--hi-bg);color:var(--hi)}
.hide{display:none!important}
@media print{nav.tabs,.bar{display:none} .panel{display:block!important;page-break-before:always} details.card>*{display:block} header.top{background:#fff;color:#000}}
@media (max-width:640px){main{padding:12px 10px 50px} .layers{grid-template-columns:1fr} th,td{padding:6px}}
</style>
</head>
<body>

<script>
const DATA = {"generated": "2026-10-03", "modules": [{"key": "AUTH", "name": "Authentication, Accounts and Sessions", "summary": "Sign-in, lockout, change-password and TOTP MFA exist, but MFA is opt-in and absent from the Doctor app, patient sign-up never sends or checks a phone code (yet the screen says it does), forgot-password and phone-number change are not delivered, and the login error wording leaks which numbers are registered. Two admin defects block or confuse user management: Add User always fails on 'Status is required', and the accessibility grid edits a different field from the one it displays. The approach is to fix the broken admin items first, then close the security gaps (login messages, configurable lockout with per-attempt logging, mandatory MFA by role, recovery codes, idle timeout and session lifetime), then build the OTP-based flows (registration verification, forgot password, phone change) which wait on the SMS provider go-live (NOTIF module), and finish with wording and label changes.", "corrections": [{"id": "AUTH-01", "title": "Fix Add User failing with 'The Status Field is required'", "problem": "Administration > Users: adding a new user returns HTTP 400 'Status is required' because the generated validator demands Status while the form (correctly) does not ask for it.", "correction": ["Remove the Status-required check from the create path of the UserAccount validator (status is set by the stored procedure/state machine) or default the DTO Status to 'Active' on create only.", "Make the same fix in the generator template (create-ignores-status rule) so the generated file is not overwritten on the next generation.", "Confirm the create SP stores status Active (or Pending) and that AuthUserList.vue Add User saves and shows the new row."], "refs": ["AM-139"], "related_refs": [], "files": {"frontend": [{"path": "atlas/generator/preview/Applications/AfdWeb/src/views/auth/AuthUserList.vue", "kind": "modify", "app": "Web console", "change": "Only if the validator is not changed: send status 'Active' in the create body; otherwise no change except retesting the create dialog."}], "api": [{"path": "atlas/generator/preview/Api/AfdIdentity/generated/ValidationRules/UserAccountRules.Generated.cs", "kind": "modify", "app": "AfdIdentity", "change": "Drop the 'Status is required' check (line ~28) from the create validation (or accept a default); mirror in the generator template."}, {"path": "atlas/generator/preview/Api/AfdIdentity/UserAccountController.Custom.cs", "kind": "modify", "app": "AfdIdentity", "change": "If a hand override is preferred to editing generated code, default dto.Status to 'Active' before UserAccountRules.IsValid in Create."}], "database": [], "config_content": []}, "non_code": ["Generator rule owner to apply the template-level fix (see memory note generator-rules-to-fix)."], "decision_needed": "", "depends_on": [], "effort": "S", "priority": "High", "verify": ["Administration > Users > Add User with valid data saves with no 'Status' error and the user appears in the list as Active.", "Sending an invalid status value on create is still rejected; edit and set-status of existing users still work."], "order": 1, "module": "AUTH"}, {"id": "AUTH-02", "title": "Fix User Accessibility Settings so language and font save and display correctly", "problem": "In Administration > User settings the language column stays 'en' after choosing Arabic because the dialog edits 'Fallback language' while the grid shows languageCode; the font (text size) does not appear to change.", "correction": ["Add a Language selector bound to languageCode to the edit dialog and show Fallback language as its own column.", "Confirm SP_AccessibilityPreference_Upsert persists both language_code and preferred_fallback and the list returns them.", "Show text size as a clear label (percentage) and agree with the client whether 'font' means size or typeface; relabel the column accordingly."], "refs": ["AM-138"], "related_refs": [], "files": {"frontend": [{"path": "atlas/generator/preview/Applications/AfdWeb/src/views/i18n/I18nAccessibility.vue", "kind": "modify", "app": "Web console", "change": "Add languageCode select to the edit dialog (DEFAULTS/openEdit), add a separate Fallback column, keep scaleLabel() for text size and rename the column header to 'Text size'."}], "api": [], "database": [{"path": "atlas/generator/preview/Api/AfdAdmin/Database/Procedures/I18N.sql", "kind": "modify", "app": "Stored procedure", "change": "Check SP_AccessibilityPreference_Upsert writes p_language_code and p_preferred_fallback on update (not only insert); fix if one is ignored."}], "config_content": [{"path": "Applications/shared/i18n/locales (I18N-ACCESSIBILITY keys)", "kind": "modify", "app": "Shared", "change": "New label keys for Language, Fallback language and Text size in en/ar/ku (translation content owned by L10N; request via that module)."}]}, "non_code": ["Confirm with the client whether 'font' means text size (current) or a typeface choice."], "decision_needed": "Whether 'font' means text size or typeface; if typeface, a new column and picker are needed.", "depends_on": [], "effort": "S", "priority": "Medium", "verify": ["Edit a user, choose Arabic as language, save: the grid shows 'ar'.", "Change text size and fallback: both values display correctly after save and reload."], "order": 2, "module": "AUTH"}, {"id": "AUTH-03", "title": "Make login errors non-enumerating (decide attempts-left vs generic message)", "problem": "Login says 'Incorrect mobile number or password' for unknown numbers but 'Incorrect password. You have N attempt(s) left' for known ones, so a prober can confirm which numbers are registered.", "correction": ["Obtain the policy decision. Option A (recommended): one generic message for unknown number, wrong password and locked account, with a generic 'try later or contact support' hint.", "Option B: keep attempts-left and locked wording as a deliberate usability trade-off, but add per-IP/number rate limiting so enumeration is throttled.", "For option A change the message branches in SP_UserAccount_VerifyLogin (lines ~196-208) and the lockout message, keeping the audit and AccountLocked alert unchanged.", "Confirm all three apps show the message once, in one place."], "refs": ["PA-OS-03"], "related_refs": ["PA-OS-02"], "files": {"frontend": [{"path": "atlas/generator/preview/Applications/AfdPatient/src/views/auth/AuthLogin.vue", "kind": "modify", "app": "Patient app", "change": "Adjust refuse() so no code-specific wording is derived from the response; show the generic text (option A)."}, {"path": "atlas/generator/preview/Applications/AfdDoctor/src/views/auth/AuthLogin.vue", "kind": "modify", "app": "Doctor app", "change": "Same generic-message handling as the patient app."}, {"path": "atlas/generator/preview/Applications/AfdWeb/src/views/auth/AuthLogin.vue", "kind": "modify", "app": "Web console", "change": "Same generic-message handling."}], "api": [], "database": [{"path": "Api/Database/Procedures.Custom/AUTH.sql", "kind": "modify", "app": "Stored procedure", "change": "SP_UserAccount_VerifyLogin: return the same message for unknown number, wrong password and locked (option A); keep signature identical."}, {"path": "Api/Database/Deploy/hotfix_login_generic_message.sql", "kind": "new", "app": "Hotfix", "change": "Live hotfix carrying the replaced SP_UserAccount_VerifyLogin body (same signature) for deployment without a full re-apply."}], "config_content": []}, "non_code": ["Record the client decision (generic message vs attempts-left) in the security policy."], "decision_needed": "Generic message for all failures (safer) or keep 'attempts left' for usability.", "depends_on": [], "effort": "S", "priority": "High", "verify": ["Unknown number and known number with wrong password return identical text and HTTP status.", "Message appears once on the login screen of each app.", "Lockout still occurs after the configured failures and is still audited."], "order": 3, "module": "AUTH"}, {"id": "AUTH-04", "title": "Configurable lockout threshold/duration and per-attempt failed-login logging", "problem": "After 5 wrong passwords the account locks for 30 minutes, but both numbers are hard-coded and single failed attempts are not written to the security log.", "correction": ["Create a small policy table (or system settings rows) for max_failed_attempts and lock_minutes, defaulting to 5 and 30.", "Read the policy in SP_UserAccount_VerifyLogin, SP_UserAccount_ResetPassword (the OTP reset throttle) so both share it.", "Write a rate-limited audit/security-log row for each failed attempt on a known account (and a coarse row for unknown numbers).", "Show the policy values read-only (or editable for SYSADM) in the Web console and confirm the corrected AUTH.sql is applied live."], "refs": ["PA-OS-02"], "related_refs": ["PA-OS-03"], "files": {"frontend": [], "api": [], "database": [{"path": "Api/Database/Procedures.Custom/AUTH.sql", "kind": "modify", "app": "Stored procedure", "change": "Replace c_max_attempts constants (lines ~38 and ~331) with a lookup of the policy; add the per-attempt audit write via the existing audit procedure; same signatures."}, {"path": "Api/Database/CareGate (next free number, e.g. 037_auth_lockout_policy.sql)", "kind": "new", "app": "Table / migration", "change": "Create the auth_policy table (key, value, updated_by, updated_at) seeded with max_failed_attempts=5 and lock_minutes=30."}, {"path": "Api/Database/Deploy/hotfix_auth_lockout_policy.sql", "kind": "new", "app": "Hotfix", "change": "Live hotfix applying the policy table and the updated SPs."}], "config_content": [{"path": "auth_policy seed rows", "kind": "new", "app": "Shared", "change": "Seed values max_failed_attempts=5, lock_minutes=30, failed_attempt_audit=true."}]}, "non_code": ["Operations to deploy AUTH.sql and the hotfix to the live database and confirm."], "decision_needed": "", "depends_on": ["SEC audit-log procedure conventions (SEC owns audit procedures)"], "effort": "S", "priority": "High", "verify": ["Set the threshold to 3 in the policy table: the account locks after 3 failures with no redeploy.", "Each failed attempt on a known account creates a security-log row (rate-limited); the lock event still raises an AccountLocked alert."], "order": 4, "module": "AUTH"}, {"id": "AUTH-05", "title": "Mandatory MFA for clinical and privileged roles, including Doctor app login", "problem": "TOTP MFA exists but is optional (applies only after a user enrols) and the Doctor app login has no MFA step or enrolment screen; clients asked for MFA mandatory for privileged and clinical roles.", "correction": ["Obtain the decision on mandatory roles (proposed DOC, CNS, ADM, MGR, SYSADM) and any grace period.", "Add a role-based mandatory flag: in sp_authsession_open raise MFA_ENROL_REQUIRED for those roles when not enrolled, and issue only a limited session that can reach the enrol endpoints.", "Add MfaService, the MFA code step in login, and an enrolment screen (QR/secret, confirm code) to the Doctor app, copying the Web console implementation.", "In the Web console login redirect to MfaEnrol when MFA_ENROL_REQUIRED is returned.", "Keep the patient app out of scope unless the client asks (patients optional)."], "refs": ["DR-CR-09", "GN-NI-10"], "related_refs": ["ROL-11"], "files": {"frontend": [{"path": "atlas/generator/preview/Applications/AfdDoctor/src/views/auth/AuthLogin.vue", "kind": "modify", "app": "Doctor app", "change": "Add the MFA challenge step (code entry, error handling) and redirect to enrolment on MFA_ENROL_REQUIRED, mirroring AfdWeb AuthLogin.vue (isMfaRequired, submitMfa)."}, {"path": "atlas/generator/preview/Applications/AfdDoctor/src/views/auth/MfaEnrol.vue", "kind": "new", "app": "Doctor app", "change": "Enrolment screen using enrol-begin / enrol-confirm, copied from the Web console MfaEnrol.vue."}, {"path": "atlas/generator/preview/Applications/AfdDoctor/src/modules/auth/services/mfaService.ts" ered_via (app, staff/clinic, centre, field worker, assisted) set automatically by sp_useraccount_selfregister ('app') and sp_patient_register.", "Label MRN as Beneficiary ID and confirm whether the client wants a globally unique or custom format.", "Show facility name as Service Center and created_by as a name in patient and referral grids and exports; map Suspended to On Hold and add Closed for display and export.", "Add staff-only admin_notes on patient and referral (referral change is coordinated with REF)."], "refs": ["REG-28", "MF-46", "MF-47", "MF-48", "MF-50", "MF-51"], "related_refs": ["REF", "ADMUX"], "files": {"frontend": [{"path": "atlas/generator/preview/Applications/AfdWeb/src/views/pat/PatSearch.vue", "kind": "modify", "app": "Web console", "change": "Columns: Beneficiary ID, Service Center, Registered By, Registration channel, status label (On Hold/Closed); admin notes in edit dialog for staff."}, {"path": "atlas/generator/preview/Applications/AfdWeb/src/views/pat/PatProfile.vue", "kind": "modify", "app": "Web console", "change": "Show registered-by, channel and admin notes (staff only)."}], "api": [{"path": "atlas/generator/preview/Api/AfdClinical/PatientDAL.Custom.cs", "kind": "modify", "app": "AfdClinical", "change": "Pass registered_via and admin_notes parameters."}], "database": [{"path": "Api/Database/Procedures.Custom/PAT.sql", "kind": "modify", "app": "Stored procedure", "change": "sp_patient_register sets registered_via; sp_patient_search joins facility name and creator name; sp_patient_update accepts admin_notes."}, {"path": "Api/Database/CareGate/010_auth_selfregister.sql", "kind": "modify", "app": "Stored procedure", "change": "sp_useraccount_selfregister sets registered_via = 'app'."}, {"path": "Api/Database/CareGate/_apply_all.sql", "kind": "modify", "app": "Table / migration", "change": "Next free migration: patient.registered_via, patient.admin_notes; display-name mapping for statuses."}], "config_content": [{"path": "Applications/shar i": [], "database": [], "config_content": []}, "non_code": ["Retest on a device with a patient and a doctor login and report any remaining failure with the request status."], "decision_needed": "", "depends_on": [], "effort": "S", "priority": "Medium", "verify": ["Fill the profile, log out, log in: all fields are still shown.", "Each 360 button opens the right page for doctor, counsellor and admin.", "A blank field is never shown silently when the load fails."], "order": 15, "module": "REG"}, {"id": "REG-16", "title": "Decide how disease/symptom 'Condition' is captured at registration", "problem": "The client reports an unclear 'Condition' field on registration with options for symptoms, diseases and vital signs; no such field exists in the current form, and symptoms are captured in the symptom-intake (triage) flow.", "correction": ["Confirm with the client that the note refers to an older build and that symptoms stay in triage intake.", "If registration must capture a condition, add a field group fed by master data (symptoms, diseases, vitals) with a free-text 'other' box.", "If not, record the answer and close the point."], "refs": ["AM-079"], "related_refs": ["REG-05"], "files": {"frontend": [{"path": "atlas/generator/preview/Applications/AfdWeb/src/views/pat/PatRegister.vue", "kind": "modify", "app": "Web console", "change": "Only if the client wants it: add a master-data condition selector with a free-text other box."}], "api": [], "database": [], "config_content": []}, "non_code": ["Show the client the current registration form and the triage intake to confirm the field no longer exists."], "decision_needed": "Whether registration should capture a condition/symptom list at all, and the lists to use.", "depends_on": [], "effort": "S", "priority": "Low", "verify": ["Client confirms the current form has no unclear Condition field.", "If added, selecting a condition stores a master-data id and the free text."], "order": 16, "module": "REG"}], "rows": ["REG-02", "REG-05", "REG-06", "REG-07", "REG-08", "REG-09", "REG-10", "REG-12", "REG-13", "REG-15", "REG-16", "REG-17", "REG-19", "REG-20", "REG-21", "REG-22", "REG-28", "SCN-01-S03", "SCN-01-S07", "SCN-01-S08", "PA-OS-01", "PA-OS-09", "PA-OS-10", "PA-OS-11", "PA-NI-01", "PA-NI-12", "PA-NI-25", "PA-CR-06", "PA-CR-07", "DR-OS-05", "AM-065", "AM-066", "AM-067", "AM-069", "AM-077", "AM-078", "AM-079", "AM-080", "AM-081", "AM-082", "AM-083", "AM-084", "MF-01", "MF-03", "MF-04", "MF-05", "MF-06", "MF-08", "MF-09", "MF-10", "MF-11", "MF-12", "MF-13", "MF-14", "MF-15", "MF-46", "MF-47", "MF-48", "MF-50", "MF-51"]}, {"key": "MIN", "name": "Minors, Guardians and Consent", "summary": "The minor, guardian and consent backbone exists (DOB-derived patient_type, guardian and guardian_verification tables, per-purpose consent ledger, assent_record, age-transition sweep, Protected safeguarding) but most of it is not reachable or enforced: no screen calls guardian verify, assent or grant-behalf; DOB is optional so the minor journey can be bypassed; the age sweep has no scheduler; consent is never re-asked at 18; and the doctor app shows nothing about minors. The approach is to first fix the unambiguous gaps (mandatory DOB, minor needs guardian, verification and consent staff screens, scheduled sweep with consent supersession, doctor minor banner), drive the thresholds from a configurable minor policy, and park the real policy choices (guardian ID gate, assent age, adolescent confidentiality, guardian visibility) as explicit decision items with a build path per answer.", "corrections": [{"id": "MIN-01", "title": "Make date of birth mandatory and block the adult-journey bypass for minors", "problem": "Clients require that an ordinary user cannot bypass the minor journey, but DOB is optional at self-registration and a blank or false DOB creates an Adult (sp_patient_agejourney treats unknown DOB as Adult). A Minor can also be created with no guardian (merges MIN-01, PA-NI-07 and SCN-02-S02).", "corr utes per level in a configuration table (admin-editable) read by setrisk.", "Show owner, due date, overdue state and the review-required label in the web queues and doctor MhpssEscalate screen."], "refs": ["DR-CR-15", "DR-NI-08", "SCN-04-S07"], "related_refs": ["SCN-04-S10", "SCN-03-S12", "ROL-05"], "files": {"frontend": [{"path": "atlas/generator/preview/Applications/AfdWeb/src/views/mhpss/MhpssEscalationQueue.vue", "kind": "modify", "app": "Web console", "change": "Add owner, due date, overdue badge, 'Safeguarding review required' status label and Acknowledge/Assign/Set follow-up actions."}, {"path": "atlas/generator/preview/Applications/AfdWeb/src/views/admn/AdmnSafeguardingQueue.vue", "kind": "modify", "app": "Web console", "change": "Same owner/SLA/ack columns and actions for the admin safeguarding queue."}, {"path": "atlas/generator/preview/Applications/AfdWeb/src/views/mhpss/MhpssEscalationJourney.vue", "kind": "modify", "app": "Web console", "change": "Show the escalation timeline: raised, acknowledged, in progress, closed with owner and due date."}, {"path": "atlas/generator/preview/Applications/AfdWeb/src/modules/mhpss/services/safeguardingEscalationService.ts", "kind": "modify", "app": "Web console", "change": "Add acknowledge, assign and setFollowUp calls."}, {"path": "atlas/generator/preview/Applications/AfdDoctor/src/views/mhpss/MhpssEscalate.vue", "kind": "modify", "app": "Doctor app", "change": "Show status, owner and due date after raising; remove assumption that the escalation ends at raise."}], "api": [{"path": "atlas/generator/preview/Api/AfdClinical/MhpssSessionController.Custom.cs", "kind": "modify", "app": "AfdClinical", "change": "Add acknowledge/assign/follow-up endpoints for escalations with role guard (safeguarding role, see MHPSS-04)."}, {"path": "atlas/generator/preview/Api/AfdClinical/MhpssAbandonSweepWorker.cs", "kind": "modify", "app": "AfdClinical", "change": "Neighbouring background worker: add (or copy into a new worker) the overdu d": "modify", "app": "Hotfix", "change": "Neighbouring hotfix: add a new hotfix for the sweep extension; find the age transition sweep (see hotfix_agetransition_sweep_dob.sql in Api/Database/Deploy) and add a safeguarding_escalation raise for Protected/MHPSS history patients."}], "config_content": []}, "non_code": ["Clinical and legal lead to approve the post-18 policy."], "decision_needed": "What happens to Protected status and historical psychosocial data when a patient turns 18, and what the adult may see.", "depends_on": ["MHPSS-04"], "effort": "M", "priority": "Medium", "verify": ["A patient turning 18 with Protected status generates a safeguarding review task.", "After review, the adult can log in and their historical psychosocial records follow the approved visibility."], "order": 16, "module": "MHPSS"}, {"id": "MHPSS-17", "title": "Confirm safeguarding SQL and hotfixes are applied on the live database", "problem": "Reviewers could not confirm that the minor-safeguarding, C-04/C-05/D-02 notification and C-10 call-back scripts are applied live, and escalations have not been seen in use.", "correction": ["Compare the live DB against CareGate/019, Procedures.Custom/NOTIF.sql, MHPSS.sql and the Deploy hotfixes and apply what is missing.", "Run one end-to-end test: minor, Protected, guardian override, notification suppression, escalation raised and closed.", "Record the audit evidence for the client."], "refs": [], "related_refs": ["PA-CR-10", "PA-NI-21", "PA-NI-30"], "files": {"frontend": [], "api": [], "database": [{"path": "atlas/generator/preview/Api/Database/Deploy/apply_hotfix.py", "kind": "modify", "app": "Hotfix", "change": "Use the existing script to apply the safeguarding hotfixes; no code change expected."}], "config_content": []}, "non_code": ["DBA applies and checks scripts on the live DB; capture screenshots for the client."], "decision_needed": "", "depends_on": [], "effort": "S", "priority": "Medium", "verify": ["Query on live DB shows the expected ed and shown in the slot lists.", "correction": ["In sp_appointment_book resolve the clinician (from the slot or p_clinician_id) and refuse the booking with a clear message when afd_admin.clinician.status is not Active/Verified (same rule as v_clinician_bookable), in BOTH CONS.sql and the ZZPAY.sql re-statement, keeping the identical 13-argument signature.", "In SP_AppointmentSlot_Search join afd_admin.clinician and return only slots of Active/Verified clinicians, so a patient never sees a slot that booking will refuse; reconcile the SMALL2.sql and SCHD.sql copies so only one definition and signature remains.", "Add the same status filter to the patient-visible clinician list (see SCHED-02) and keep the existing client-side filter as a second layer.", "Re-apply with apply_custom.py and confirm there is no stale overload left."], "refs": ["PA-OS-06"], "related_refs": ["DR-NI-01"], "files": {"frontend": [], "api": [], "database": [{"path": "Api/Database/Procedures.Custom/CONS.sql", "kind": "modify", "app": "Stored procedure", "change": "Last sp_appointment_book (~line 1128): after the slot lock, read afd_admin.clinician.status for v_clinician and RAISE EXCEPTION when not Active/Verified."}, {"path": "Api/Database/Procedures.Custom/ZZPAY.sql", "kind": "modify", "app": "Stored procedure", "change": "sp_appointment_book (~line 142, the prepay version applied last): add the identical clinician status check before the payment branch so the live body is gated."}, {"path": "Api/Database/Procedures.Custom/SMALL2.sql", "kind": "modify", "app": "Stored procedure", "change": "SP_AppointmentSlot_Search: join afd_admin.clinician, require status Active/Verified, and align with the SCHD.sql version (Open slots only, future only)."}, {"path": "Api/Database/Procedures.Custom/SCHD.sql", "kind": "modify", "app": "Stored procedure", "change": "SP_AppointmentSlot_Search: same clinician status filter; remove or keep in step with the SMALL2.sql duplicate so there is one live definition."}], "config_content": []}, "non_code": ["Check on the live DB that no Pending/Rejected clinician currently has future Open slots and no active appointments; close or reassign any found."], "decision_needed": "", "depends_on": [], "effort": "S", "priority": "High", "verify": ["Set a doctor to Pending: their slots disappear from Book and a direct call to sp_appointment_book with their slot id is refused.", "An Active doctor still books normally, including with the e-cash prepay flag on.", "Only one overload of sp_appointment_book and SP_AppointmentSlot_Search exists in the live database."], "order": 1, "module": "SCHED"}, {"id": "SCHED-02", "title": "Patient doctor search endpoint with next available slot and facility", "problem": "Search cards show rating but no availability (PA-OS-06), and DR-NI-01 asks for facility and availability to be taken into account; today the app downloads 500 clinicians and filters in the browser, with no facility or next-slot data.", "correction": ["Add a read procedure that returns bookable clinicians (status Active/Verified) with facility name, governorate, specialities, gender, languages, live rating and next_available_slot (earliest Open slot after now plus the facility min_notice_minutes), filterable by speciality, facility, governorate, gender, language, min rating and 'available within N days', paged on the server.", "Expose it as a new GET route on the clinician controller (PAT allowed, cross-facility like by-speciality) and add the method to the patient ClinicianService/store.", "In MstrDoctorSearch.vue switch load() to the new endpoint, show 'Next available: <date time>' (or 'No open times') on each card, and add Facility and 'Available this week' filters while keeping the existing gender, language, rating and saved filters.", "Show the same next-available line on MstrDoctorProfile.vue and keep the doctor-first deep link to /book?clinicianId=."], "refs": ["PA-OS-06", "DR-NI-01"], "related_refs": ["PA-NI-12", "SCN-01-S08", "REG-20"] es (the file already has a hand edit for governorateId)."}], "database": [{"path": "Api/Database/Procedures.Custom/SMALL2.sql", "kind": "modify", "app": "Stored procedure", "change": "SP_AppointmentSlot_Search: change WHERE s.facility_id = p_facility_id to (p_facility_id IS NULL OR ...) so a null facility searches all; confirm the live signature carries the governorate argument."}], "config_content": [{"path": "Applications/shared/i18n/locales/pat/en.json", "kind": "modify", "app": "Shared", "change": "Key SCHD-APPT-BOOK.anyLocation ('Any location - remote doctors') and hint text."}]}, "non_code": ["Client to say which services depend on geography (in-person visits, referrals to a facility) so they keep the governorate step."], "decision_needed": "Which services must keep a mandatory location; default proposal is in-person only.", "depends_on": ["SCHED-01"], "effort": "S", "priority": "Low", "verify": ["A patient with no governorate on file can pick 'Any location' and reach a doctor and time without choosing a governorate.", "Slots from other facilities appear for Video/Audio only, never in-person slots.", "Doctor-first booking still skips the region."], "order": 4, "module": "SCHED"}, {"id": "SCHED-05", "title": "Decide Book versus Find Doctor entry points on the patient home", "problem": "PA-CR-01: the home screen has separate Book and Find Doctor tiles that lead into the same booking flow; the client must say whether they should be merged into one Book journey with a 'choose doctor' step.", "correction": ["If MERGE: remove the Find Doctor quick action in PatHome.vue and the separate /doctors menu entry, and add a 'Choose a doctor' option inside SchdApptBook.vue (a first step offering 'By time/speciality' or 'Choose a doctor') that embeds the search of SCHED-02; keep /doctors as a redirect for old links and favourites.", "If KEEP: relabel the tiles ('Book an appointment' versus 'Browse doctors') with a one-line subtitle each so the difference is clear, and make the doctor profile Book button the only link from search into booking.", "Either way keep the referral and triage deep links (/book?clinicianId=, ?doctor=) working."], "refs": ["PA-CR-01"], "related_refs": ["PA-OS-17"], "files": {"frontend": [{"path": "atlas/generator/preview/Applications/AfdPatient/src/views/pat/PatHome.vue", "kind": "modify", "app": "Patient app", "change": "Quick actions (~lines 206-216): remove the Find Doctor tile (merge) or relabel both tiles with subtitles (keep)."}, {"path": "atlas/generator/preview/Applications/AfdPatient/src/views/schd/SchdApptBook.vue", "kind": "modify", "app": "Patient app", "change": "Merge only: add the 'choose a doctor' entry step before the governorate stage."}, {"path": "atlas/generator/preview/Applications/AfdPatient/src/core/menuRoutes.ts", "kind": "modify", "app": "Patient app", "change": "Merge only: drop or re-parent the '/doctors' menu entry under '/book' (file is generated: push the same change to afd_plan.db)."}, {"path": "atlas/generator/preview/Applications/AfdPatient/src/router/index.ts", "kind": "modify", "app": "Patient app", "change": "Merge only: turn the /doctors route into a redirect to /book with the doctor-choice step open."}], "api": [], "database": [], "config_content": [{"path": "Applications/shared/i18n/locales/pat/en.json", "kind": "modify", "app": "Shared", "change": "PAT-HOME.act.book / findDoctor labels and subtitles (keep option) or the new booking step title (merge option); Arabic and Kurdish under L10N."}]}, "non_code": ["Obtain the client's answer: one Book journey or two tiles."], "decision_needed": "Merge Find Doctor into the Book journey, or keep two entry tiles with clearer labels.", "depends_on": ["SCHED-02"], "effort": "S", "priority": "Low", "verify": ["Home shows exactly the entry points the client chose and each leads to the same booking wizard.", "A patient can book with a chosen doctor in no more taps than before.", "Old /doctors and ?clinicianId= links still work."], "order": 5, "module": "SCHED"}, {"id": "SCHED-06", "title": "Confirm active appointment reminders (24h/2h) and SMS delivery", "problem": "PA-NI-02: the reminder engine exists (reminder_rule, SP_Reminder_Tick, ReminderDispatchWorker) but nothing in the repo seeds active 24h/2h rules or Arabic/Kurdish/English generic templates, and live SMS delivery to Syrian networks is unproven.", "correction": ["Write an idempotent seed that creates, per facility, appointment.booked rules at -1440 and -120 minutes on InApp and SMS channels, with Active templates in ar/ku/en whose wording is generic (no doctor name, speciality or reason).", "Apply it on the live database, check Reminders:Enabled and TickMinutes in AfdConsult appsettings, and confirm the worker log shows ticks queuing notifications.", "Run an end-to-end test: book an appointment two hours ahead and confirm the SMS and in-app reminder arrive on a test number on each target network, in the patient's language.", "Optional: let the patient choose reminder timing (see decision)."], "refs": ["PA-NI-02"], "related_refs": [], "files": {"frontend": [{"path": "atlas/generator/preview/Applications/AfdPatient/src/views/pat/PatCommPreferences.vue", "kind": "modify", "app": "Patient app", "change": "Only if per-patient timing is approved: add a 'remind me' selector (24h / 2h / both / none) writing the preference; otherwise unchanged."}], "api": [], "database": [{"path": "Api/Database/Deploy/seed_appointment_reminders.sql", "kind": "new", "app": "Seed data", "change": "New file seed_appointment_reminders.sql: idempotent INSERT ... ON CONFLICT into afd_consult.reminder_rule (facility_id, event_key='appointment.booked', offset_minutes -1440/-120, channel, template_code) and afd_consult.notification_template (ar/ku/en generic text); follows the style of atlas/generator/preview/Api/Database/Deploy/seed_mhpss_notifications.sql."}, {"path": "Api/Database/Procedures.Custom/NOTIF.sql", "kind": "modify", "app": "Stored procedure", "change": "Only if per-patient timing is approved: SP_Reminder_Tick (~line 246) skips rules whose offset the patient opted out of; change owned by NOTIF."}], "config_content": [{"path": "Reminder rule and template rows (afd_consult.reminder_rule, notification_template)", "kind": "modify", "app": "Seed data", "change": "Review and approve the Arabic, Kurdish and English reminder wording with the client; admins can later edit timing in Notif Reminder Rules."}]}, "non_code": ["Operations: verify Twilio (or the chosen Syrian SMS route) delivers to Syriatel and MTN numbers and that sender ID is accepted.", "Client to approve the generic reminder wording in three languages.", "Check the live DB for existing reminder_rule rows before seeding."], "decision_needed": "Whether patients may choose their own reminder timing (otherwise fixed 24h and 2h admin rules).", "depends_on": ["NOTIF SMS provider/deliverability confirmation"], "effort": "S", "priority": "Medium", "verify": ["After booking, notification_log shows a queued then Delivered reminder at -24h and -2h in the patient's language.", "Reminder text on the lock screen contains no doctor, speciality or medical detail.", "A cancelled or rescheduled appointment gets no stale reminder."], "order": 6, "module": "SCHED"}], "rows": ["PA-OS-06", "PA-OS-07", "PA-NI-02", "PA-CR-01", "DR-NI-01"]}, {"key": "CONS", "name": "Consultations, Video Calls and Recording", "summary": "The call screens expose a browser-only 'Rec' button with no consent, policy, server storage or retention, and the patient profile heading 'Record controls' confuses clients. Care-team (second doctor) support exists but patient consent is ticked by the inviting doctor and only voice, not video, is multi-party. Messaging works two-way but has no Sent view or read state, and the Call Quality report is only a call log because quality samples are captured by the web room alone and never shown. Approach: switch recording off now behind a flag and build consent-gated server recording only if the client approves; move consent to the patient; add sent/read state and audit; capture quality and drop events from the doctor and patient call screens and surface them in the report.", "corrections": [{"id": "CONS-01", "title": "Switch off the in-call Rec button and the Enable recording action until policy is approved", "problem": "Doctor and patient call screens show a Rec button that records the call in the browser and saves a .webm on the device of whoever presses it, with no consent, storage, retention or access rule. The clients asked whether recording exists and what governs it (also 'Record controls' buttons do not work).", "correction": ["Gate the Rec button in both ConsRoom screens behind a new feature flag 'call_recording' that is OFF by default (fail-closed, unlike video_calls which is fail-open).", "Make toggleRecording in useFirebaseCall refuse to start unless the flag is on and the server says recording is enabled for this consultation and not an MHPSS/GBV session.", "Remove the 'Enable recording' action from the patient ConsHistory sheet (the API allows ADM only, so it is a dead action for patients).", "Record the client decision (allowed or not) and, if not allowed, delete the recording code path and the enable-recording endpoint use; if allowed, continue with CONS-02."], "refs": ["DR-CR-07", "PA-CR-04", "PA-OS-16"], "related_refs": ["REG-27", "REG-24"], "files": {"frontend": [{"path": "Applications/shared/composables/useFirebaseCall.ts", "kind": "modify", "app": "Shared", "change": "In toggleRecording / startRecording (~275-365) add a guard that returns without recording when the call_recording flag is off or recording is not authorised; expose canRecord as a computed."}, {"path": "atlas/generator/preview/Applications/AfdDoctor/src/views/cons/ConsRoom.vue", "kind": "modify", "app": "Doctor app", "change": "Show the Rec button (line ~180) only when call.canRecord is true; update the header comment that says recording composites to a down ause the prescription insert never sets created_at (column nullable, no default). New and existing prescriptions show a dash.", "correction": ["Set created_at and created_by in the INSERT of SP_Prescription_Upsert (the later definition in ZFIXES.sql wins) and set created_at/created_by on prescription_line inserts in SP_Prescription_SetLines.", "Add a DEFAULT now() on prescription.created_at and prescription_line.created_at in a migration so any other insert path is covered.", "Backfill NULL created_at from issued_at, else the consultation start, else the earliest audit/updated time.", "Confirm the Created column in Pat360 (Web) and the doctor and patient prescription lists read the same field."], "refs": ["AM-072"], "related_refs": [], "files": {"frontend": [{"path": "atlas/generator/preview/Applications/AfdWeb/src/views/pat/Pat360.vue", "kind": "modify", "app": "Web console", "change": "Created column (createdAt, around line 552) needs no logic change; add a fallback to issuedAt for any row still NULL after backfill."}], "api": [], "database": [{"path": "Api/Database/Procedures.Custom/ZFIXES.sql", "kind": "modify", "app": "Stored procedure", "change": "SP_Prescription_Upsert (second definition, ~line 311): add created_at=now(), created_by=p_actor_id to the INSERT column list; keep the same signature."}, {"path": "Api/Database/CareGate/037_prescription_created_at.sql", "kind": "new", "app": "Table / migration", "change": "Next free number: ALTER prescription and prescription_line SET DEFAULT now() on created_at; UPDATE ... SET created_at = COALESCE(issued_at, updated_at, now()) WHERE created_at IS NULL."}], "config_content": []}, "non_code": ["Run the migration on the live DB and confirm existing prescriptions now show dates."], "decision_needed": "", "depends_on": [], "effort": "S", "priority": "Medium", "verify": ["Create a new prescription in Patient 360: the Created column shows the date and time.", "Open an old prescription: Created is no longer blank.", "A prescription created from the doctor app has created_at set."], "order": 1, "module": "EMR"}, {"id": "EMR-02", "title": "Lock diagnoses and issued prescriptions once the note is signed or issued", "problem": "A signed case sheet is frozen, but diagnoses can still be added, removed or re-statused after signing, and prescription lines can be changed after the prescription is Issued. The client requires the original to stay unchanged and any amendment to carry reason, user and time.", "correction": ["Add a guard to SP_Diagnosis_Add, SP_Diagnosis_Remove and SP_Diagnosis_SetStatus that refuses changes when the linked case sheet is Signed or Amended (message: use an addendum).", "Block SP_Prescription_Upsert and SP_Prescription_SetLines when status is not Draft; changes require Cancel then re-issue (reason already enforced by SP_Prescription_Cancel).", "Confirm audit rows are written for addenda (sp_casesheet_addaddendum), cancel and re-issue; add them to audit_coverage if missing.", "Show a clear locked state and an Add addendum / Cancel and reissue action in EmrDiagnosis, EmrProblemList and RxEditor instead of an editable form."], "refs": ["PA-NI-16"], "related_refs": ["DR-CR-12"], "files": {"frontend": [{"path": "atlas/generator/preview/Applications/AfdDoctor/src/views/emr/EmrDiagnosis.vue", "kind": "modify", "app": "Doctor app", "change": "Disable add/remove/status controls when the case sheet is Signed or Amended and show the locked message and addendum link."}, {"path": "atlas/generator/preview/Applications/AfdDoctor/src/views/rx/RxEditor.vue", "kind": "modify", "app": "Doctor app", "change": "Make an Issued prescription read-only; show Cancel and reissue instead of Save."}, {"path": "atlas/generator/preview/Applications/AfdWeb/src/views/pat/Pat360.vue", "kind": "modify", "app": "Web console", "change": "Prescription dialog Edit (lines ~680) only for Draft prescriptions; humanise the server lock error."}], "api": [{"path": "atlas/generator/preview/Api/AfdClinical/generated/Controllers/DiagnosisController.cs", "kind": "modify", "app": "AfdClinical", "change": "Surface the lock refusal as HTTP 409 with the message instead of a blank 500."}], "database": [{"path": "Api/Database/Procedures.Custom/EMR.sql", "kind": "modify", "app": "Stored procedure", "change": "SP_Diagnosis_Add / SP_Diagnosis_Remove / SP_Diagnosis_SetStatus: look up case_sheet by consultation and raise when status IN ('Signed','Amended'); keep signatures."}, {"path": "Api/Database/Procedures.Custom/ZFIXES.sql", "kind": "modify", "app": "Stored procedure", "change": "SP_Prescription_Upsert and SP_Prescription_SetLines (generated in AfdClinical RX.sql): raise when prescription status <> 'Draft'; override SetLines here with the same signature."}], "config_content": []}, "non_code": ["Clinical sign-off that Cancel and reissue is the amendment route for prescriptions."], "decision_needed": "", "depends_on": [], "effort": "M", "priority": "High", "verify": ["Sign a case sheet, then try to add or remove a diagnosis: refused with an addendum message.", "Issue a prescription then edit a line: refused; cancel with reason and reissue works.", "Audit log shows the addendum with reason, user and time."], "order": 2, "module": "EMR"}, {"id": "EMR-03", "title": "Consultation end locks the note: require signing or auto-lock", "problem": "Ending a consultation does not lock the case sheet; locking depends on the doctor choosing to sign, so a Draft can stay editable indefinitely.", "correction": ["On SP_Consultation_End, refuse or auto-sign: either require a signed case sheet or call the sign logic for the clinician's draft.", "Add a scheduled sweep that auto-locks Drafts older than the agreed window (for example 24 hours after the consultation end) with a system-signed marker.", "In the doctor End Consultation flow, prompt to review and sign the note before ending, and show the lock status afterwards."], "refs": ["DR-CR-12"], "related_refs": ["PA-NI-16"], "files": {"frontend": [{"pat  facility, patient and referrer are raw number boxes. Managers are not permitted to create at all.", "correction": ["Make consultation optional in sp_referral_create (the column is already nullable and the view LEFT JOINs it): remove the consultation_id guard but keep the signature so no overload is orphaned; the doctor flow keeps passing the consultation.", "In the Create action take FacilityId from the token (Facility()) instead of the body, and take ReferredById from the caller's clinician claim; for an ADM without a clinician record show a required referring-clinician picker.", "Rebuild the dialog in RefList.vue: hide facility and referrer, use a patient search picker (patient search endpoint), a facility picker for the receiving facility, a Referral type dropdown, labelled Reason and Urgency fields, and show server error text in the dialog.", "Hide the Add button for MGR (create stays ADM,CNS,DOC,HW) with a canCreate check on auth.roleCode.", "Fix the console/Kurdish/Arabic labels for every field (no raw field names such as facilityId)."], "refs": ["AM-054", "AM-059", "AM-058"], "related_refs": ["MF-34", "MF-35", "MF-36", "MF-37"], "files": {"frontend": [{"path": "atlas/generator/preview/Applications/AfdWeb/src/views/ref/RefList.vue", "kind": "modify", "app": "Web console", "change": "Rework the create dialog and confirmCreate(): drop facilityId/referredById inputs, add patient picker (PatientService.search), receiving-facility picker, labelled fields, canCreate gate for MGR, and surface the real server error."}, {"path": "atlas/generator/preview/Applications/AfdWeb/src/modules/ref/services/referralService.ts", "kind": "modify", "app": "Web console", "change": "No path change; confirm create() payload no longer needs facilityId (generated file, so adjust via the generator plan if the signature changes)."}], "api": [{"path": "atlas/generator/preview/Api/AfdAdmin/generated/Controllers/ReferralController.cs", "kind": "modify", "app": "AfdAdmin", "change": "In Crea ion": "Detailed registration requirements", "out": true, "mod": "REG", "sec": ["MSTR"], "corr": ["REG-07"], "chg": "Add a required governorate select to both flows; confirm the master list holds the 14 approved governorates.", "gap": "Mandatory rule not enforced; missing from self-registration; list content unverified."}, "REG-16": {"ref": "REG-16", "src": 1, "status": "Not done", "pri": "Low", "screen": "Location / District / sub-district", "text": "Requirement: Recommended. Notes: Collected only at the level of precision needed for referral or service access.", "section": "Detailed registration requirements", "out": true, "mod": "REG", "sec": ["MSTR"], "corr": ["REG-13"], "chg": "Add district master and optional field if needed for referral or service access.", "gap": "Absent."}, "REG-17": {"ref": "REG-17", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Location / Detailed address", "text": "Requirement: Avoided unless necessary. Notes: Not collected unnecessarily; a precise location may create a safeguarding risk.", "section": "Detailed registration requirements", "out": true, "mod": "REG", "sec": ["MHPSS"], "corr": ["REG-13"], "chg": "Hide or de-emphasise address by default, add guidance text, and restrict visibility for sensitive/safeguarding patients.", "gap": "Free-text address is on the form with no minimisation or safeguarding guidance."}, "REG-18": {"ref": "REG-18", "src": 1, "status": "Done", "pri": "-", "screen": "Service / Preferred language", "text": "Requirement: Mandatory. Notes: Arabic in addition to the other approved service languages; the user interface should follow the selection.", "section": "Detailed registration requirements", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "REG-19": {"ref": "REG-19", "src": 1, "status": "Partly done", "pri": "Low", "screen": "Service / Interpreter needed", "text": "Requirement: Optional. Notes: Yes/no and the language where needed.", "section": "Detailed registration requirements", "out": true, "mod": "REG", "sec": [], "corr": ["REG-12"], "chg": "Add interpreter-needed plus language to the profile or registration and default it into bookings.", "gap": "Not captured at registration; no interpreter language."}, "REG-20": {"ref": "REG-20", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Service / Preferred provider gender", "text": "Requirement: Recommended. Notes: Female / male / no preference; important for women and adolescent girls.", "section": "Detailed registration requirements", "out": true, "mod": "REG", "sec": ["SCHED"], "corr": ["REG-12"], "chg": "Add the preference to registration and profile and use it when listing/booking clinicians.", "gap": "Backend only; no UI, and not used for matching."}, "REG-21": {"ref": "REG-21", "src": 1, "status": "Partly done", "pri": "Low", "screen": "Accessibility / Disability / accessibility support", "text": "Requirement: Optional. Notes: Only service-relevant needs are collected.", "section": "Detailed registration requirements", "out": true, "mod": "REG", "sec": [], "corr": ["REG-05"], "chg": "Add an optional accessibility-needs field to registration/profile.", "gap": "Service-relevant disability need not captured at registration."}, "REG-22": {"ref": "REG-22", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Emergency / Emergency contact", "text": "Requirement: Optional. Notes: Name, relationship, and phone; with separate permission to make contact.", "section": "Detailed registration requirements", "out": true, "mod": "REG", "sec": [], "corr": ["REG-09"], "chg": "Add the emergency contact step and a permission-to-contact switch in the contacts form.", "gap": "Not collected at registration and separate permission to contact not exposed."}, "REG-23": {"ref": "REG-23", "src": 1, "status": "Partly done", "pri": "High", "screen": "Consent / Acceptance of the privacy notice", "text": "Requirement: Mandatory. Notes: Store the version, language, date, time, method, and the user/staff member who obtained it.", "section": "Detailed registration requirements", "out": true, "mod": "MIN", "sec": ["REG"], "corr": ["MIN-06"], "chg": "Add a mandatory privacy-notice acceptance step to both flows writing a patient_consent row (version, language, method, staff user); ensure the notice is published.", "gap": "Privacy notice is not accepted explicitly at registration, staff-assisted consent not captured, and the policy must exist in the database."}, "REG-24": {"ref": "REG-24", "src": 1, "status": "Partly done", "pri": "High", "screen": "Consent / Telehealth consent", "text": "Requirement: Mandatory. Notes: Separate from general acceptance of the privacy notice.", "section": "Detailed registration requirements", "out": true, "mod": "MIN", "sec": ["CONS"], "corr": ["MIN-06"], "chg": "Publish a required telehealth policy and enforce it before booking or joining a consultation; consider failing closed.", "gap": "Depends on an admin publishing a telehealth policy; not enforced at booking or consultation."}, "REG-25": {"ref": "REG-25", "src": 1, "status": "Not done", "pri": "High", "screen": "Consent / Psychosocial support consent", "text": "Requirement: Conditional. Notes: Documented only when a psychosocial support service is requested.", "section": "Detailed registration requirements", "out": true, "mod": "MHPSS", "sec": ["MIN"], "corr": ["MHPSS-09"], "chg": "Add a conditional psychosocial consent (granted via patient_consent) after request, without blocking crisis access.", "gap": "No psychosocial-support consent captured when the service is requested."}, "REG-26": {"ref": "REG-26", "src": 1, "status": "Not done", "pri": "High", "screen": "Consent / Referral consent", "text": "Requirement: Conditional. Notes: Documented at the point of referral in accordance with the approved policy.", "section": "Detailed registration requirements", "out": true, "mod": "MIN", "sec": ["REF"], "corr": ["MIN-07"], "chg": "Add a referral consent capture (checkbox plus ledger row) to the referral form and SP per the approved policy.", "gap": "Referral consent is not documented at referral."}, "REG-27": {"ref": "REG-27", "src": 1, "status": "Not done", "pri": "High", "screen": "Consent / Recording consent", "text": "Requirement: Conditional / separate. Notes: Never bundled into general consent; recording should be off by default unless otherwise approved.", "section": "Detailed registration requirements", "out": true, "mod": "CONS", "sec": ["MIN"], "corr": ["CONS-02"], "chg": "Require explicit recording consent from all parties before recording starts and log it in the consent ledger.", "gap": "No separate recording consent, no record of it."}, "REG-28": {"ref": "REG-28", "src": 1, "status": "Not done", "pri": "Medium", "screen": "Audit / Registration channel", "text": "Requirement: Automatic. Notes: Self-service via the app / clinic / center / field worker / assisted registration.", "section": "Detailed registration requirements", "out": true, "mod": "REG", "sec": ["SEC"], "corr": ["REG-14"], "chg": "Add registered_via to patient, set it in self-register SP ('app') and sp_patient_register ('staff'/facility) plus a field-worker option.", "gap": "Channel (app/clinic/field worker/assisted) not recorded."}, "REG-29": {"ref": "REG-29", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Audit / Created by / date and time / device and channel", "text": "Requirement: Automatic. Notes: Required for traceability.", "section": "Detailed registration requirements", "out": true, "mod": "SEC", "sec": ["REG"], "corr": ["SEC-05"], "chg": "Add device/channel capture and an audit-log write in the register SPs.", "gap": "Created by and time exist; device and channel do not; registration is not audit-logged."}, "REG-30": {"ref": "REG-30", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Audit / Last updated by / date and time", "text": "Requirement: Automatic. Notes: Maintain a historical log of material changes to the profile.", "section": "Detailed registration requirements", "out": true, "mod": "SEC", "sec": ["REG"], "corr": ["SEC-05"], "chg": "Write before/after audit entries on patient update (name, DOB, mobile, ID, guardian) via sp_auditlog_write.", "gap": "Last update is tracked but not a historical log of material changes."}, "DOM-01": {"ref": "DOM-01", "src": 1, "status": "Done", "pri": "Medium", "screen": "Allergies", "text": "What must be documented: Drug/food/other allergies and the nature of the reaction, if known.. Data type: Clinical", "section": "Detailed registration requirements", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None required to document; consider a persistent structured allergy list on the patient.", "gap": "Allergy is per consultation free text, not a persistent structured patient allergy list."}, "DOM-02": {"ref": "DOM-02", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Current medication", "text": "What must be documented: Drug name and dose/frequency if known.. Data type: Clinical", "section": "Detailed registration requirements", "out": true, "mod": "EMR", "sec": [], "corr": ["EMR-04"], "chg": "Add current medication (name, dose, frequency) to the case sheet or wire clinical_profile with a screen.", "gap": "No current-medication-at-intake field."}, "DOM-03": {"ref": "DOM-03", "src": 1, "status": "Partly done", "pri": "Low", "screen": "Chronic conditions", "text": "What must be documented: Approved structured list + free-text details where necessary.. Data type: Clinical", "section": "Detailed registration requirements", "out": true, "mod": "EMR", "sec": [], "corr": ["EMR-04"], "chg": "Add a chronic condition master/picklist feeding the problem list, with detail text.", "gap": "No approved structured chronic list with free-text details."}, "DOM-04": {"ref": "DOM-04", "src": 1, "status": "Done", "pri": "-", "screen": "Previous surgery / significant medical history", "text": "What must be documented: Clinically relevant history only.. Data type: Clinical", "section": "Detailed registration requirements", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "DOM-05": {"ref": "DOM-05", "src": 1, "status": "Not done", "pri": "Medium", "screen": "Pregnancy / breastfeeding", "text": "What must be documented: Where applicable and clinically proportionate.. Data type: Sensitive clinical", "section": "Detailed registration requirements", "out": true, "mod": "EMR", "sec": ["SEC"], "corr": ["EMR-05"], "chg": "Add a sensitive, role-restricted pregnancy/breastfeeding field to the case sheet or wire clinical_profile.", "gap": "No pregnancy/breastfeeding field."}, "DOM-06": {"ref": "DOM-06", "src": 1, "status": "Partly done", "pri": "Low", "screen": "Disability / accessibility needs", "text": "What must be documented: Only the information needed to adapt care/access.. Data type: Sensitive", "section": "Detailed registration requirements", "out": true, "mod": "EMR", "sec": ["REG"], "corr": ["EMR-04"], "chg": "Add a minimal disability and access-need field to the profile or case sheet.", "gap": "No disability or adaptation note in the clinical record."}, "DOM-07": {"ref": "DOM-07", "src": 1, "status": "Done", "pri": "-", "screen": "Blood group", "text": "What must be documented: If known; entry is not enforced.. Data type: Clinical", "section": "Detailed registration requirements", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "DOM-08": {"ref": "DOM-08", "src": 1, "status": "Done", "pri": "-", "screen": "Presenting complaint / symptoms", "text": "What must be documented: Structured intake with doctor review.. Data type: Clinical", "section": "Detailed registration requirements", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "DOM-09": {"ref": "DOM-09", "src": 1, "status": "Done", "pri": "-", "screen": "Vital signs", "text": "What must be documented: Validated physiological fields with hard and soft limits.. Data type: Clinical", "section": "Detailed registration requirements", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "DOM-10": {"ref": "DOM-10", "src": 1, "status": "Done", "pri": "-", "screen": "Emergency symptoms / warning signs", "text": "What must be documented: Trigger the approved urgent referral/triage pathway, not a simple booking journey.. Data type: Clinical safety", "section": "Detailed registration requirements", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "MIN-01": {"ref": "MIN-01", "src": 1, "status": "Partly done", "pri": "High", "screen": "Age detection", "text": "Expected behavior: Date of birth automatically calculates age. An age under 18 triggers the minor registration journey.. Control / note: An ordinary user must not be able to bypass it into the adult journey.", "section": "Detailed registration requirements", "out": true, "mod": "MIN", "sec": ["REG"], "corr": ["MIN-01"], "chg": "Make DOB mandatory in sp_useraccount_selfregister and the patient/web forms. Add staff ID-based DOB verification and a review flag for unverified DOB. Reject registration without DOB.", "gap": "A user can bypass the minor journey by leaving DOB blank (or entering a false adult DOB); DOB is not mandatory and there is no verification against ID."}, "MIN-02": {"ref": "MIN-02", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Child identity", "text": "Expected behavior: Child’s name, date of birth, sex, location, language, and safe contact where applicable.. Control / note: Use the minimum data necessary.", "section": "Detailed registration requirements", "out": true, "mod": "MIN", "sec": ["REG"], "corr": ["MIN-03"], "chg": "Add sex and governorate/location to the minor registration form and selfregister SP. Prompt for safe contact at sign-up for minors. Keep minimum-data principle (optional where policy allows).", "gap": "Sex and location are not collected at registration; safe contact is not captured at registration."}, "MIN-03": {"ref": "MIN-03", "src": 1, "status": "Done", "pri": "-", "screen": "Guardian profile", "text": "Expected behavior: Full name, relationship, contact details, identity document/verification method, and verification status.. Control / note: A separate profile linked to the child, not merged into the child’s identity.", "section": "Detailed registration requirements", "out": false, "mod": "", "sec": [], "corr": [], "chg": "None", "gap": ""}, "MIN-04": {"ref": "MIN-04", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Guardian’s relationship to the", "text": "Expected behavior: Mother / father / judicial or legal guardian / authorized caregiver / other approved. Control / note: A defined list; an “other” option", "section": "Detailed registration requirements", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-03"], "chg": "Add a relationship_other text input and persist it in sp_useraccount_selfregister. Force guardian verification (pending) review for 'other' relationships.", "gap": "'Other' is not accompanied by a stored explanation at self-registration and no verification is demanded for it."}, "MIN-05": {"ref": "MIN-05", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "child", "text": "Expected behavior: representative.. Control / note: requires an explanation/verification.", "section": "Detailed registration requirements", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-03"], "chg": "Require explanation text and queue guardian verification for 'other' (see MIN-04).", "gap": "No enforced explanation/verification for 'other' on the patient self-registration path."}, "MIN-06": {"ref": "MIN-06", "src": 1, "status": "Partly done", "pri": "High", "screen": "Guardian verification", "text": "Expected behavior: Record the verification method, date and time, and the staff member who carried it out.. Control / note: Status: verified / pending / verification not possible.", "section": "Detailed registration requirements", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-04"], "chg": "Add a 'Verify guardian' action to Patient 360 / PatSearch calling /guardian/verify. Stamp actor/time for every status. Create a pending verification row at registration.", "gap": "No UI for staff to record verification; self-registered guardians have no verification row (shows blank/pending); verification-by/time not stored for pending/not_possible."}, "MIN-07": {"ref": "MIN-07", "src": 1, "status": "Partly done", "pri": "High", "screen": "Guardian consent", "text": "Expected behavior: Account creation, health data processing, telehealth, EMR, referral, communications, and psychosocial support as applicable.. Control / note: Store each consent purpose/version separately.", "section": "Detailed registration requirements", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-05"], "chg": "Seed one policy per required purpose with version. Add a staff 'record guardian consent' UI. Verify per-purpose rows are stored on live data.", "gap": "Purpose list for minors not confirmed against the six required purposes; guardian-consent capture is in the patient app on the child's login, with staff grant-behalf having no visible UI."}, "MIN-08": {"ref": "MIN-08", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Child / adolescent assent", "text": "Expected behavior: Record whether the service was explained and whether the child/adolescent assented, where applicable under the approved policy.. Control / note: Yes / no / assent not possible + reason.", "section": "Detailed registration requirements", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-05"], "chg": "Add an 'explained' boolean and require reason for no/not_possible in sp_assent_record. Add assent capture to staff registration/Patient 360.", "gap": "No staff-side assent capture; 'explained' flag absent; reason not mandatory when assent not possible."}, "MIN-09": {"ref": "MIN-09", "src": 1, "status": "Partly done", "pri": "High", "screen": "Safe communication", "text": "Expected behavior: Define the safe communication channel with the child/guardian and the safe time.. Control / note: It must not be assumed that the guardian’s number is always safe.", "section": "Detailed registration requirements", "out": true, "mod": "MIN", "sec": ["NOTIF"], "corr": ["MIN-10"], "chg": "Add child-safe channel and guardian channel fields with unknown-by-default, drive notification routing from them, and prompt in minor registration.", "gap": "No separate child vs guardian channel; guardian number is used by default for notifications; safe-contact not part of registration."}, "MIN-10": {"ref": "MIN-10", "src": 1, "status": "Not done", "pri": "High", "screen": "Sensitive service trigger", "text": "Expected behavior: A minor requesting a mental health/GBV/safeguarding service triggers the enhanced safeguarding pathway.. Control / note: More restrictive behavior for access and notifications.", "section": "Detailed registration requirements", "out": true, "mod": "MHPSS", "sec": ["MIN"], "corr": ["MHPSS-09"], "chg": "In the MHPSS request SPs, detect patient_type='Minor', auto-flag safeguarding_status and raise a safeguarding_escalation, and apply restricted notifications.", "gap": "No automatic enhanced safeguarding pathway on a minor's sensitive-service request; no restricted notification behaviour is applied automatically."}, "MIN-11": {"ref": "MIN-11", "src": 1, "status": "Not done", "pri": "High", "screen": "Guardian safety assessment", "text": "Expected behavior: Safe to contact / unsafe / unknown — requires assessment.. Control / note: Restricted to authorized safeguarding/psychosocial support users.", "section": "Detailed registration requirements", "out": true, "mod": "MHPSS", "sec": ["MIN"], "corr": ["MHPSS-05"], "chg": "Add SPs/endpoints/UI to record the assessment and restrict to a safeguarding/psychosocial role.", "gap": "No guardian safe/unsafe/unknown assessment; the set endpoint is open to ADM/MGR/HW rather than a dedicated safeguarding role."}, "MIN-12": {"ref": "MIN-12", "src": 1, "status": "Partly done", "pri": "High", "screen": "Unsafe guardian behavior", "text": "Expected behavior: Where unsafe/unknown, guardian SMS, calls, and notifications for the protected service are suppressed.. Control / note: Ordinary registration/support staff cannot override this.", "section": "Detailed registration requirements", "out": true, "mod": "MHPSS", "sec": ["NOTIF"], "corr": ["MHPSS-06"], "chg": "Restrict set/clear to the safeguarding role with audit. Suppress for unsafe AND unknown. Suppress SMS/calls to guardian.contact_phone.", "gap": "Ordinary registration/support staff (HW/ADM) can clear the status; unknown guardians are not suppressed by default; guardian phone SMS path not covered."}, "MIN-13": {"ref": "MIN-13", "src": 1, "status": "Partly done", "pri": "High", "screen": "Safeguarding review", "text": "Expected behavior: Refer to the authorized safeguarding/psychosocial officer to approve an alternative consent/authority/emergency pathway.. Control / note: The platform implements policy; it does not create legal authority.", "section": "Detailed registration requirements", "out": true, "mod": "MHPSS", "sec": ["SEC", "MIN"], "corr": ["MHPSS-04"], "chg": "Create a Safeguarding Officer role and an approval workflow for alternate consent/authority; document that approvals are policy decisions.", "gap": "No safeguarding officer role/workflow to approve an alternative consent or authority pathway."}, "MIN-14": {"ref": "MIN-14", "src": 1, "status": "Partly done", "pri": "High", "screen": "Protected case ID", "text": "Expected behavior: Use a pseudonymous/protected case identifier for MHPSS and GBV services where this has been approved.. Control / note: Limit identity visibility to authorized roles.", "section": "Detailed registration requirements", "out": true, "mod": "MHPSS", "sec": ["SEC"], "corr": ["MHPSS-10"], "chg": "Return case_ref only (no name) to non-treating roles and add a reveal-identity permission for authorised roles.", "gap": "Pseudonymous ID is not used to limit identity visibility; ADM/MGR see names with case details."}, "MIN-15": {"ref": "MIN-15", "src": 1, "status": "Partly done", "pri": "High", "screen": "Minor confidentiality", "text": "Expected behavior: Guardian access to sensitive records must follow the approved safeguarding/clinical policy, not automatic full access.. Control / note: Particularly important for MHPSS and GBV services.", "section": "Detailed registration requirements", "out": true, "mod": "MHPSS", "sec": ["MIN"], "corr": ["MHPSS-07"], "chg": "Add a sensitive-record category flag so patient/guardian reads of MHPSS/GBV items are denied or released only by clinician approval.", "gap": "No policy-driven, record-type level restriction of guardian access to MHPSS/GBV; it is all-or-nothing."}, "MIN-16": {"ref": "MIN-16", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Transition at 18", "text": "Expected behavior: On reaching 18, transition to “adult” status, retaining historical guardian consent, and requesting fresh adult consent and updated communication options.. Control / note: Historical audit/consent data is not deleted.", "section": "Detailed registration requirements", "out": true, "mod": "MIN", "sec": [], "corr": ["MIN-11", "MIN-12"], "chg": "Schedule the sweep (background worker or job). Mark consents for re-confirmation and prompt the new adult at next login for consent and comm options.", "gap": "Sweep is not scheduled in code; no adult re-consent or comm-preference prompt at 18."}, "ROL-01": {"ref": "ROL-01", "src": 1, "status": "Partly done", "pri": "High", "screen": "Registration / reception", "text": "May view: Basic identity data, contact, and guardian status needed for registration.. May NOT routinely view: No access to mental health notes, GBV narrative, risk assessment, or protected referral details.", "section": "Detailed registration requirements", "out": true, "mod": "SEC", "sec": ["REG"], "corr": ["SEC-01"], "chg": "Define a Registration role limited to identity/contact/guardian status; remove risk_level/is_gbv_case from admin-list.", "gap": "No reception role; registration staff are general HW/ADM with broader clinical read access, and admin list exposes risk/GBV flag."}, "ROL-02": {"ref": "ROL-02", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "General health worker", "text": "May view: General clinical intake data relevant to the task assigned to them.. May NOT routinely view: No access to the protected MHPSS or GBV narrative other than with specific authorization and clinical necessity.", "section": "Detailed registration requirements", "out": true, "mod": "SEC", "sec": [], "corr": ["SEC-03"], "chg": "Document the policy and add task/assignment-scoped reads for HW if required.", "gap": "No 'specific authorization' mechanism; the narrative is simply unavailable to HW (more restrictive than needed) but general EMR reads are not task-limited."}, "ROL-03": {"ref": "ROL-03", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Doctor", "text": "May view: The general clinical record relevant to treatment; and the approved alerts.. May NOT routinely view: MHPSS and GBV details on an approved need-to-know basis only.", "section": "Detailed registration requirements", "out": true, "mod": "SEC", "sec": ["MHPSS"], "corr": ["SEC-03"], "chg": "Add a need-to-know disclosure (counsellor releases a summary/alert to the treating doctor, logged).", "gap": "Doctors have no route to MHPSS/GBV detail even on a need-to-know basis, and no approved-alert feature."}, "ROL-04": {"ref": "ROL-04", "src": 1, "status": "Partly done", "pri": "Medium", "screen": "Counsellor", "text": "May view: The relevant mental health case, consent/assent, risk, and safe contact information.. May NOT routinely view: No access to unnecessary financial/administrative data.", "section": "Detailed registration requirements", "out": tru
